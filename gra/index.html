ем прочитайте вслух диалог собеседования и замените ответы на свои.","ts":"Пройдите вслух «собеседование»: о себе, опыт, почему эта работа, вопросы работодателю (2 минуты).","tw":"Напишите короткое сопроводительное письмо к резюме (5–6 предложений)."},{"d":45,"s":2,"wk":7,"t":"Покупки онлайн и возврат","tp":"Zakupy w internecie","w":[["zamówić","заказать"],["zamówienie","заказ"],["dostawa","доставка"],["zwrot","возврат"],["reklamacja","рекламация, жалоба на брак"],["rozmiar","размер"],["gwarancja","гарантия"],["kurier","курьер"]],"p":[["Chcę zwrócić ten towar.","Я хочу вернуть этот товар."],["Paczka nie dotarła.","Посылка не дошла."],["Składam reklamację.","Я подаю рекламацию."]],"g":{"t":"Вид глагола","x":"Как в русском: несовершенный — процесс и повтор, совершенный — результат. zamawiać/zamówić, kupować/kupić, płacić/zapłacić, pisać/napisać. «Często zamawiam online» — «Wczoraj zamówiłam buty».","e":[["Zawsze płacę kartą.","Я всегда плачу картой."],["Wczoraj zapłaciłam za zamówienie.","Вчера я оплатила заказ."]]},"dl":[["Konsultant","Dzień dobry, w czym mogę pomóc?","Здравствуйте, чем могу помочь?"],["Ty","Zamówiłam buty, ale rozmiar jest za mały.","Я заказала обувь, но размер слишком маленький."],["Konsultant","Może pani je zwrócić w ciągu czternastu dni.","Вы можете вернуть её в течение 14 дней."],["Ty","Czy zwrot jest darmowy?","Возврат бесплатный?"],["Konsultant","Tak, przez paczkomat.","Да, через почтомат."]],"r":{"pl":"Często zamawiam rzeczy przez internet. Dostawa jest szybka: kurier albo paczkomat. Raz zamówiłam kurtkę, ale była za duża. Zrobiłam zwrot i pieniądze wróciły na konto po kilku dniach.","ru":"Я часто заказываю вещи через интернет. Доставка быстрая: курьер или почтомат. Однажды заказала куртку, но она была слишком большой. Оформила возврат, и через несколько дней деньги вернулись на счёт."},"ff":["zakaz","заказ","запрет («zakaz palenia» — курить запрещено); заказ = zamówienie"],"lf":"Покупку в интернет-магазине по закону можно вернуть в течение 14 дней без объяснения причин. Allegro — главный польский маркетплейс.","ts":"Объясните вслух консультанту, что не так с заказом, и попросите возврат.","tw":"Составьте 3 пары предложений: несовершенный вид (часто/всегда) и совершенный (вчера)."},{"d":46,"s":2,"wk":7,"t":"Парикмахер и услуги","tp":"U fryzjera","w":[["fryzjer","парикмахер"],["umówić się","записаться, договориться"],["strzyżenie","стрижка"],["krótko","коротко"],["długo","долго; длинно"],["kolor","цвет"],["grzywka","чёлка"],["wolny termin","свободное время (для записи)"]],"p":[["Chciałabym się umówić na strzyżenie.","Я хотела бы записаться на стрижку."],["Tylko trochę krócej, proszę.","Только чуть короче, пожалуйста."],["Ile to będzie kosztować?","Сколько это будет стоить?"]],"g":{"t":"Сравнение наречий","x":"krótko → krócej, długo → dłużej, szybko → szybciej, wolno → wolniej, dobrze → lepiej, źle → gorzej. Как русское «короче, дольше, быстрее, лучше».","e":[["Proszę mówić wolniej.","Говорите медленнее."],["Dziś czuję się lepiej.","Сегодня мне лучше."]]},"dl":[["Fryzjerka","Dzień dobry, co robimy?","Здравствуйте, что делаем?"],["Ty","Strzyżenie. Tylko trochę krócej.","Стрижку. Только чуть короче."],["Fryzjerka","Grzywkę też?","Чёлку тоже?"],["Ty","Tak, ale nie za krótko!","Да, но не слишком коротко!"],["Fryzjerka","Dobrze, będzie pięknie.","Хорошо, будет красиво."]],"r":{"pl":"Raz w miesiącu chodzę do fryzjera. Umawiam się przez aplikację, bo tak jest szybciej. Fryzjerka pyta, czego chcę. Mówię: «Krócej z tyłu, dłużej z przodu». Na koniec patrzę w lustro i jestem zadowolona.","ru":"Раз в месяц я хожу к парикмахеру. Записываюсь через приложение, так быстрее. Мастер спрашивает, чего я хочу. Я говорю: «Сзади короче, спереди длиннее». В конце смотрю в зеркало и довольна."},"ff":["kwiat","цвет","цветок; цвет = kolor. А «lustro» — зеркало, а не люстра (люстра = żyrandol)"],"lf":"Многих мастеров записывают через приложение Booksy: там видны свободные «terminy».","ts":"Объясните вслух мастеру, какую стрижку хотите (4 фразы с krócej / dłużej).","tw":"Образуйте сравнительную степень: szybko, wolno, dobrze, źle, długo."},{"d":47,"s":2,"wk":7,"t":"Машина и автосервис","tp":"Samochód i warsztat","w":[["samochód","автомобиль"],["warsztat","автосервис, мастерская"],["opona","шина"],["przegląd","техосмотр"],["stacja benzynowa","заправка"],["tankować","заправлять"],["prawo jazdy","водительские права"],["mechanik","механик"]],"p":[["Coś stuka w silniku.","Что-то стучит в двигателе."],["Kiedy samochód będzie gotowy?","Когда машина будет готова?"],["Do pełna, proszę.","Полный бак, пожалуйста."]],"g":{"t":"Творительный: на чём? с кем?","x":"Транспорт — творительным, как русское «ехать автобусом»: samochodem, autobusem, pociągiem (м.р. -em), taksówką (ж.р. -ą). «С кем/чем» — z + творительный: z mężem, z kolegą, z koleżanką.","e":[["Jeżdżę do pracy samochodem.","Я езжу на работу на машине."],["Jadę na zakupy z mężem.","Я еду за покупками с мужем."]]},"dl":[["Mechanik","Co się dzieje z samochodem?","Что с машиной?"],["Ty","Coś stuka, kiedy hamuję.","Что-то стучит, когда я торможу."],["Mechanik","Trzeba sprawdzić hamulce. Proszę zostawić auto do jutra.","Нужно проверить тормоза. Оставьте машину до завтра."],["Ty","Ile to może kosztować?","Сколько это может стоить?"],["Mechanik","Zadzwonię, jak sprawdzę.","Позвоню, когда проверю."]],"r":{"pl":"Mamy stary samochód, więc często jestem w warsztacie. Raz w roku robimy przegląd techniczny. Zimą zmieniamy opony na zimowe. Na stacji benzynowej mówię: «Do pełna, proszę» i płacę kartą. Mechanik jest uczciwy i zawsze tłumaczy, co naprawił.","ru":"У нас старая машина, поэтому я часто бываю в автосервисе. Раз в год проходим техосмотр. Зимой меняем шины на зимние. На заправке говорю: «Полный бак, пожалуйста» и плачу картой. Механик честный и всегда объясняет, что починил."},"ff":["mandat","мандат","штраф (от полиции); депутатский мандат — mandat poselski"],"lf":"Техосмотр (przegląd) обязателен: следите за датой в техпаспорте (dowód rejestracyjny). Водительские права из страны вне ЕС в Польше действуют ограниченное время — проверьте правила для своего случая на gov.pl.","ts":"Объясните вслух механику проблему с машиной, спросите цену и срок.","tw":"Напишите 4 фразы «на чём / с кем» с творительным падежом."},{"d":48,"s":2,"wk":7,"t":"Семья: кто есть кто","tp":"Rodzina","w":[["rodzice","родители"],["mama","мама"],["tata","папа"],["brat","брат"],["siostra","сестра"],["dziadkowie","бабушка и дедушка"],["wnuk","внук"],["teściowa","свекровь, тёща"]],"p":[["Mam starszego brata.","У меня есть старший брат."],["Moja mama jest nauczycielką.","Моя мама — учительница."],["Jesteśmy w kontakcie codziennie.","Мы на связи каждый день."]],"g":{"t":"Kim jesteś? Быть + творительный","x":"Как в русском «быть кем»: Jestem żoną. On jest lekarzem. Ona jest nauczycielką. Окончания: м.р. -em (lekarz → lekarzem), ж.р. -ą (żona → żoną). Но после «to» — именительный: «To jest mój brat».","e":[["Mój brat jest kierowcą.","Мой брат — водитель."],["To jest moja siostra.","Это моя сестра."]]},"dl":[["Sąsiadka","Masz rodzeństwo?","У тебя есть братья, сёстры?"],["Ty","Tak, mam brata i siostrę.","Да, есть брат и сестра."],["Sąsiadka","Gdzie mieszkają?","Где они живут?"],["Ty","Brat mieszka w Mińsku, a siostra w Niemczech.","Брат живёт в Минске, а сестра — в Германии."],["Sąsiadka","A rodzice?","А родители?"],["Ty","Rodzice są na emeryturze i przyjadą do nas latem.","Родители на пенсии и приедут к нам летом."]],"r":{"pl":"Moja rodzina jest duża. Rodzice mieszkają na Białorusi. Tata jest emerytem, a mama pracuje jako księgowa. Mój brat jest kierowcą, a siostra jest pielęgniarką w Niemczech. Teściowa mieszka blisko nas i często przychodzi na obiad.","ru":"У меня большая семья. Родители живут в Беларуси. Папа на пенсии, а мама работает бухгалтером. Мой брат — водитель, а сестра — медсестра в Германии. Свекровь живёт рядом и часто приходит на обед."},"ff":["narzeczona","наречённая","невеста (до свадьбы); на свадьбе — panna młoda"],"lf":"«Rodzeństwo» — братья и сёстры вместе. Одного такого слова в русском нет.","ts":"Расскажите вслух о 4 членах семьи: кто они и кем работают.","tw":"Напишите 4 предложения по схеме «X jest + творительный»."},{"d":49,"s":2,"wk":7,"t":"Дом, мусор и соседи","tp":"Dom i sąsiedzi","w":[["sprzątać","убирать"],["śmieci","мусор"],["segregacja","сортировка"],["kosz","бак, корзина"],["sąsiad","сосед"],["cisza nocna","ночная тишина"],["hałas","шум"],["administracja","управляющая компания"]],"p":[["Gdzie wyrzucać szkło?","Куда выбрасывать стекло?"],["Przepraszam, jest za głośno.","Извините, слишком шумно."],["Cisza nocna jest od dwudziestej drugiej.","Ночная тишина с 22:00."]],"g":{"t":"Предложный падеж: где?","x":"w domu, w kuchni, na balkonie, w pokoju, na ulicy, w szkole. Окончания: -e (w szkole), -u (w domu), -i после мягких (w kuchni). Как русское «в доме, на кухне».","e":[["Kosze są na podwórku.","Мусорные баки во дворе."],["Mieszkam w bloku na trzecim piętrze.","Я живу в многоэтажке на третьем этаже."]]},"dl":[["Sąsiad","Dzień dobry! Pani tu nowa?","Здравствуйте! Вы здесь новенькая?"],["Ty","Tak, mieszkam pod dwunastką. Gdzie wyrzucać śmieci?","Да, живу в двенадцатой. Куда выбрасывать мусор?"],["Sąsiad","Kosze są na podwórku. Papier do niebieskiego, szkło do zielonego.","Баки во дворе. Бумага — в синий, стекло — в зелёный."],["Ty","A plastik?","А пластик?"],["Sąsiad","Do żółtego, razem z metalem.","В жёлтый, вместе с металлом."]],"r":{"pl":"W Polsce segregujemy śmieci. Papier wrzucam do niebieskiego kosza, szkło do zielonego, plastik i metal do żółtego, a resztki jedzenia do brązowego. Reszta to śmieci zmieszane. W bloku obowiązuje cisza nocna. Sąsiedzi są mili, jeśli my też jesteśmy uprzejmi.","ru":"В Польше мусор сортируют. Бумагу я бросаю в синий бак, стекло — в зелёный, пластик и металл — в жёлтый, остатки еды — в коричневый. Остальное — смешанный мусор. В доме действует ночная тишина. Соседи приятные, если мы тоже вежливы."},"ff":["kuchenka","кухонька","плита; маленькая кухня — aneks kuchenny"],"lf":"Цвета баков: синий — бумага, зелёный — стекло, жёлтый — пластик и металл, коричневый — био, остальное — «zmieszane».","ts":"Объясните вслух новому соседу, куда выбрасывать мусор.","tw":"Поставьте в предложный падеж: dom, kuchnia, balkon, szkoła, ulica."},{"d":50,"s":2,"wk":7,"t":"Школа и детский сад","tp":"Szkoła i przedszkole","w":[["przedszkole","детский сад"],["żłobek","ясли"],["szkoła","школа"],["nauczycielka","учительница"],["wychowawczyni","классная руководительница"],["zebranie","собрание"],["zapisać dziecko","записать ребёнка"],["klasa","класс"]],"p":[["Chcę zapisać dziecko do przedszkola.","Я хочу записать ребёнка в детский сад."],["Kiedy jest zebranie z rodzicami?","Когда родительское собрание?"],["Jak sobie radzi mój syn?","Как справляется мой сын?"]],"g":{"t":"O + предложный: о ком, о чём","x":"rozmawiać o dziecku, myśleć o pracy, mówić o szkole — как русское «говорить о ребёнке».","e":[["Rozmawiamy o synu.","Мы говорим о сыне."],["Myślę o przyszłości.","Я думаю о будущем."]]},"dl":[["Wychowawczyni","Dzień dobry, jestem wychowawczynią Maksa.","Здравствуйте, я классный руководитель Макса."],["Ty","Dzień dobry. Jak sobie radzi syn?","Здравствуйте. Как справляется сын?"],["Wychowawczyni","Bardzo dobrze. Szybko uczy się polskiego.","Очень хорошо. Быстро учит польский."],["Ty","Cieszę się! A z czym ma problem?","Я рада! А с чем у него трудности?"],["Wychowawczyni","Czasem z matematyką, ale to normalne.","Иногда с математикой, но это нормально."]],"r":{"pl":"Nasz syn chodzi do polskiej szkoły. Na początku było mu trudno, ale teraz ma kolegów i mówi po polsku lepiej niż ja! Raz w miesiącu jest zebranie z rodzicami. Wychowawczyni pisze do nas przez dziennik elektroniczny.","ru":"Наш сын ходит в польскую школу. Сначала ему было трудно, а теперь у него есть друзья, и по-польски он говорит лучше меня! Раз в месяц родительское собрание. Классная руководительница пишет нам через электронный журнал."},"ff":["dziennik","дневник","в школе — электронный журнал (Librus, Vulcan); ещё — ежедневная газета"],"lf":"В детсад и школу записывают через gmina, часто онлайн и весной. Детям-иностранцам положены дополнительные бесплатные уроки польского.","ts":"Сыграйте вслух разговор с учительницей о ребёнке.","tw":"Напишите 4 фразы с «o + предложный»."},{"d":51,"s":2,"wk":7,"type":"rev","t":"Повторение: неделя 7","tp":"Powtórka","rng":[45,50],"x":"Повторяем сервисы и быт: покупки онлайн, парикмахер, автосервис, семья, соседи, школа. Пройдите тест. Отдельно повторите падежи недели: творительный и предложный.","ts":"Расскажите вслух о своей семье и доме: кто где живёт, кто кем работает (2 минуты).","tw":"Напишите в интернет-магазин: товар не подошёл по размеру, вы хотите возврат."},{"d":52,"s":2,"wk":8,"t":"Свободное время и хобби","tp":"Czas wolny","w":[["czas wolny","свободное время"],["lubić","любить, нравиться"],["interesować się","интересоваться"],["spacer","прогулка"],["kino","кино"],["książka","книга"],["sport","спорт"],["muzyka","музыка"]],"p":[["Co robisz w wolnym czasie?","Что ты делаешь в свободное время?"],["Interesuję się historią.","Я интересуюсь историей."],["Lubię chodzić na spacery.","Я люблю гулять."]],"g":{"t":"Lubić и interesować się","x":"lubić + инфинитив или винительный: lubię czytać, lubię kawę. interesować się + творительный, как в русском «интересоваться чем»: interesuję się sportem, muzyką.","e":[["Mąż interesuje się piłką nożną.","Муж интересуется футболом."],["Nie lubię gotować.","Я не люблю готовить."]]},"dl":[["Kolega","Co lubisz robić w weekend?","Что ты любишь делать в выходные?"],["Ty","Lubię chodzić do kina i czytać.","Люблю ходить в кино и читать."],["Kolega","Jakie książki?","Какие книги?"],["Ty","Kryminały. Teraz czytam po polsku, powoli!","Детективы. Сейчас читаю по-польски, медленно!"],["Kolega","Brawo! Polecam Chmielewską.","Браво! Советую Хмелевскую."]],"r":{"pl":"W wolnym czasie lubię spacerować po parku. Interesuję się fotografią, więc zawsze mam aparat. Mąż woli sport: biega i gra w piłkę. Raz w miesiącu chodzimy do kina na polski film z napisami. To dobra lekcja języka!","ru":"В свободное время я люблю гулять в парке. Интересуюсь фотографией, поэтому фотоаппарат всегда со мной. Муж предпочитает спорт: бегает и играет в футбол. Раз в месяц ходим в кино на польский фильм с субтитрами. Хороший урок языка!"},"ff":["uważać","уважать","считать («uważam, że…») и быть осторожным («Uważaj!» — Осторожно!); уважать = szanować"],"lf":"Польские фильмы и сериалы с польскими субтитрами — сильная практика: чтение и слушание вместе помогают запоминать слова.","ts":"Расскажите вслух о своих хобби: что любите, чем интересуетесь (5 предложений).","tw":"Напишите 3 предложения с lubić и 3 с interesować się."},{"d":53,"s":2,"wk":8,"t":"Приглашение и встреча","tp":"Zaproszenie","w":[["zaproszenie","приглашение"],["spotkać się","встретиться"],["świętować","праздновать"],["wpaść","заглянуть, заскочить"],["impreza","вечеринка"],["urodziny","день рождения"],["prezent","подарок"],["tort","торт"]],"p":[["Zapraszam cię na urodziny!","Приглашаю тебя на день рождения!"],["Wpadniesz do nas w sobotę?","Заглянешь к нам в субботу?"],["Chętnie przyjdę!","С удовольствием приду!"]],"g":{"t":"Будущее совершенного вида","x":"Без «będę», как в русском: przyjdę (приду), zadzwonię (позвоню), kupię (куплю), spotkamy się (встретимся). Вежливый отказ: «Niestety nie mogę, mam inne plany».","e":[["Kupię prezent jutro.","Куплю подарок завтра."],["Spotkamy się przed kinem.","Встретимся перед кинотеатром."]]},"dl":[["Ania","W sobotę robię imprezę urodzinową. Przyjdziesz?","В субботу у меня день рождения. Придёшь?"],["Ty","Chętnie! O której?","С удовольствием! Во сколько?"],["Ania","O siódmej, u mnie w domu.","В семь, у меня дома."],["Ty","Super. Co mam przynieść?","Супер. Что принести?"],["Ania","Nic, tylko dobry humor!","Ничего, только хорошее настроение!"]],"r":{"pl":"W sobotę mam urodziny. Zapraszam przyjaciół na kolację. Kupię tort, a mąż zrobi sałatkę. Koleżanka z pracy napisała, że przyjdzie z mężem. Sąsiadka niestety nie może, bo wyjeżdża. Będzie wesoło!","ru":"В субботу у меня день рождения. Приглашаю друзей на ужин. Куплю торт, а муж сделает салат. Коллега написала, что придёт с мужем. Соседка, к сожалению, не может: уезжает. Будет весело!"},"ff":["zapraszać","запрашивать","приглашать («Zapraszam!» — Приглашаю! Проходите!)"],"lf":"«Zapraszam!» слышно постоянно: кассир зовёт к кассе, хозяин — к столу. Это просто «Пожалуйста, проходите».","ts":"Пригласите вслух друга на встречу (день, время, место). Затем вежливо откажитесь от приглашения.","tw":"Напишите приглашение на день рождения (SMS, 3–4 предложения)."},{"d":54,"s":2,"wk":8,"t":"В гостях","tp":"W gościach","w":[["gość","гость"],["gospodarz","хозяин (дома)"],["toast","тост"],["na zdrowie","за здоровье; на здоровье"],["częstować się","угощаться"],["dokładka","добавка"],["pyszne","очень вкусно"],["kwiaty","цветы"]],"p":[["Proszę się częstować!","Угощайтесь!"],["Było pyszne, dziękuję!","Было очень вкусно, спасибо!"],["Poproszę jeszcze dokładkę.","Можно ещё добавки?"]],"g":{"t":"Повелительное с «się»","x":"częstuj się! (угощайся), rozgość się! (располагайся), nie krępuj się! (не стесняйся). Группе: częstujcie się! Вежливо: «Proszę się częstować».","e":[["Rozgość się, czuj się jak u siebie.","Располагайся, чувствуй себя как дома."],["Częstujcie się!","Угощайтесь!"]]},"dl":[["Gospodyni","Wejdźcie, rozgośćcie się!","Заходите, располагайтесь!"],["Ty","Dziękujemy. To dla pani kwiaty.","Спасибо. Это вам цветы."],["Gospodyni","Jakie piękne! Proszę się częstować.","Какие красивые! Угощайтесь."],["Ty","Wszystko jest pyszne!","Всё очень вкусно!"],["Gospodyni","Na zdrowie! Zapraszam na dokładkę.","На здоровье! Берите добавку."]],"r":{"pl":"W Polsce do gości idzie się z kwiatami albo z ciastem. Gospodarze częstują obficie i zawsze proponują dokładkę. Przy stole wznosi się toast: «Na zdrowie!». Kiedy dziękuję za obiad, gospodyni odpowiada: «Na zdrowie!».","ru":"В Польше в гости идут с цветами или с пирогом. Хозяева угощают щедро и всегда предлагают добавку. За столом поднимают тост: «На здоровье!». Когда я благодарю за обед, хозяйка отвечает: «На здоровье!»."},"ff":["wesele","веселье","свадьба (праздник); веселье = zabawa"],"lf":"Хризантемы в Польше — цветы для кладбища, в гости их не дарят.","ts":"Сыграйте вслух визит в гости: приветствие, подарок, комплимент еде, прощание.","tw":"Напишите хозяйке SMS-благодарность за вечер."},{"d":55,"s":2,"wk":8,"t":"Путешествия по Польше","tp":"Podróże po Polsce","w":[["wycieczka","экскурсия, поездка"],["nocleg","ночлег, жильё"],["rezerwacja","бронь"],["góry","горы"],["morze","море"],["jezioro","озеро"],["zwiedzać","осматривать (достопримечательности)"],["zabytek","памятник архитектуры"]],"p":[["Jedziemy nad morze.","Мы едем на море."],["Czy macie wolne pokoje?","У вас есть свободные номера?"],["Co warto zwiedzić?","Что стоит посмотреть?"]],"g":{"t":"Куда и где: do, nad, w","x":"Куда? do + родительный (do Krakowa), nad + винительный (nad morze, nad jezioro), w + винительный (w góry). Где? nad + творительный (nad morzem), w + предложный (w górach). Типичная ошибка: «na morze» — правильно «nad morze».","e":[["Latem byliśmy nad morzem.","Летом мы были на море."],["Zimą jeździmy w góry.","Зимой мы ездим в горы."]]},"dl":[["Recepcja","Hotel Bałtyk, dzień dobry.","Отель «Балтик», добрый день."],["Ty","Dzień dobry, czy macie wolny pokój na weekend?","Здравствуйте, есть свободный номер на выходные?"],["Recepcja","Tak, pokój dwuosobowy ze śniadaniem.","Да, двухместный с завтраком."],["Ty","Ile kosztuje noc?","Сколько стоит ночь?"],["Recepcja","Trzysta pięćdziesiąt złotych.","Триста пятьдесят злотых."]],"r":{"pl":"Polska jest piękna i różnorodna. Na północy jest Morze Bałtyckie, na południu góry: Tatry i Karkonosze. Na Mazurach są setki jezior. W Krakowie i Gdańsku zwiedzamy zabytki. Najbardziej lubię wycieczki w góry.","ru":"Польша красивая и разнообразная. На севере Балтийское море, на юге горы: Татры и Карконоше. На Мазурах сотни озёр. В Кракове и Гданьске мы осматриваем памятники. Больше всего люблю поездки в горы."},"ff":["obraz","образ","картина; образ = wizerunek"],"lf":"Билеты на поезда удобно брать в приложениях перевозчиков. На дальние поезда заранее часто дешевле.","ts":"Расскажите вслух о поездке мечты по Польше: куда, на чём, что посмотрите.","tw":"Напишите 4 фразы: куда едете (do / nad / w) и где были (nad / w)."},{"d":56,"s":2,"wk":8,"t":"Внешность и характер","tp":"Wygląd i charakter","w":[["wysoki","высокий"],["niski","низкий"],["szczupły","стройный"],["włosy","волосы"],["oczy","глаза"],["miły","приятный, милый"],["sympatyczny","симпатичный, приятный"],["przystojny","красивый (о мужчине)"]],"p":[["Jak on wygląda?","Как он выглядит?"],["Ma krótkie, ciemne włosy.","У него короткие тёмные волосы."],["Jest bardzo sympatyczna.","Она очень приятная."]],"g":{"t":"Мн. ч. прилагательных: oni и one","x":"Для мужчин и смешанных групп особая форма: mili ludzie, wysocy mężczyźni, sympatyczni koledzy. Для женщин, детей, вещей — на -e: miłe kobiety, wysokie drzewa. Местоимения тоже разные: oni и one.","e":[["Moi koledzy są mili.","Мои коллеги (мужчины) приятные."],["Moje koleżanki są miłe.","Мои коллеги (женщины) приятные."]]},"dl":[["Koleżanka","Jak wygląda twój nowy szef?","Как выглядит твой новый начальник?"],["Ty","Jest wysoki i szczupły, ma ciemne włosy.","Высокий, стройный, тёмные волосы."],["Koleżanka","A jaki jest?","А какой он по характеру?"],["Ty","Miły i spokojny. Zawsze się uśmiecha.","Приятный и спокойный. Всегда улыбается."]],"r":{"pl":"Mój mąż jest wysoki i ma niebieskie oczy. Jest spokojny i bardzo pracowity. Moja przyjaciółka jest niska, ma długie, jasne włosy. Jest wesoła i zawsze mi pomaga. Moi sąsiedzi są starsi, ale bardzo sympatyczni.","ru":"Мой муж высокий, у него голубые глаза. Он спокойный и очень трудолюбивый. Моя подруга невысокая, у неё длинные светлые волосы. Она весёлая и всегда мне помогает. Мои соседи пожилые, но очень приятные."},"ff":["gruby","грубый","толстый («gruba książka» — толстая книга); грубый = niegrzeczny"],"lf":"О внешности поляки говорят мягко: вместо «gruby» скажут «puszysty» (пухленький).","ts":"Опишите вслух внешность и характер двух людей.","tw":"Поставьте во мн. ч.: miły kolega, miła koleżanka, wysoki mężczyzna, wysoka kobieta."},{"d":57,"s":2,"wk":8,"t":"Сравнение и выбор","tp":"Lepszy czy gorszy?","w":[["lepszy","лучше (лучший)"],["gorszy","хуже"],["większy","больше"],["mniejszy","меньше"],["tańszy","дешевле"],["droższy","дороже"],["najlepszy","самый лучший"],["wolę","я предпочитаю"]],"p":[["Który jest lepszy?","Какой лучше?"],["Ten jest tańszy, ale gorszy.","Этот дешевле, но хуже."],["Wolę herbatę niż kawę.","Я предпочитаю чай кофе."]],"g":{"t":"Степени сравнения","x":"Сравнительная: -szy (tani → tańszy, młody → młodszy) или -ejszy (ładny → ładniejszy). Неправильные: dobry → lepszy, zły → gorszy, duży → większy, mały → mniejszy. Превосходная: naj- + сравнительная (najlepszy, najtańszy). «Чем» — niż или od.","e":[["Warszawa jest większa niż Kraków.","Варшава больше Кракова."],["To najlepsza kawiarnia w mieście.","Это лучшее кафе в городе."]]},"dl":[["Sprzedawca","Polecam ten telefon albo tamten.","Советую этот телефон или тот."],["Ty","Który jest lepszy?","Какой лучше?"],["Sprzedawca","Ten jest droższy, ale ma lepszy aparat.","Этот дороже, но у него лучше камера."],["Ty","A tamten?","А тот?"],["Sprzedawca","Tańszy i lżejszy.","Дешевле и легче."],["Ty","Wolę tańszy.","Я предпочитаю подешевле."]],"r":{"pl":"Porównuję ceny w różnych sklepach. W dyskoncie jest taniej, ale wybór jest mniejszy. Na targu warzywa są droższe, ale smaczniejsze. Najlepsze pieczywo kupuję w małej piekarni. Wolę płacić trochę więcej za lepszą jakość.","ru":"Я сравниваю цены в разных магазинах. В дискаунтере дешевле, но выбор меньше. На рынке овощи дороже, но вкуснее. Лучший хлеб покупаю в маленькой пекарне. Предпочитаю платить чуть больше за лучшее качество."},"ff":["duży","дюжий","большой («duży dom» — большой дом); дюжий = silny, krzepki"],"lf":"На ценнике ищите «cena za kg» или «cena za litr» — так проще сравнивать.","ts":"Сравните вслух 2 магазина или 2 города (5 предложений).","tw":"Образуйте сравнительную и превосходную степень: tani, dobry, duży, ładny, drogi."},{"d":58,"s":2,"wk":8,"type":"rev","t":"Повторение: неделя 8","tp":"Powtórka","rng":[52,57],"x":"Повторяем общение: хобби, приглашения, гости, поездки, описание людей, сравнение. Пройдите тест. Перескажите вслух 2 чтения недели своими словами.","ts":"Расскажите вслух о лучшей поездке в своей жизни: куда, с кем, что понравилось (в прошедшем времени).","tw":"Напишите сравнение двух городов или двух стран (6 предложений)."},{"d":59,"s":2,"wk":8,"type":"exam","t":"Экзамен этапа 2","tp":"Egzamin 2","rng":[31,58],"x":"Контрольная работа второго месяца: 30 вопросов по дням 31–58 (здоровье, работа, сервисы, общение). Проходной балл — 70%. Если не набрали, повторите отмеченные слова и сдайте завтра.","ts":"Устная часть, 3 минуты: расскажите о своей работе (или поиске работы), здоровье и выходных. Используйте прошедшее и будущее время.","tw":"Письменная часть: e-mail работодателю о больничном (4–5 предложений) и приглашение друзьям в гости."},{"d":60,"s":2,"wk":8,"t":"Проект: моя неделя в Польше","tp":"Mój tydzień","w":[["najpierw","сначала"],["potem","потом"],["następnie","затем"],["w końcu","наконец"],["codziennie","каждый день"],["czasami","иногда"],["zawsze","всегда"],["nigdy","никогда"]],"p":[["Nigdy nie spóźniam się do pracy.","Я никогда не опаздываю на работу."],["Czasami gotuję polskie dania.","Иногда я готовлю польские блюда."],["Najpierw kawa, potem praca!","Сначала кофе, потом работа!"]],"g":{"t":"Двойное отрицание","x":"Как в русском: nigdy nie… (никогда не), nikt nie… (никто не), nic nie… (ничего не), nigdzie nie… (нигде не). Порядок рассказа: najpierw → potem → następnie → w końcu.","e":[["Nikt nie dzwonił.","Никто не звонил."],["Nic nie rozumiem!","Ничего не понимаю!"]]},"dl":[["Kolega","Jak wygląda twój tydzień?","Как проходит твоя неделя?"],["Ty","Codziennie pracuję do szesnastej, potem uczę się polskiego.","Каждый день работаю до 16, потом учу польский."],["Kolega","A weekend?","А выходные?"],["Ty","Najpierw sprzątanie, potem spacer, a w niedzielę nic nie robię!","Сначала уборка, потом прогулка, а в воскресенье ничего не делаю!"]],"r":{"pl":"Mój tydzień jest pracowity. Codziennie wstaję o szóstej. Najpierw piję kawę, potem jadę do pracy. Po pracy zawsze uczę się polskiego przez pół godziny. W środę chodzę na basen, a w piątek spotykam się z przyjaciółmi. W niedzielę nigdy nie pracuję. W końcu odpoczywam!","ru":"Моя неделя насыщенная. Каждый день встаю в шесть. Сначала пью кофе, потом еду на работу. После работы всегда полчаса учу польский. В среду хожу в бассейн, а в пятницу встречаюсь с друзьями. В воскресенье никогда не работаю. Наконец-то отдыхаю!"},"ff":["owszem","вовсе","да, конечно («Owszem, pamiętam» — да, помню); вовсе не = wcale nie"],"lf":"Запишите сегодня снова рассказ «Mój pierwszy dzień w Polsce» и сравните с записью дня 30.","ts":"Расскажите вслух «Моя неделя в Польше» (2 минуты) и запишите.","tw":"Напишите текст «Mój tydzień» (8–10 предложений) со словами najpierw, potem, zawsze, nigdy."},{"d":61,"s":3,"wk":9,"t":"Моё мнение","tp":"Moim zdaniem…","w":[["myślę, że…","я думаю, что…"],["uważam, że…","я считаю, что…"],["moim zdaniem","по-моему"],["wydaje mi się","мне кажется"],["zgadzam się","я согласна"],["nie zgadzam się","я не согласна"],["masz rację","ты прав(а)"],["na pewno","точно, наверняка"]],"p":[["Moim zdaniem to dobry pomysł.","По-моему, это хорошая идея."],["Nie do końca się zgadzam.","Я не совсем согласна."],["A ty co o tym myślisz?","А ты что об этом думаешь?"]],"g":{"t":"Że и czy","x":"«Że» — что: Myślę, że masz rację. «Czy» в косвенном вопросе — ли: Nie wiem, czy przyjdzie (не знаю, придёт ли). Перед «że» и «czy» обычно ставят запятую.","e":[["Wiem, że masz rację.","Я знаю, что ты прав."],["Zapytam, czy jest wolny termin.","Спрошу, есть ли свободное время."]]},"dl":[["Kolega","Co myślisz o pracy zdalnej?","Что ты думаешь об удалённой работе?"],["Ty","Moim zdaniem to wygodne, ale brakuje kontaktu z ludźmi.","По-моему, это удобно, но не хватает общения с людьми."],["Kolega","Masz rację. Ja wolę biuro.","Ты права. Я предпочитаю офис."],["Ty","Wydaje mi się, że najlepsza jest praca hybrydowa.","Мне кажется, лучше всего гибридный формат."]],"r":{"pl":"W Polsce ludzie lubią dyskutować. Przy stole rozmawiamy o pracy i cenach. Ja mówię spokojnie: «Moim zdaniem…» albo «Wydaje mi się…». Kiedy się nie zgadzam, mówię to grzecznie. Wtedy rozmowa jest ciekawa, a nie nerwowa.","ru":"Поляки любят дискутировать. За столом мы говорим о работе и ценах. Я говорю спокойно: «По-моему…» или «Мне кажется…». Когда не согласна, говорю это вежливо. Тогда разговор интересный, а не нервный."},"ff":["zdanie","здание","мнение («moim zdaniem» — по-моему) и предложение (в грамматике); здание = budynek"],"lf":"Мягкое несогласие по-польски: «Nie do końca się zgadzam» — звучит вежливо и естественно.","ts":"Выскажите вслух мнение на 3 темы: работа из дома, жизнь в большом городе, изучение языков.","tw":"Напишите 5 предложений с «myślę, że», «uważam, że», «nie wiem, czy»."},{"d":62,"s":3,"wk":9,"t":"Живой разговор и small talk","tp":"Co słychać?","w":[["co słychać?","что нового?"],["jak leci?","как жизнь? (разг.)"],["nic nowego","ничего нового"],["w porządku","в порядке"],["nie narzekam","не жалуюсь"],["no właśnie","вот именно"],["przecież","ведь, же"],["szczerze mówiąc","честно говоря"]],"p":[["Co słychać u ciebie?","Что у тебя нового?"],["Wszystko w porządku.","Всё в порядке."],["Szczerze mówiąc, jestem zmęczona.","Честно говоря, я устала."]],"g":{"t":"Разговорные частицы","x":"no (ну; да), przecież (ведь, же), właśnie (именно, как раз), chyba (наверное), wiesz (знаешь). Они делают речь живой. «No» в начале часто значит «да»: «No, jasne!» — «Ну конечно!».","e":[["Przecież mówiłam!","Я же говорила!"],["No właśnie o tym myślę.","Как раз об этом и думаю."]]},"dl":[["Sąsiadka","O, cześć! Co słychać?","О, привет! Что нового?"],["Ty","Nie narzekam. A u ciebie?","Не жалуюсь. А у тебя?"],["Sąsiadka","Nic nowego. Praca, dom, praca.","Ничего нового. Работа, дом, работа."],["Ty","No właśnie, u mnie tak samo!","Вот-вот, у меня так же!"]],"r":{"pl":"Small talk po polsku to sztuka. Na klatce schodowej sąsiadka pyta: «Co słychać?». Nie trzeba opowiadać wszystkiego. Wystarczy: «Wszystko w porządku, a u pani?». Potem kilka słów o pogodzie i uśmiech. Tak buduje się dobre relacje.","ru":"Small talk на польском — целое искусство. На лестнице соседка спрашивает: «Что нового?». Рассказывать всё не нужно. Достаточно: «Всё в порядке, а у вас?». Потом пара слов о погоде и улыбка. Так строятся хорошие отношения."},"ff":["chyba","«хиба» (укр. «разве»)","наверное («Chyba tak» — наверное, да)"],"lf":"На «Co słychać?» не ждут длинного ответа: достаточно «Wszystko dobrze, a u ciebie?».","ts":"Проведите вслух минутный small talk с соседкой: приветствие, погода, как дела, прощание.","tw":"Перепишите диалог урока, добавив частицы no, przecież, właśnie, chyba."},{"d":63,"s":3,"wk":9,"t":"Звательный падеж: обращения","tp":"Wołacz","w":[["Panie Doktorze","доктор! (обращение)"],["Pani Anno","пани Анна! (обращение)"],["Kasiu","Кася! (обращение)"],["Tomku","Томек! (обращение)"],["kochanie","дорогой/дорогая, любимый"],["mamo","мама! (обращение)"],["tato","папа! (обращение)"],["proszę pana","простите, господин… (обращение к мужчине)"]],"p":[["Panie Doktorze, mam pytanie.","Доктор, у меня вопрос."],["Kasiu, chodź tutaj!","Кася, иди сюда!"],["Proszę pana, czy pan tu pracuje?","Простите, вы здесь работаете?"]],"g":{"t":"Wołacz — падеж обращения","x":"В русском от него остались «Боже» и «отче». Женские на -a → -o: Anna → Anno, mama → mamo. Уменьшительные на -sia/-ia → -siu/-iu: Kasia → Kasiu. Мужские: Marek → Marku, Tomek → Tomku, pan → panie. В разговоре часто говорят и именительным, но в письмах и официально — звательным.","e":[["Szanowna Pani Profesor","Уважаемая госпожа профессор"],["Cześć, Marku!","Привет, Марек!"]]},"dl":[["Ty","Panie Tomaszu, czy mogę o coś zapytać?","Пан Томаш, можно вас кое о чём спросить?"],["Pan Tomasz","Oczywiście, pani Olgo.","Конечно, пани Ольга."],["Ty","Gdzie jest drukarka?","Где принтер?"],["Pan Tomasz","Na końcu korytarza, po lewej.","В конце коридора, слева."]],"r":{"pl":"W Polsce do znajomych mówimy po imieniu: «Kasiu», «Tomku». Do starszych lub obcych osób zwracamy się: «proszę pana», «proszę pani». W pracy często mówimy «pani Anno» albo «panie Marku». To uprzejme, ale nie za oficjalne.","ru":"В Польше к знакомым обращаемся по имени: «Кася», «Томек». К старшим или незнакомым: «proszę pana», «proszę pani». На работе часто говорим «пани Анна» или «пан Марек». Это вежливо, но не слишком официально."},"ff":["zapomnieć","запомнить","забыть («Zapomniałam!» — Я забыла!); запомнить = zapamiętać"],"lf":"«Pani + имя в звательном» (pani Anno) — золотая середина между «вы» и «ты» на работе.","ts":"Обратитесь вслух к 5 людям: врачу, соседке Анне, коллеге Мареку, маме, незнакомому мужчине.","tw":"Поставьте в звательный падеж: Anna, Kasia, Marek, Tomek, pan Tomasz, pani Olga."},{"d":64,"s":3,"wk":9,"t":"Повелительное наклонение полностью","tp":"Tryb rozkazujący","w":[["weź","возьми"],["daj","дай"],["powiedz","скажи"],["poczekaj","подожди"],["zostaw","оставь"],["pokaż","покажи"],["pospiesz się","поторопись"],["nie martw się","не волнуйся"]],"p":[["Nie martw się, dasz radę!","Не волнуйся, справишься!"],["Pokaż mi, jak to działa.","Покажи мне, как это работает."],["Chodźmy na kawę!","Пойдём выпьем кофе!"]],"g":{"t":"Ty, wy, my","x":"ty: czytaj, rób, idź. wy: czytajcie, róbcie, idźcie. my (давайте): czytajmy, róbmy, chodźmy. Запрет обычно с несовершенным видом: «Nie rób tego!» — не делай этого.","e":[["Chodźmy do domu.","Пойдём домой."],["Nie zapomnijcie o zebraniu!","Не забудьте о собрании!"]]},"dl":[["Mąż","Chodź, spóźnimy się!","Пошли, опоздаем!"],["Ty","Poczekaj, nie mogę znaleźć kluczy.","Подожди, не могу найти ключи."],["Mąż","Weź moje. Pospiesz się!","Возьми мои. Поторопись!"],["Ty","Dobrze, dobrze. Nie denerwuj się!","Хорошо, хорошо. Не нервничай!"]],"r":{"pl":"Rano w domu słychać same polecenia: «Wstawaj!», «Ubierz się!», «Zjedz śniadanie!», «Nie zapomnij plecaka!». Potem jedziemy do pracy i szkoły. Wieczorem jest spokojniej: «Odpocznij», «Usiądź», «Opowiedz, jak minął dzień».","ru":"Утром дома слышны одни команды: «Вставай!», «Одевайся!», «Съешь завтрак!», «Не забудь рюкзак!». Потом едем на работу и в школу. Вечером спокойнее: «Отдохни», «Садись», «Расскажи, как прошёл день»."},"ff":["chodź","ходи","иди сюда, пойдём («Chodź tutaj!» — иди сюда!)"],"lf":"«Chodźmy!» — «Пошли!» Самый частый способ позвать кого-то с собой.","ts":"Дайте вслух 5 «утренних команд» семье на ty и на wy.","tw":"Образуйте повелительное (ty / wy / my): czytać, robić, iść, pisać, czekać."},{"d":65,"s":3,"wk":9,"t":"Вежливые просьбы и «бы»","tp":"Czy mógłby pan…?","w":[["czy mógłby pan…?","не могли бы вы… (мужчине)"],["czy mogłaby pani…?","не могли бы вы… (женщине)"],["uprzejmie proszę","убедительно прошу"],["z góry dziękuję","заранее спасибо"],["nie ma za co","не за что"],["przepraszam za kłopot","извините за беспокойство"],["będę wdzięczna","буду благодарна"],["oczywiście","конечно"]],"p":[["Czy mógłby pan mi pomóc?","Не могли бы вы мне помочь?"],["Byłabym wdzięczna za odpowiedź.","Я была бы благодарна за ответ."],["Gdybym miała czas, przyszłabym.","Если бы у меня было время, я бы пришла."]],"g":{"t":"Условное наклонение","x":"Форма на -ł + by + окончание лица: zrobiłbym / zrobiłabym (я бы сделал/а), zrobiłbyś / zrobiłabyś, zrobiłby / zrobiłaby, zrobilibyśmy. Вежливые просьбы: Czy mógłby pan…? Czy mogłaby pani…?","e":[["Chętnie pojechałabym do Gdańska.","Я бы с удовольствием поехала в Гданьск."],["Czy mogłaby pani powtórzyć?","Не могли бы вы повторить?"]]},"dl":[["Ty","Przepraszam za kłopot, czy mogłaby pani mi pomóc?","Извините за беспокойство, не могли бы вы мне помочь?"],["Pani","Oczywiście, w czym problem?","Конечно, в чём проблема?"],["Ty","Nie rozumiem tego pisma z urzędu.","Я не понимаю это письмо из ведомства."],["Pani","Niech pani pokaże… Aha, trzeba dosłać jeden dokument.","Покажите… Ага, нужно дослать один документ."],["Ty","Bardzo dziękuję!","Большое спасибо!"],["Pani","Nie ma za co.","Не за что."]],"r":{"pl":"Uprzejmość w Polsce jest bardzo ważna, szczególnie w urzędach i w pracy. Zamiast «Daj mi» mówimy «Czy mógłbyś mi dać?». W e-mailu piszę: «Uprzejmie proszę o informację» i «Z góry dziękuję». Ludzie chętniej pomagają, kiedy prośba jest grzeczna.","ru":"Вежливость в Польше очень важна, особенно в ведомствах и на работе. Вместо «Дай мне» говорим «Не мог бы ты мне дать?». В e-mail пишу: «Прошу предоставить информацию» и «Заранее спасибо». Люди охотнее помогают, когда просьба вежливая."},"ff":["uprzejmy","упрямый","вежливый, любезный; упрямый = uparty"],"lf":"«Uprzejmie proszę o…» — стандартная вежливая формула просьбы в официальных письмах.","ts":"Сформулируйте вслух 4 вежливые просьбы: к чиновнику, соседу, коллеге, продавцу.","tw":"Напишите 3 предложения о том, что бы вы сделали, если бы… (gdybym…)."},{"d":66,"s":3,"wk":9,"t":"Жалобы и решение проблем","tp":"Reklamacje i skargi","w":[["skarga","жалоба"],["niezadowolony","недовольный"],["pomyłka","ошибка (по недосмотру)"],["błąd","ошибка"],["wina","вина"],["niestety","к сожалению"],["przeprosić","извиниться"],["zwrot pieniędzy","возврат денег"]],"p":[["Chciałabym złożyć skargę.","Я хотела бы подать жалобу."],["To nie moja wina.","Это не моя вина."],["Jak możemy rozwiązać ten problem?","Как мы можем решить эту проблему?"]],"g":{"t":"Нереальное условие: gdyby","x":"Gdyby + форма на -ł, … + форма с «by»: Gdybym wiedziała, nie przyszłabym (Если бы я знала, я бы не пришла). Gdyby pan zadzwonił, wszystko byłoby jasne.","e":[["Gdyby sklep był otwarty, kupiłabym chleb.","Если бы магазин был открыт, я бы купила хлеб."],["Gdybyś mnie zapytał, pomogłabym.","Если бы ты меня спросил, я бы помогла."]]},"dl":[["Ty","Dzień dobry, mam problem z rachunkiem. Jest błąd.","Здравствуйте, у меня проблема со счётом. Там ошибка."],["Kierownik","Przepraszam, co dokładnie?","Извините, что именно?"],["Ty","Policzyli mi państwo dwa razy za tę samą usługę.","Вы посчитали мне дважды одну и ту же услугу."],["Kierownik","Ma pani rację, to pomyłka. Zwrócimy pieniądze.","Вы правы, это ошибка. Мы вернём деньги."],["Ty","Dziękuję za szybkie rozwiązanie.","Спасибо за быстрое решение."]],"r":{"pl":"Kiedy coś jest nie tak, nie denerwuję się. Spokojnie mówię, jaki jest problem, i pokazuję paragon. Pytam: «Jak możemy to rozwiązać?». Jeśli to nie pomaga, piszę skargę. W Polsce konsument ma dużo praw.","ru":"Когда что-то не так, я не нервничаю. Спокойно говорю, в чём проблема, и показываю чек. Спрашиваю: «Как мы можем это решить?». Если не помогает, пишу жалобу. В Польше у потребителя много прав."},"ff":["sprawa","справа","дело, вопрос («Mam sprawę» — у меня дело); справа = z prawej"],"lf":"Бесплатно помогают местные защитники прав потребителей (rzecznik konsumentów) при городе или повяте.","ts":"Сыграйте вслух жалобу в магазине: проблема, доказательство, ваше требование.","tw":"Напишите 3 предложения с «gdybym…»."},{"d":67,"s":3,"wk":9,"type":"rev","t":"Повторение: неделя 9","tp":"Powtórka","rng":[61,66],"x":"Повторяем живую речь: мнение, small talk, обращения, повелительное, вежливые просьбы, жалобы. Пройдите тест. Затем 5 минут шэдоуинга: повторяйте диалоги недели одновременно с озвучкой.","ts":"Устройте вслух мини-дебаты сами с собой: «Лучше жить в большом городе или в маленьком?» — 3 аргумента за и 3 против.","tw":"Напишите вежливую жалобу в магазин (5–6 предложений) с «Uprzejmie proszę o…»."},{"d":68,"s":3,"wk":10,"t":"Карта побыту и ведомства","tp":"Karta pobytu","w":[["karta pobytu","вид на жительство (карта)"],["zezwolenie na pobyt","разрешение на пребывание"],["urząd wojewódzki","воеводское управление"],["odciski palców","отпечатки пальцев"],["decyzja","решение"],["odwołanie","обжалование"],["złożyć wniosek","подать заявление"],["opłata skarbowa","гербовый сбор"]],"p":[["Chcę złożyć wniosek o kartę pobytu.","Я хочу подать заявление на карту побыту."],["Na jakim etapie jest moja sprawa?","На каком этапе моё дело?"],["Kiedy będzie decyzja?","Когда будет решение?"]],"g":{"t":"Страдательный залог","x":"zostać/być + форма на -ny/-ty: Wniosek został złożony (заявление подано). Decyzja jest wydana (решение выдано). Sprawa jest rozpatrywana (дело рассматривается). Так пишут почти во всех письмах из ведомств.","e":[["Wniosek został przyjęty.","Заявление принято."],["Dokumenty zostały wysłane.","Документы отправлены."]]},"dl":[["Urzędniczka","Czy ma pani wszystkie dokumenty?","У вас все документы?"],["Ty","Tak: paszport, zdjęcie, umowę o pracę i potwierdzenie opłaty.","Да: паспорт, фото, трудовой договор и подтверждение оплаты."],["Urzędniczka","Teraz pobierzemy odciski palców.","Сейчас снимем отпечатки пальцев."],["Ty","Kiedy będzie decyzja?","Когда будет решение?"],["Urzędniczka","Dostanie pani pismo.","Вы получите письмо."]],"r":{"pl":"Wniosek o kartę pobytu składa się do urzędu wojewódzkiego, dziś najczęściej przez internet. Trzeba przygotować dokumenty, zdjęcie i dowód opłaty skarbowej. W urzędzie pobierają odciski palców. Potem sprawa jest rozpatrywana, a decyzja przychodzi pismem.","ru":"Заявление на карту побыту подают в воеводское управление, сейчас чаще всего через интернет. Нужно подготовить документы, фото и подтверждение оплаты сбора. В ведомстве снимают отпечатки пальцев. Потом дело рассматривается, а решение приходит письмом."},"ff":["pismo","письмо","официальный документ из ведомства; также почерк и письменность"],"lf":"Процедуры меняются. Актуальные правила проверяйте на сайте своего urząd wojewódzki и на gov.pl. Это курс языка, а не юридическая консультация.","ts":"Сыграйте вслух визит в urząd wojewódzki: что подаёте, какие документы, вопрос о сроках.","tw":"Переделайте в страдательный залог: «Urząd przyjął wniosek». «Wysłałam dokumenty»."},{"d":69,"s":3,"wk":10,"t":"Официальное письмо и e-mail","tp":"Pismo oficjalne","w":[["Szanowni Państwo","Уважаемые дамы и господа"],["Szanowna Pani","Уважаемая госпожа"],["w nawiązaniu do","в продолжение, ссылаясь на"],["uprzejmie informuję","сообщаю"],["w załączniku","во вложении"],["z poważaniem","с уважением"],["pozdrawiam","с приветом (менее официально)"],["temat","тема"]],"p":[["W nawiązaniu do rozmowy telefonicznej…","В продолжение телефонного разговора…"],["W załączniku przesyłam skan paszportu.","Во вложении отправляю скан паспорта."],["Proszę o potwierdzenie otrzymania.","Прошу подтвердить получение."]],"g":{"t":"Схема официального письма","x":"Обращение (Szanowni Państwo, / Szanowna Pani,) → цель (W nawiązaniu do… / Zwracam się z prośbą o…) → детали → просьба (Uprzejmie proszę o…) → завершение (Z poważaniem, имя и фамилия).","e":[["Zwracam się z prośbą o wydanie zaświadczenia.","Обращаюсь с просьбой выдать справку."],["Z poważaniem, Olga Iwanowa","С уважением, Ольга Иванова"]]},"dl":[["Koleżanka","Piszesz do urzędu?","Пишешь в ведомство?"],["Ty","Tak. Jak zacząć?","Да. Как начать?"],["Koleżanka","«Szanowni Państwo», a potem cel listu.","«Уважаемые дамы и господа», а потом цель письма."],["Ty","A na końcu?","А в конце?"],["Koleżanka","«Z poważaniem» i imię, nazwisko.","«С уважением» и имя, фамилия."]],"r":{"pl":"Szanowni Państwo, w nawiązaniu do rozmowy telefonicznej z dnia 5 marca uprzejmie proszę o wydanie zaświadczenia o zatrudnieniu. W załączniku przesyłam kopię umowy. Z góry dziękuję za odpowiedź. Z poważaniem, Olga Iwanowa","ru":"Уважаемые дамы и господа, в продолжение телефонного разговора от 5 марта прошу выдать справку о трудоустройстве. Во вложении отправляю копию договора. Заранее благодарю за ответ. С уважением, Ольга Иванова"},"ff":["zaświadczenie","свидетельство","справка («zaświadczenie o zarobkach» — справка о доходах); свидетельство о рождении = akt urodzenia"],"lf":"«Pozdrawiam» — коллегам и знакомым. В ведомство пишите «Z poważaniem».","ts":"Продиктуйте вслух официальное письмо с просьбой о справке.","tw":"Напишите e-mail в ведомство с просьбой о справке (по образцу, 5–6 строк)."},{"d":70,"s":3,"wk":10,"t":"Электронные услуги и косвенная речь","tp":"Sprawy online","w":[["rezerwacja wizyty","запись на приём"],["potwierdzenie","подтверждение"],["infolinia","горячая линия"],["obsługa klienta","обслуживание клиентов"],["Profil Zaufany","«доверенный профиль» (эл. подпись)"],["zalogować się","войти (в систему)"],["hasło","пароль"],["załatwić sprawę","решить вопрос"]],"p":[["Pani powiedziała, że trzeba czekać.","Сотрудница сказала, что нужно ждать."],["Nie mogę się zalogować.","Я не могу войти."],["Dostałam potwierdzenie e-mailem.","Я получила подтверждение по e-mail."]],"g":{"t":"Косвенная речь: że, czy, żeby","x":"Чужие слова передаём через «że» без смены времени, как в русском: «Urzędnik powiedział, że wniosek jest kompletny». Вопрос — через «czy»: «Zapytała, czy mam PESEL». Просьба — через «żeby»: «Powiedział, żebym przyszła jutro».","e":[["Powiedziała, żebym zadzwoniła jutro.","Она сказала, чтобы я позвонила завтра."],["Zapytali, czy mam umowę.","Спросили, есть ли у меня договор."]]},"dl":[["Konsultant","W czym mogę pomóc?","Чем могу помочь?"],["Ty","Nie mogę zalogować się do Profilu Zaufanego.","Не могу войти в Profil Zaufany."],["Konsultant","Czy pamięta pani hasło?","Вы помните пароль?"],["Ty","Chyba nie.","Кажется, нет."],["Konsultant","Proszę kliknąć «Nie pamiętam hasła». Dostanie pani link.","Нажмите «Не помню пароль». Вы получите ссылку."]],"r":{"pl":"Dziś wiele spraw załatwiam przez internet. Mam Profil Zaufany i aplikację mObywatel. Mogę zarezerwować wizytę w urzędzie, sprawdzić dokumenty i podpisać wniosek online. Koleżanka powiedziała, że to oszczędza dużo czasu. Ma rację!","ru":"Сегодня многие дела я решаю через интернет. У меня есть Profil Zaufany и приложение mObywatel. Могу записаться на приём, проверить документы и подписать заявление онлайн. Подруга сказала, что это экономит много времени. Она права!"},"ff":["stanowisko","становище","окно обслуживания («stanowisko nr 3») и должность («stanowisko pracy»)"],"lf":"Profil Zaufany — бесплатная электронная подпись для госуслуг. Многие банки позволяют создать его онлайн.","ts":"Перескажите вслух разговор с чиновником в косвенной речи (że / czy / żeby).","tw":"Передайте в косвенной речи: «Proszę przyjść jutro». «Czy ma pani PESEL?». «Wniosek jest kompletny»."},{"d":71,"s":3,"wk":10,"t":"Налоги и годовой расчёт","tp":"Podatki","w":[["urząd skarbowy","налоговая инспекция"],["zeznanie podatkowe","налоговая декларация"],["PIT","подоходный налог; декларация"],["ulga","льгота"],["zwrot podatku","возврат налога"],["rozliczenie","годовой расчёт"],["księgowa","бухгалтер"],["termin płatności","срок оплаты"]],"p":[["Muszę złożyć PIT do końca kwietnia.","Мне нужно подать PIT до конца апреля."],["Czy przysługuje mi ulga?","Положена ли мне льгота?"],["Dostałam zwrot podatku.","Мне вернули налог."]],"g":{"t":"Существительные на -anie/-enie","x":"Из глагола: rozliczać → rozliczanie, płacić → płacenie, składać → składanie, rozliczyć → rozliczenie. Как русские «-ание/-ение»: читать → чтение, czytać → czytanie. Ещё одно правило моста для абстрактных слов.","e":[["Rozliczenie podatku online jest proste.","Расчёт налога онлайн простой."],["Płacenie rachunków zajmuje mi pięć minut.","Оплата счетов занимает у меня пять минут."]]},"dl":[["Ty","Dzień dobry, mam pytanie o rozliczenie PIT.","Здравствуйте, у меня вопрос о декларации PIT."],["Urzędnik","Proszę.","Слушаю."],["Ty","Pracuję w Polsce od roku. Czy muszę się rozliczyć?","Я работаю в Польше год. Мне нужно подавать?"],["Urzędnik","Tak, do końca kwietnia. Może pani skorzystać z e-Urzędu Skarbowego.","Да, до конца апреля. Можете воспользоваться e-Urząd Skarbowy."],["Ty","Czy przysługuje mi ulga na dziecko?","Положена ли мне льгота на ребёнка?"],["Urzędnik","To zależy od sytuacji. Proszę sprawdzić w e-Urzędzie.","Зависит от ситуации. Проверьте в e-Urząd."]],"r":{"pl":"W Polsce roczne zeznanie PIT składamy do końca kwietnia. Najprościej zrobić to w e-Urzędzie Skarbowym: dane z pracy są już wpisane. Sprawdzam ulgi i klikam «Wyślij». Jeśli zapłaciłam za dużo, urząd zwraca różnicę na konto.","ru":"В Польше годовую декларацию PIT подают до конца апреля. Проще всего в e-Urząd Skarbowy: данные с работы уже внесены. Я проверяю льготы и нажимаю «Отправить». Если я переплатила, налоговая возвращает разницу на счёт."},"ff":["skarbowy","от «скарб» (пожитки)","государственный, казначейский («urząd skarbowy» — налоговая)"],"lf":"Декларацию PIT подают до 30 апреля. В сервисе e-Urząd Skarbowy она часто уже заполнена автоматически. Это курс языка, не налоговая консультация.","ts":"Объясните вслух, что такое PIT и до какого числа его подают.","tw":"Образуйте существительные на -anie/-enie: płacić, czytać, pisać, rozliczyć, zameldować."},{"d":72,"s":3,"wk":10,"t":"Полиция и ДТП","tp":"Policja i stłuczka","w":[["policja","полиция"],["kontrola","проверка"],["dowód rejestracyjny","техпаспорт"],["wypadek","авария, несчастный случай"],["stłuczka","мелкое ДТП"],["świadek","свидетель"],["ubezpieczyciel","страховая компания"],["szkoda","ущерб"]],"p":[["Proszę o dokumenty.","Ваши документы, пожалуйста."],["Mieliśmy stłuczkę na skrzyżowaniu.","У нас было мелкое ДТП на перекрёстке."],["Spiszmy oświadczenie.","Давайте составим заявление."]],"g":{"t":"Który, która, które","x":"Относительное местоимение «который»: Kierowca, który jechał za mną… Kobieta, która widziała wypadek… Auto, które stało na parkingu… Падеж зависит от роли в придаточном: «Świadek, z którym rozmawiałam…».","e":[["To jest kierowca, który spowodował stłuczkę.","Это водитель, который устроил ДТП."],["Mam świadka, która wszystko widziała.","У меня есть свидетельница, которая всё видела."]]},"dl":[["Policjant","Dzień dobry, kontrola drogowa. Proszę o prawo jazdy i dowód rejestracyjny.","Здравствуйте, проверка. Права и техпаспорт, пожалуйста."],["Ty","Proszę bardzo.","Пожалуйста."],["Policjant","Przekroczyła pani prędkość.","Вы превысили скорость."],["Ty","Przepraszam, nie zauważyłam znaku.","Извините, я не заметила знак."],["Policjant","Tym razem pouczenie. Proszę jechać ostrożnie.","В этот раз предупреждение. Езжайте осторожно."]],"r":{"pl":"Wczoraj mieliśmy stłuczkę na parkingu. Nikomu nic się nie stało. Kierowca, który w nas wjechał, od razu przeprosił. Spisaliśmy oświadczenie: dane kierowców, numery polis i opis zdarzenia. Potem zgłosiłam szkodę ubezpieczycielowi przez internet.","ru":"Вчера у нас было мелкое ДТП на парковке. Никто не пострадал. Водитель, который в нас въехал, сразу извинился. Мы составили заявление: данные водителей, номера полисов и описание происшествия. Потом я заявила об ущербе страховой через интернет."},"ff":["oświadczenie","освещение","письменное заявление («oświadczenie o zdarzeniu drogowym»); освещение = oświetlenie"],"lf":"При мелком ДТП без пострадавших водители могут составить oświadczenie сами. Если есть пострадавшие — звоните 112.","ts":"Опишите вслух ДТП: где, когда, кто виноват, были ли свидетели.","tw":"Соедините пары предложений через który / która / które (3 предложения)."},{"d":73,"s":3,"wk":10,"t":"Своё дело в Польше","tp":"Własna firma","w":[["działalność gospodarcza","предпринимательская деятельность, ИП"],["firma","фирма"],["faktura","счёт-фактура"],["NIP","налоговый номер"],["klient","клиент"],["zlecenie","заказ, поручение"],["księgowość","бухгалтерия"],["zysk","прибыль"]],"p":[["Chcę założyć firmę.","Я хочу открыть фирму."],["Wystawię fakturę jutro.","Выставлю счёт завтра."],["Jakie są koszty prowadzenia firmy?","Какие расходы на ведение фирмы?"]],"g":{"t":"Родительный множественного","x":"Много чего? м.р. -ów (klientów), ж.р. часто без окончания (faktura → faktur, firma → firm), ср.р. без окончания (zlecenie → zleceń). Как русское «много фирм, клиентов».","e":[["Mam pięciu stałych klientów.","У меня пять постоянных клиентов."],["W tym miesiącu wystawiłam dwadzieścia faktur.","В этом месяце я выставила двадцать счетов."]]},"dl":[["Ty","Chcę założyć jednoosobową działalność. Od czego zacząć?","Хочу открыть ИП. С чего начать?"],["Doradczyni","Od wpisu do CEIDG, to można zrobić online.","С регистрации в CEIDG, это можно сделать онлайн."],["Ty","A ZUS?","А ZUS?"],["Doradczyni","Na początku są ulgi dla nowych firm. Warto porozmawiać z księgową.","Вначале есть льготы для новых фирм. Стоит поговорить с бухгалтером."],["Ty","Dziękuję, to bardzo pomocne.","Спасибо, это очень полезно."]],"r":{"pl":"Wiele osób w Polsce prowadzi jednoosobową działalność gospodarczą. Firmę rejestruje się online w CEIDG. Przedsiębiorca wystawia faktury, płaci podatki i składki ZUS. Na początku są ulgi. Dobra księgowa to połowa sukcesu.","ru":"Многие в Польше ведут индивидуальную предпринимательскую деятельность. Фирму регистрируют онлайн в CEIDG. Предприниматель выставляет счета, платит налоги и взносы ZUS. Вначале есть льготы. Хороший бухгалтер — половина успеха."},"ff":["faktura","фактура","счёт-фактура (документ); фактура ткани = struktura, faktura tkaniny"],"lf":"Не каждый иностранец может открыть JDG на тех же условиях, что поляки: это зависит от статуса пребывания. Проверьте на biznes.gov.pl. Это курс языка, не юридическая консультация.","ts":"Расскажите вслух о бизнес-идее: чем займётесь, кто клиенты.","tw":"Поставьте в родительный мн. ч.: klient, faktura, zlecenie, firma, pracownik."},{"d":74,"s":3,"wk":10,"type":"rev","t":"Повторение: неделя 10","tp":"Powtórka","rng":[68,73],"x":"Повторяем официальный польский: карта побыту, письма, онлайн-услуги, налоги, полиция, своя фирма. Пройдите тест и перечитайте вслух образец официального письма из дня 69.","ts":"Перескажите вслух в косвенной речи визит в ведомство: что вам сказали и о чём спросили.","tw":"Напишите официальное письмо (e-mail) с просьбой о записи на приём (6–8 строк)."},{"d":75,"s":3,"wk":11,"t":"Сочельник и Рождество","tp":"Wigilia","w":[["Wigilia","Сочельник (24 декабря)"],["opłatek","облатка"],["choinka","ёлка"],["kolęda","колядка, рождественская песня"],["barszcz","борщ (красный, прозрачный)"],["pierogi","вареники"],["prezenty","подарки"],["Boże Narodzenie","Рождество"]],"p":[["Wesołych Świąt!","Весёлых праздников!"],["Dzielimy się opłatkiem.","Мы делимся облаткой."],["Zdrowych, spokojnych świąt!","Здоровых, спокойных праздников!"]],"g":{"t":"Числа + родительный мн. ч.","x":"После 5 и больше — родительный мн. ч., как в русском: dwanaście potraw (12 блюд), pięć prezentów, wiele życzeń.","e":[["Na stole jest dwanaście potraw.","На столе двенадцать блюд."],["Dostałam pięć prezentów.","Я получила пять подарков."]]},"dl":[["Teściowa","Zapraszamy was na Wigilię!","Приглашаем вас на Сочельник!"],["Ty","Dziękujemy! Co mamy przynieść?","Спасибо! Что принести?"],["Teściowa","Może pierogi z kapustą i grzybami?","Может, вареники с капустой и грибами?"],["Ty","Chętnie zrobię. O której zaczynamy?","С удовольствием сделаю. Во сколько начинаем?"],["Teściowa","Kiedy na niebie pojawi się pierwsza gwiazdka.","Когда на небе появится первая звезда."]],"r":{"pl":"Wigilia to najważniejszy wieczór świąt w Polsce. Rodzina siada do stołu, kiedy pojawi się pierwsza gwiazdka. Najpierw dzielimy się opłatkiem i składamy sobie życzenia. Na stole jest dwanaście potraw, zwykle bez mięsa. Potem śpiewamy kolędy i otwieramy prezenty.","ru":"Сочельник — главный вечер праздников в Польше. Семья садится за стол, когда появляется первая звезда. Сначала делимся облаткой и желаем друг другу добра. На столе двенадцать блюд, обычно без мяса. Потом поём колядки и открываем подарки."},"ff":["święta","святая","праздники («Wesołych Świąt!» — весёлых праздников!)"],"lf":"В Сочельник за столом часто оставляют одно свободное место — для неожиданного гостя.","ts":"Поздравьте вслух 3 человек с праздниками разными пожеланиями.","tw":"Напишите открытку с рождественскими пожеланиями (3–4 предложения)."},{"d":76,"s":3,"wk":11,"t":"Пасха и традиции","tp":"Wielkanoc","w":[["Wielkanoc","Пасха"],["święconka","освящение пасхальной корзинки"],["pisanki","писанки (расписные яйца)"],["koszyczek","корзинка"],["śmigus-dyngus","обливальный понедельник"],["zajączek","пасхальный зайчик"],["baranek","барашек (символ)"],["post","пост"]],"p":[["Wesołego Alleluja!","Весёлой Пасхи! (пожелание)"],["Idziemy ze święconką do kościoła.","Идём освящать корзинку в костёл."],["Uważaj, dziś śmigus-dyngus!","Осторожно, сегодня обливают водой!"]],"g":{"t":"Вид в прошедшем времени","x":"Несовершенный — процесс: malowałam pisanki (красила). Совершенный — результат: pomalowałam pisanki (покрасила). Вопрос «Co robiłaś?» — про процесс, «Co zrobiłaś?» — про результат.","e":[["Cały dzień piekłam ciasta.","Весь день я пекла пироги."],["Upiekłam trzy ciasta.","Я испекла три пирога."]]},"dl":[["Koleżanka","Co robisz na Wielkanoc?","Что делаешь на Пасху?"],["Ty","W sobotę idziemy ze święconką, a w niedzielę jest śniadanie wielkanocne.","В субботу идём освящать корзинку, а в воскресенье пасхальный завтрак."],["Koleżanka","A w poniedziałek?","А в понедельник?"],["Ty","Uciekam przed wodą! Śmigus-dyngus!","Убегаю от воды! Śmigus-dyngus!"]],"r":{"pl":"W Wielką Sobotę Polacy idą do kościoła ze święconką: w koszyczku są jajka, chleb, sól i kiełbasa. W niedzielę rodzina je uroczyste śniadanie. W Poniedziałek Wielkanocny jest śmigus-dyngus: ludzie oblewają się wodą. Dzieci szukają prezentów od zajączka.","ru":"В Великую субботу поляки идут в костёл освящать корзинку: в ней яйца, хлеб, соль и колбаса. В воскресенье семья торжественно завтракает. В пасхальный понедельник — śmigus-dyngus: люди обливают друг друга водой. Дети ищут подарки от зайчика."},"ff":["życzenia","«жизни»","пожелания, поздравления («składać życzenia» — поздравлять)"],"lf":"Пасхальный понедельник — выходной. В śmigus-dyngus вас могут облить водой на улице: это шутка, а не агрессия.","ts":"Сравните вслух, как празднуют Пасху у вас дома и в Польше.","tw":"Напишите 3 пары в прошедшем: piec/upiec, malować/pomalować, robić/zrobić."},{"d":77,"s":3,"wk":11,"t":"Государственные праздники и именины","tp":"Święta i imieniny","w":[["imieniny","именины"],["Święto Niepodległości","День независимости (11 ноября)"],["Święto Konstytucji 3 Maja","День Конституции 3 мая"],["dzień wolny","выходной день"],["flaga","флаг"],["rocznica","годовщина"],["obchodzić","праздновать, отмечать"],["uroczystość","торжество"]],"p":[["Wszystkiego najlepszego z okazji imienin!","Всего наилучшего в день именин!"],["Jedenastego listopada jest dzień wolny.","Одиннадцатого ноября выходной."],["Sto lat!","Сто лет! (песня-поздравление)"]],"g":{"t":"Даты и «z okazji»","x":"Даты — порядковое в родительном: jedenastego listopada, trzeciego maja, pierwszego stycznia. «Z okazji» + родительный — по случаю: z okazji urodzin, z okazji świąt.","e":[["Trzeciego maja obchodzimy Święto Konstytucji.","Третьего мая празднуем День Конституции."],["Z okazji urodzin życzę ci zdrowia.","С днём рождения желаю тебе здоровья."]]},"dl":[["Koleżanka","Dziś są imieniny Anny!","Сегодня именины Анны!"],["Ty","Naprawdę? W Polsce obchodzi się imieniny?","Правда? В Польше празднуют именины?"],["Koleżanka","Tak, czasem tak samo jak urodziny.","Да, иногда так же, как день рождения."],["Ty","To kupię kwiaty. Wszystkiego najlepszego, Aniu!","Тогда куплю цветы. Всего наилучшего, Аня!"],["Wszyscy","Sto lat, sto lat!","Сто лет, сто лет!"]],"r":{"pl":"W Polsce jest kilka świąt państwowych. Jedenastego listopada obchodzimy Święto Niepodległości, a trzeciego maja Święto Konstytucji. Wtedy na budynkach wiszą flagi. Polacy obchodzą też imieniny. Śpiewamy «Sto lat» i składamy życzenia.","ru":"В Польше несколько государственных праздников. 11 ноября — День независимости, 3 мая — День Конституции. В эти дни на зданиях висят флаги. Поляки празднуют и именины. Поём «Сто лет» и поздравляем."},"ff":["obchodzić","обходить","праздновать, отмечать («obchodzić urodziny»); обходить = omijać"],"lf":"Именины каждого имени есть в календаре. На работе в именины часто приносят торт для коллег.","ts":"Поздравьте вслух коллегу с именинами и скажите «Sto lat!».","tw":"Напишите словами даты: 11.11, 3.05, 1.01, 24.12."},{"d":78,"s":3,"wk":11,"t":"Польская кухня","tp":"Kuchnia polska","w":[["żurek","журек (суп на закваске)"],["bigos","бигос (тушёная капуста с мясом)"],["kotlet schabowy","свиная отбивная"],["gołąbki","голубцы"],["placki ziemniaczane","драники"],["kompot","компот"],["pączek","пончик"],["kiszony","квашеный"]],"p":[["Co pani poleca?","Что вы посоветуете?"],["Jakie jest danie dnia?","Какое блюдо дня?"],["Poproszę na wynos.","С собой, пожалуйста."]],"g":{"t":"Прилагательные «из чего»","x":"zupa pomidorowa (из помидоров), ogórkowa (огуречная), grzybowa (грибная); kuchnia polska, białoruska, ukraińska. «Na wynos» — с собой, «na miejscu» — здесь.","e":[["Lubię zupę grzybową.","Я люблю грибной суп."],["Placki ziemniaczane to prawie nasze draniki!","Placki ziemniaczane — почти наши драники!"]]},"dl":[["Kelnerka","Danie dnia to żurek i kotlet schabowy z ziemniakami.","Блюдо дня — журек и отбивная с картошкой."],["Ty","A co pani poleca na deser?","А что посоветуете на десерт?"],["Kelnerka","Pączki, są świeże.","Пончики, они свежие."],["Ty","Poproszę żurek tutaj, a pączki na wynos.","Журек здесь, а пончики с собой."],["Kelnerka","Oczywiście.","Конечно."]],"r":{"pl":"Polska kuchnia jest bliska naszej. Są pierogi, gołąbki, placki ziemniaczane i barszcz. Ale są też nowe smaki: żurek z jajkiem i kiełbasą, bigos z kiszonej kapusty. W tłusty czwartek Polacy jedzą pączki, nawet kilka! Na obiad często jest kotlet schabowy z ziemniakami i surówką.","ru":"Польская кухня близка нашей. Есть вареники, голубцы, драники и борщ. Но есть и новые вкусы: журек с яйцом и колбасой, бигос из квашеной капусты. В «жирный четверг» поляки едят пончики, даже по несколько! На обед часто отбивная с картошкой и салатом из сырых овощей."},"ff":["pączek","пачка","пончик (а ещё бутон); пачка = paczka"],"lf":"Tłusty czwartek — последний четверг перед Великим постом: вся Польша ест пончики.","ts":"Закажите вслух обед в польском бистро и попросите совета у официантки.","tw":"Опишите любимое польское и любимое домашнее блюдо (по 3 предложения)."},{"d":79,"s":3,"wk":11,"t":"История и достопримечательности","tp":"Zabytki i historia","w":[["zamek","замок"],["rynek","центральная площадь"],["stare miasto","старый город"],["pomnik","памятник"],["muzeum","музей"],["wieża","башня"],["wiek","век; возраст"],["przewodnik","гид; путеводитель"]],"p":[["Ile kosztuje bilet do muzeum?","Сколько стоит билет в музей?"],["Kiedy zbudowano ten zamek?","Когда построили этот замок?"],["Czy jest zwiedzanie z przewodnikiem?","Есть экскурсия с гидом?"]],"g":{"t":"Века, годы и формы на -no/-to","x":"w XX wieku (w dwudziestym wieku), w 1989 roku (w tysiąc dziewięćset osiemdziesiątym dziewiątym roku). Безличное прошедшее: zbudowano (построили), otwarto (открыли), zniszczono (разрушили), odbudowano (восстановили).","e":[["Zamek zbudowano w czternastym wieku.","Замок построили в XIV веке."],["Muzeum otwarto w dwa tysiące piątym roku.","Музей открыли в 2005 году."]]},"dl":[["Przewodnik","To jest rynek, serce starego miasta.","Это рыночная площадь, сердце старого города."],["Ty","A ta wieża?","А эта башня?"],["Przewodnik","To ratusz. Zbudowano go w średniowieczu.","Это ратуша. Её построили в Средневековье."],["Ty","Czy można wejść na górę?","Можно подняться наверх?"],["Przewodnik","Tak, jest piękny widok na miasto.","Да, оттуда красивый вид на город."]],"r":{"pl":"Prawie każde polskie miasto ma rynek i stare miasto. W Krakowie jest Wawel, dawny zamek królewski. Warszawę bardzo zniszczono w czasie wojny, a potem odbudowano. Wrocław ma piękny rynek i setki małych krasnali z brązu. Warto zwiedzać z przewodnikiem.","ru":"Почти в каждом польском городе есть рыночная площадь и старый город. В Кракове — Вавель, бывший королевский замок. Варшаву сильно разрушили во время войны, а потом восстановили. Во Вроцлаве красивая площадь и сотни маленьких бронзовых гномов. Осматривать стоит с гидом."},"ff":["rynek","рынок","центральная площадь старого города (и рынок тоже); базар = targ"],"lf":"Во многих музеях один день в неделю вход бесплатный — проверяйте на сайте музея.","ts":"Проведите вслух мини-экскурсию по своему городу (1 минута).","tw":"Напишите 3 предложения с формами zbudowano, otwarto, odbudowano."},{"d":80,"s":3,"wk":11,"t":"Разговорный польский","tp":"Polski na luzie","w":[["spoko","нормально, ок, спокойно (разг.)"],["luz","расслабься; без проблем"],["serio?","серьёзно?"],["kurczę","блин (мягкое восклицание)"],["masakra","кошмар, жуть (разг.)"],["ekstra","супер, класс"],["no nie!","да ладно! / ну нет!"],["na razie","пока (при прощании)"]],"p":[["Spoko, nie ma problemu.","Нормально, без проблем."],["Kurczę, zapomniałam kluczy!","Блин, я забыла ключи!"],["Na razie, do jutra!","Пока, до завтра!"]],"g":{"t":"Уменьшительные формы","x":"Поляки их обожают: kawa → kawka, piwo → piwko, chwila → chwilka, chwileczka, dom → domek, ręka → rączka. Они звучат тепло и вежливо: «Poproszę kawkę».","e":[["Chwileczkę, już idę!","Минуточку, уже иду!"],["Mamy mały domek na wsi.","У нас маленький домик в деревне."]]},"dl":[["Kolega","Idziemy na piwko po pracy?","Пойдём на пиво после работы?"],["Ty","Spoko! Ale tylko na chwilkę.","Окей! Но только ненадолго."],["Kolega","Luz. A jutro masz wolne?","Без проблем. А завтра у тебя выходной?"],["Ty","Serio? Jutro poniedziałek… masakra!","Серьёзно? Завтра понедельник… кошмар!"]],"r":{"pl":"Na ulicy i w pracy słyszę inny polski niż w podręczniku. Młodzi mówią «spoko», «luz», «ekstra». Kiedy coś idzie źle, mówią «kurczę» albo «masakra». Starsi częściej używają zdrobnień: «kawka», «chwileczka». Rozumiem coraz więcej i sama zaczynam tak mówić!","ru":"На улице и на работе я слышу другой польский, чем в учебнике. Молодёжь говорит «spoko», «luz», «ekstra». Когда что-то не так — «kurczę» или «masakra». Старшие чаще используют уменьшительные: «kawka», «chwileczka». Я понимаю всё больше и сама начинаю так говорить!"},"ff":["masakra","резня («массакр»)","в разговоре — кошмар, жуть («Korki to masakra» — пробки ужасные)"],"lf":"«Na razie» — это «пока!», а не «на раз». Грубые слова полезно понимать, но лучше не повторять.","ts":"Отреагируйте вслух на 5 новостей словами: spoko, serio?, masakra, ekstra, no nie!","tw":"Образуйте уменьшительные: kawa, chwila, dom, ręka, piwo."},{"d":81,"s":3,"wk":11,"type":"rev","t":"Повторение: неделя 11","tp":"Powtórka","rng":[75,80],"x":"Повторяем культуру: Рождество, Пасху, праздники, кухню, историю и разговорный польский. Пройдите тест и перескажите своими словами 2 чтения недели.","ts":"Расскажите вслух о любимом польском празднике и любимом блюде (2 минуты).","tw":"Напишите поздравление польским соседям с праздником (4–5 предложений)."},{"d":82,"s":3,"wk":12,"t":"Новости и быстрое чтение","tp":"Wiadomości","w":[["wiadomości","новости"],["artykuł","статья"],["nagłówek","заголовок"],["według","согласно, по данным"],["rząd","правительство"],["gospodarka","экономика"],["ceny","цены"],["przepisy","правила, законы"]],"p":[["Według GUS ceny wzrosły.","По данным статистического управления, цены выросли."],["Czytałam o tym w wiadomościach.","Я читала об этом в новостях."],["O co chodzi w tym artykule?","О чём эта статья?"]],"g":{"t":"Честное «быстрое чтение»","x":"1) Заголовок и первое предложение — главное. 2) Ищите: kto? co? gdzie? kiedy? 3) Незнакомые слова угадывайте по корню — правила моста. 4) Только потом словарь. Скорость чтения растёт вместе со словарём, а не от трюков.","e":[["Rząd ogłosił nowe przepisy.","Правительство объявило новые правила."],["Według ekspertów ceny spadną.","По мнению экспертов, цены снизятся."]]},"dl":[["Mąż","Czytałaś dziś wiadomości?","Читала сегодня новости?"],["Ty","Tak, był artykuł o cenach mieszkań.","Да, была статья о ценах на квартиры."],["Mąż","I co piszą?","И что пишут?"],["Ty","Według ekspertów czynsze w dużych miastach dalej rosną.","По мнению экспертов, аренда в больших городах продолжает расти."]],"r":{"pl":"Nowy rozkład jazdy. Od niedzieli na trasie Wrocław – Kraków pojadą dodatkowe pociągi. Według przewoźnika podróż będzie krótsza o dwadzieścia minut. Bilety można kupić w aplikacji i w kasach. Pasażerowie się cieszą, ale pytają o ceny.","ru":"Новое расписание. С воскресенья на маршруте Вроцлав — Краков пойдут дополнительные поезда. По словам перевозчика, поездка станет короче на двадцать минут. Билеты можно купить в приложении и в кассах. Пассажиры рады, но спрашивают о ценах."},"ff":["rząd","ряд","правительство (и ряд тоже: «w pierwszym rzędzie»)"],"lf":"10 минут польских новостей в день (заголовок + первый абзац) дают заметный прирост словаря за месяц.","ts":"Перескажите вслух новость из чтения в 3 предложениях.","tw":"Ответьте письменно по тексту: kto? co? gdzie? kiedy?"},{"d":83,"s":3,"wk":12,"t":"Договоры и мелкий шрифт","tp":"Umowy i regulaminy","w":[["regulamin","правила, регламент"],["warunki","условия"],["zobowiązanie","обязательство"],["okres wypowiedzenia","срок расторжения"],["kara umowna","неустойка"],["aneks","дополнение к договору"],["obowiązuje","действует"],["zgodnie z","в соответствии с"]],"p":[["Proszę wyjaśnić ten punkt umowy.","Объясните, пожалуйста, этот пункт договора."],["Czy mogę wypowiedzieć umowę wcześniej?","Могу ли я расторгнуть договор раньше?"],["Zgodnie z regulaminem…","Согласно правилам…"]],"g":{"t":"Книжные конструкции","x":"niniejszy (настоящий, данный: niniejsza umowa), powyższy (вышеуказанный), zgodnie z (в соответствии с), w przypadku (в случае), na podstawie (на основании). Их много в договорах — учите как слова.","e":[["W przypadku opóźnienia płatności naliczana jest kara.","В случае просрочки платежа начисляется штраф."],["Niniejsza umowa obowiązuje od pierwszego lipca.","Настоящий договор действует с первого июля."]]},"dl":[["Ty","Przepraszam, czego dotyczy punkt piąty?","Извините, о чём пункт пятый?"],["Konsultant","To kara umowna, jeśli zerwie pani umowę przed terminem.","Это неустойка, если вы расторгнете договор досрочно."],["Ty","Ile wynosi?","Сколько она?"],["Konsultant","Tyle, ile wynosiła otrzymana ulga.","Столько, сколько составила полученная скидка."],["Ty","Rozumiem. Muszę to przemyśleć.","Понятно. Мне нужно подумать."]],"r":{"pl":"Zanim podpiszę umowę z operatorem telefonii, czytam regulamin. Sprawdzam, na jaki okres jest umowa, jaki jest okres wypowiedzenia i czy jest kara umowna. Jeśli czegoś nie rozumiem, pytam. Niczego nie podpisuję w pośpiechu.","ru":"Прежде чем подписать договор с мобильным оператором, я читаю правила. Проверяю срок договора, срок расторжения и есть ли неустойка. Если что-то непонятно, спрашиваю. Ничего не подписываю в спешке."},"ff":["racja","рация","правота («masz rację» — ты прав); рация = krótkofalówka"],"lf":"Договор можно попросить домой на прочтение. Если торопят «подпишите сейчас» — это повод насторожиться.","ts":"Объясните вслух простыми словами 2 пункта договора: условие и неустойку.","tw":"Составьте 3 предложения с: zgodnie z, w przypadku, na podstawie."},{"d":84,"s":3,"wk":12,"t":"Экзамен B1: аудирование","tp":"Rozumienie ze słuchu","w":[["słuchanie","аудирование, слушание"],["nagranie","запись"],["pytanie","вопрос"],["prawda","правда, верно"],["fałsz","неверно"],["wybierz","выбери"],["uzupełnij","дополни"],["odpowiedź","ответ"]],"p":[["Proszę posłuchać nagrania dwa razy.","Прослушайте запись два раза."],["Zaznacz: prawda czy fałsz.","Отметь: верно или неверно."],["Nie zdążyłam zapisać odpowiedzi.","Я не успела записать ответ."]],"g":{"t":"Стратегия аудирования","x":"1) До записи прочитайте вопросы и подчеркните ключевые слова. 2) Первый раз — общий смысл. 3) Второй раз — детали: числа, даты, имена. 4) Не застревайте на незнакомом слове. Ловушка: в вопросе «tani», а в записи синоним «niedrogi».","e":[["Nagranie jest odtwarzane dwa razy.","Запись проигрывается два раза."],["Pytanie dotyczy godziny spotkania.","Вопрос касается времени встречи."]]},"dl":[["Egzaminatorka","Za chwilę usłyszą państwo nagranie.","Сейчас вы услышите запись."],["Ty","Ile razy będzie odtwarzane?","Сколько раз её проиграют?"],["Egzaminatorka","Dwa razy. Proszę najpierw przeczytać pytania.","Два раза. Сначала прочитайте вопросы."],["Ty","Czy można robić notatki?","Можно делать заметки?"],["Egzaminatorka","Tak, na brudnopisie.","Да, на черновике."]],"r":{"pl":"Egzamin certyfikatowy z języka polskiego na poziomie B1 ma kilka części: rozumienie ze słuchu, rozumienie tekstów pisanych, poprawność gramatyczną, pisanie i mówienie. Każdą część trzeba zdać. Najlepiej trenować na przykładowych testach ze strony certyfikatpolski.pl.","ru":"Государственный экзамен по польскому на уровень B1 состоит из нескольких частей: аудирование, понимание письменных текстов, грамматика, письмо и говорение. Сдать нужно каждую часть. Лучше всего тренироваться на примерах тестов с сайта certyfikatpolski.pl."},"ff":["pokój","покой","комната; а ещё мир («pokój na świecie»); покой = spokój"],"lf":"Экзамен B1 сдают в аккредитованных центрах несколько раз в год. Расписание и образцы тестов — на certyfikatpolski.pl.","ts":"Включите озвучку диалога этого урока и отвечайте вслух на вопросы теста, не глядя в текст.","tw":"Запишите 5 ключевых слов, которые вы услышали в диалоге."},{"d":85,"s":3,"wk":12,"t":"Экзамен B1: письмо и связки","tp":"Pisanie","w":[["po pierwsze","во-первых"],["po drugie","во-вторых"],["z jednej strony","с одной стороны"],["z drugiej strony","с другой стороны"],["dlatego","поэтому"],["jednak","однако"],["ponadto","кроме того"],["podsumowując","подводя итог"]],"p":[["Po pierwsze, to jest tańsze.","Во-первых, это дешевле."],["Z jednej strony…, z drugiej strony…","С одной стороны…, с другой стороны…"],["Podsumowując, uważam, że warto.","Подводя итог, считаю, что стоит."]],"g":{"t":"Связки текста","x":"Порядок: po pierwsze, po drugie, na koniec. Противопоставление: jednak, ale, natomiast. Добавление: ponadto, poza tym. Вывод: dlatego, więc, podsumowując. Связки сразу делают текст логичным — это ценят на любом экзамене.","e":[["Lubię Polskę, jednak tęsknię za domem.","Мне нравится Польша, однако я скучаю по дому."],["Mam dobrą pracę, dlatego zostaję.","У меня хорошая работа, поэтому я остаюсь."]]},"dl":[["Koleżanka","Co piszesz?","Что пишешь?"],["Ty","Wypracowanie: «Czy warto mieszkać za granicą?».","Сочинение: «Стоит ли жить за границей?»."],["Koleżanka","I co myślisz?","И что думаешь?"],["Ty","Z jednej strony to szansa, z drugiej strony tęsknota. Podsumowując: warto, ale trzeba mieć plan.","С одной стороны, это шанс, с другой — тоска по дому. Итог: стоит, но нужен план."]],"r":{"pl":"Czy warto mieszkać za granicą? Moim zdaniem tak. Po pierwsze, można zdobyć nowe doświadczenie i nauczyć się języka. Po drugie, często są lepsze zarobki. Z drugiej strony, na początku jest trudno: tęsknimy za rodziną i nie rozumiemy wszystkiego. Ponadto trzeba załatwić wiele dokumentów. Podsumowując, uważam, że warto, ale trzeba mieć plan i cierpliwość.","ru":"Стоит ли жить за границей? По-моему, да. Во-первых, можно получить новый опыт и выучить язык. Во-вторых, часто лучше зарплаты. С другой стороны, вначале трудно: скучаем по семье и понимаем не всё. Кроме того, нужно оформить много документов. Подводя итог, считаю, что стоит, но нужны план и терпение."},"ff":["zatem","затем","итак, следовательно; затем = potem, następnie"],"lf":"Сначала напишите план из 4 пунктов, потом текст. Так меньше ошибок и логика видна сразу.","ts":"Скажите вслух мини-эссе «Czy warto uczyć się języków?» со связками (1 минута).","tw":"Напишите эссе «Czy warto mieszkać za granicą?» (120–150 слов) со связками."},{"d":86,"s":3,"wk":12,"t":"Экзамен B1: говорение","tp":"Mówienie","w":[["opowiedzieć","рассказать"],["opisać","описать"],["porównać","сравнить"],["zaleta","достоинство, плюс"],["wada","недостаток, минус"],["przykład","пример"],["korzyść","польза, выгода"],["ryzyko","риск"]],"p":[["Na przykład…","Например…"],["Największą zaletą jest…","Главное достоинство — …"],["Muszę się zastanowić.","Мне нужно подумать."]],"g":{"t":"Как не замолкать","x":"Фразы-паузы: «To dobre pytanie…», «Muszę się zastanowić…», «Jak by to powiedzieć…», «Chodzi mi o to, że…» (я имею в виду, что…). Забыли слово — опишите: «to taka rzecz, która…».","e":[["Chodzi mi o to, że praca zdalna daje wolność.","Я имею в виду, что удалённая работа даёт свободу."],["To taka rzecz, którą otwiera się drzwi.","Это такая вещь, которой открывают дверь."]]},"dl":[["Egzaminator","Proszę opisać zdjęcie.","Опишите фотографию."],["Ty","Na zdjęciu widzę rodzinę przy stole. Chyba jest Wigilia, bo jest choinka.","На фото я вижу семью за столом. Наверное, Сочельник: там ёлка."],["Egzaminator","Jakie są zalety świąt w dużej rodzinie?","Какие плюсы у праздников в большой семье?"],["Ty","To dobre pytanie. Największą zaletą jest wspólny czas. Wadą może być stres i dużo pracy w kuchni.","Хороший вопрос. Главный плюс — время вместе. Минус — стресс и много работы на кухне."]],"r":{"pl":"Na egzaminie ustnym trzeba opowiedzieć o sobie, opisać obrazek i wyrazić opinię. Egzaminatorzy nie oczekują perfekcji. Ważne jest, żeby mówić płynnie, logicznie i odpowiadać na pytania. Pomagają gotowe zwroty: «Moim zdaniem…», «Na przykład…», «Z jednej strony…».","ru":"На устном экзамене нужно рассказать о себе, описать картинку и высказать мнение. Экзаменаторы не ждут совершенства. Важно говорить бегло, логично и отвечать на вопросы. Помогают готовые фразы: «По-моему…», «Например…», «С одной стороны…»."},"ff":["korzyść","корысть","польза, выгода; корысть = chciwość"],"lf":"Запишите ответ на диктофон и прослушайте: сразу слышно паузы и повторы. Лучшая подготовка к устной части.","ts":"Опишите вслух любую фотографию из телефона (1 минута): кто, где, что делают, ваше мнение.","tw":"Напишите 3 плюса и 3 минуса жизни в Польше (zalety / wady)."},{"d":87,"s":3,"wk":12,"t":"Приставки движения","tp":"Wejść, wyjść, przyjść…","w":[["wejść","войти"],["wyjść","выйти"],["przyjść","прийти"],["odejść","уйти, отойти"],["przejść","перейти, пройти"],["dojść","дойти"],["zejść","сойти, спуститься"],["obejść","обойти"]],"p":[["Proszę wejść!","Входите!"],["Muszę już wyjść.","Мне уже нужно уходить."],["Jak dojść do dworca?","Как дойти до вокзала?"]],"g":{"t":"Приставки как в русском","x":"w- (в-), wy- (вы-), przy- (при-), od- (от-), prze- (пере-), do- (до-), z- (с-), ob- (об-). С «jechać» так же: wjechać, wyjechać, przyjechać, odjechać, przejechać, dojechać, zjechać, objechać. Огромный бонус для русскоязычных.","e":[["Wyjechaliśmy z Mińska rano, a przyjechaliśmy wieczorem.","Мы выехали из Минска утром, а приехали вечером."],["Przejdź przez ulicę na zielonym.","Переходи улицу на зелёный."]]},"dl":[["Ty","Przepraszam, jak dojść do dworca?","Извините, как дойти до вокзала?"],["Pan","Proszę przejść przez most, potem zejść schodami w dół.","Перейдите через мост, потом спуститесь по лестнице."],["Ty","A potem?","А потом?"],["Pan","Obejść park z prawej strony i będzie pani na miejscu.","Обойдите парк справа — и вы на месте."]],"r":{"pl":"Rano wychodzę z domu o siódmej. Dochodzę do przystanku w pięć minut. Wsiadam do autobusu i wysiadam w centrum. Przechodzę przez rynek i wchodzę do biura. Po pracy przychodzę do domu zmęczona, ale zadowolona.","ru":"Утром я выхожу из дома в семь. До остановки дохожу за пять минут. Сажусь в автобус и выхожу в центре. Прохожу через площадь и вхожу в офис. После работы прихожу домой усталая, но довольная."},"ff":["przejście","«прошествие»","переход («przejście dla pieszych» — пешеходный переход)"],"lf":"«Wyjść za mąż» — выйти замуж, «ożenić się» — жениться. Тут языки совпадают!","ts":"Опишите вслух путь от дома до работы, используя 6 глаголов с приставками.","tw":"Вставьте приставки: ___jść do sklepu, ___jść z domu, ___jść przez ulicę, ___jechać do Polski."},{"d":88,"s":3,"wk":12,"type":"rev","t":"Повторение: неделя 12","tp":"Powtórka","rng":[82,87],"x":"Повторяем подготовку к B1: новости, договоры, аудирование, письмо, говорение, приставки. Пройдите тест, затем повторите все «ловушки» (ложные друзья) курса.","ts":"Пробная устная часть: о себе (1 мин), описание фото (1 мин), мнение на тему «Praca w Polsce» (1 мин).","tw":"Пробная п
