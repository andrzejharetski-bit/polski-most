исьменная часть: официальный e-mail (6–8 строк) и эссе на 120 слов."},{"d":89,"s":3,"wk":12,"type":"exam","t":"Финальный экзамен","tp":"Egzamin końcowy","rng":[1,88],"x":"Финальная проверка всего курса: 40 вопросов по словам и фразам дней 1–88. Проходной балл — 70%. Итог покажет, какие слова повторить перед настоящим экзаменом B1.","ts":"Устная часть, 5 минут: о себе, ваша жизнь в Польше, описание фото, мнение на тему «Czy warto uczyć się języka kraju, w którym się mieszka?».","tw":"Письменная часть: официальное письмо в ведомство и эссе «Moje życie w Polsce» (150 слов)."},{"d":90,"s":3,"wk":12,"t":"Финиш: что дальше","tp":"Meta!","w":[["certyfikat","сертификат"],["egzamin państwowy","государственный экзамен"],["poziom","уровень"],["zapisy","запись (на экзамен)"],["zdać","сдать (экзамен)"],["sukces","успех"],["dalej","дальше"],["płynnie","свободно, бегло"]],"p":[["Zapisałam się na egzamin B1.","Я записалась на экзамен B1."],["Mówię coraz płynniej.","Я говорю всё свободнее."],["Nie poddawaj się!","Не сдавайся!"]],"g":{"t":"Итог и план","x":"Вы прошли 7 падежей, 3 времени, вид глагола, повелительное и условное наклонения, звательный падеж и 10 правил моста. Дальше: 1) 10–15 минут польского каждый день; 2) раз в неделю — живой разговор; 3) повтор карточек по графику; 4) пробный тест B1 на certyfikatpolski.pl.","e":[["Przez trzy miesiące nauczyłam się bardzo dużo.","За три месяца я очень многому научилась."],["Teraz chcę zdać egzamin B1.","Теперь я хочу сдать экзамен B1."]]},"dl":[["Koleżanka","Twój polski jest coraz lepszy!","Твой польский всё лучше!"],["Ty","Dziękuję! Uczyłam się codziennie przez trzy miesiące.","Спасибо! Я занималась каждый день три месяца."],["Koleżanka","Co dalej?","Что дальше?"],["Ty","Zapiszę się na egzamin B1 i będę dużo rozmawiać z ludźmi.","Запишусь на экзамен B1 и буду много разговаривать с людьми."]],"r":{"pl":"Trzy miesiące temu znałam tylko «dzień dobry» i «dziękuję». Dziś rozmawiam z sąsiadami, załatwiam sprawy w urzędzie i rozumiem wiadomości. Popełniam błędy, ale to normalne. Najważniejsze, że nie przestałam się uczyć. Następny cel: certyfikat B1!","ru":"Три месяца назад я знала только «dzień dobry» и «dziękuję». Сегодня я разговариваю с соседями, решаю дела в ведомствах и понимаю новости. Я делаю ошибки, но это нормально. Главное — я не перестала учиться. Следующая цель — сертификат B1!"},"ff":["żart","жар","шутка («To był żart!» — это была шутка!); жар = gorączka"],"lf":"Привычка важнее рывков: 10–15 минут польского каждый день дают больше, чем 3 часа раз в неделю.","ts":"Запишите финальный рассказ (2–3 минуты): кто вы, как живёте в Польше, чему научились, планы. Сравните с записью дня 30.","tw":"Напишите письмо себе через год (8–10 предложений) на польском."}];
var LESSONS=[{"d":1,"t":"Первые слова и как читать польские буквы","tp":"Dzień dobry!","lvl":"A1","city":"Wrocław","goal":"Поздороваться, попрощаться, сказать «спасибо», «пожалуйста», «извините» и честно признаться «nie rozumiem». Научиться читать sz, cz, rz, ż, ch.","story":{"t":"Пролог 1. Вокзал Вроцлав","ru":"Надя приезжает во Вроцлав. Первый день, первый кофе на вокзале.","l":[["Sprzedawca","Dzień dobry!","Здравствуйте!"],["Nadia","Dzień dobry! Kawa?","Здравствуйте! Кофе?"],["Sprzedawca","Tak, proszę. Mała czy duża?","Да, пожалуйста. Маленький или большой?"],["Nadia","Przepraszam, nie rozumiem.","Извините, я не понимаю."],["Sprzedawca","Mała? Duża?","Маленький? Большой?"],["Nadia","Aaa! Duża, proszę.","А-а! Большой, пожалуйста."],["Sprzedawca","Proszę bardzo.","Пожалуйста (вот, держите)."],["Nadia","Dziękuję bardzo! Do widzenia!","Большое спасибо! До свидания!"]],"q":[{"q":"Co kupuje Nadia?","o":["kawę","wodę","bułkę"],"a":0},{"q":"Jaka kawa?","o":["duża","mała"],"a":0}]},"why":{"t":"Как читать польские буквы","q":"Польский пишется латиницей, но звуки почти все тебе знакомы. Угадай: «sz» звучит как русский шипящий звук или как свистящий?","p":["**Две буквы = один звук.** sz — твёрдый шипящий (кончик языка вверх), cz — твёрдый «ч», rz и ż — один и тот же звонкий шипящий, ch и h — как русское «х». Пример: szkoła, czekolada, rzeka, żona, chleb.","**w = звук «в», ł — губы трубочкой.** woda, kawa. Буква ł звучит как короткое «у» перед гласной, как английское w: mała, duża → ma-ła.","**Ударение почти всегда на предпоследний слог.** dzię-KU-ję, prze-PRA-szam, do wi-DZE-nia. Это правило работает в 95% слов — запомни его один раз.","**Почему так?** Польский взял латиницу, а звуков в ней не хватало. Поэтому шипящие записали сочетаниями (sz, cz, rz) и значками (ż, ł). Привыкнешь за неделю: это система, а не хаос."],"tb":{"h":["Пишем","Звук","Пример"],"r":[["sz","твёрдый шипящий","szkoła"],["cz","твёрдое «ч»","czekolada"],["rz = ż","звонкий шипящий","rzeka, żona"],["ch = h" ["i","y"],"a":"i","w":"ciastko — мягкое ci."}],"dict":["Poproszę wodę.","To wszystko, dziękuję."]},"rd":{"pl":"Piekarnia jest obok. Rano Nadia kupuje chleb i bułki. Piekarz pyta: „Coś jeszcze?”. Nadia mówi: „Poproszę małą kawę”. Kawa jest dobra, a chleb jest bardzo dobry. Nadia mówi: „To wszystko, dziękuję!”.","ru":"Пекарня рядом. Утром Надя покупает хлеб и булочки. Пекарь спрашивает: «Что-нибудь ещё?». Надя говорит: «Маленький кофе, пожалуйста». Кофе хороший, а хлеб очень хороший. Надя говорит: «Это всё, спасибо!».","q":[{"q":"Gdzie jest piekarnia?","o":["obok","daleko"],"a":0},{"q":"Jaką kawę kupuje Nadia?","o":["małą","dużą"],"a":0}]},"trap":["owoce","«овощи»","фрукты: jabłka, banany — to owoce (овощи = warzywa)"],"life":"В польских пекарнях хлеб часто продают целым или половинкой: «Poproszę pół chleba» — полбуханки. Можно попросить нарезать: «Pokroić?» — «Tak, poproszę».","role":{"ru":"Ты в пекарне. Ола — продавщица.","who":"sprzedawczyni","open":"Dzień dobry! Co dla pani?","goal":["Попроси хлеб и воду","Ответь на «coś jeszcze?»","Попрощайся"],"steps":[["Dzień dobry! Co dla pani?","Попроси хлеб и воду","Poproszę chleb i wodę."],["Proszę. Coś jeszcze?","Скажи: нет, спасибо, это всё","Nie, dziękuję. To wszystko."],["Dziesięć złotych. Dziękuję!","Попрощайся","Do widzenia!"]]},"boss":[{"k":"choice","s":"Poproszę ___ (kawa).","o":["kawę","kawa","kawy"],"a":"kawę"},{"k":"choice","s":"Poproszę ___ (ciastko).","o":["ciastko","ciastkę"],"a":"ciastko","w":"Средний род не меняется."},{"k":"choice","s":"Poproszę ___ wodę.","o":["dużą","duża"],"a":"dużą"},{"k":"build","pl":"Poproszę chleb i sok.","ru":"Хлеб и сок, пожалуйста."},{"k":"listen","pl":"To wszystko.","o":["Это всё.","Что-нибудь ещё?","Это хорошо."],"a":0},{"k":"mc","q":"«owoce» — это…","o":["фрукты","овощи"],"a":0,"w":"Ловушка дня!"},{"k":"mc","q":"Повторение: «Mam brata» —","o":["У меня есть брат.","Я брат."],"a":0},{"k":"listen","pl":"dziesięć","o":["10","9","6"],"a":0}]},{"d":9,"t":"Сколько стоит? Цены и числа до 100","tp":"Ile to kosztuje?","lvl":"A1","city":"Wrocław","goal":"Спросить цену, понять ответ, назвать любую сумму до 100 злотых и правильно сказать złote или złotych.","story":{"t":"Сцена 1. Магазин у дома","ru":"Надя неделю живёт во Вроцлаве. Утром она заходит в маленький магазин на углу. За прилавком пан Збышек.","l":[["Pan Zbyszek","Dzień dobry! Co podać?","Здравствуйте! Что вам подать?"],["Nadia","Dzień dobry. Ile kosztuje ten ser?","Здравствуйте. Сколько стоит этот сыр?"],["Pan Zbyszek","Dwanaście złotych za kostkę.","Двенадцать злотых за брусок."],["Nadia","A masło?","А масло?"],["Pan Zbyszek","Osiem pięćdziesiąt.","Восемь пятьдесят."],["Nadia","Poproszę ser, masło i dwie bułki.","Сыр, масло и две булочки, пожалуйста."],["Pan Zbyszek","Razem dwadzieścia dwa złote. Gotówka czy karta?","Итого двадцать два злотых. Наличные или карта?"],["Nadia","Kartą. I poproszę paragon.","Картой. И чек, пожалуйста."]],"q":[{"q":"Ile kosztuje masło?","o":["osiem pięćdziesiąt","dwanaście złotych","dwadzieścia dwa złote"],"a":0},{"q":"Jak płaci Nadia?","o":["kartą","gotówką","telefonem"],"a":0}]},"why":{"t":"Почему 2 złote, но 5 złotych?","q":"Почему поляк говорит «dwa złote», но «pięć złotych»? Это не случайность, и ты уже знаешь это правило из русского.","p":["Сравни: 2 рубля, но 5 рублей. В польском то же самое. После 2, 3, 4 существительное стоит во множественном числе: **złote, grosze**. После 5 и больше — в родительном падеже множественного числа: **złotych, groszy**.","**Почему так?** В древнем славянском числа от пяти были существительными: «пять» значило «пятёрка (чего?)». Поэтому после них слово ставили в родительный падеж: пятёрка рублей. А 2, 3, 4 вели себя как прилагательные и согласовывались со словом. Русский и польский унаследовали это правило от общего предка.","**Ловушка для русских:** 12, 13, 14 заканчиваются на -naście, а не на 2, 3, 4. Поэтому **dwanaście złotych**, как и в русском «двенадцать рублей». А 22, 23, 24 снова с **złote**: dwadzieścia dwa złote.","Числа строятся как в русском: **-naście** = «-надцать» (jedenaście, dwanaście), **-dzieści** = «-дцать» (dwadzieścia, trzydzieści, czterdzieści), **-dziesiąt** = «-десят» (pięćdziesiąt … dziewięćdziesiąt). Цену говорят коротко: 8,50 zł = «osiem pięćdziesiąt»."],"tb":{"h":["Число","złoty","grosz"],"r":[["1","złoty","grosz"],["2, 3, 4","złote","grosze"],["5–21","złotych","groszy"],["22, 23, 24","złote","grosze"],["25–31","złotych","groszy"]]},"tb2":{"h":["Число","Польский","Как в русском"],"r":[["11","jedenaście","одиннадцать"],["12","dwanaście","двенадцать"],["15","piętnaście","пятнадцать"],["20","dwadzieścia","двадцать"],["30","trzydzieści","тридцать"],["40","czterdzieści","сорок (другое!)"],["50","pięćdziesiąt","пятьдесят"],["90","dziewięćdziesiąt","девяносто (другое!)"],["100","sto","сто"]]},"pr":[{"q":"dwadzieścia cztery ___","o":["złote","złotych"],"a":0,"w":"24 оканчивается на 4 → złote, как «двадцать четыре рубля»."},{"q":"piętnaście ___","o":["złote","złotych"],"a":1,"w":"15 = -naście → złotych, как «пятнадцать рублей»."},{"q":"trzy ___ (grosz)","o":["grosze","groszy"],"a":0,"w":"После 2–4 множественное число: grosze."},{"q":"Как по-польски 40?","o":["czterdzieści","czterdziesiąt","sorok"],"a":0,"w":"20, 30, 40 оканчиваются на -dzieści, а 50–90 на -dziesiąt."}]},"w":[["kosztować","стоить","Ile kosztuje chleb?","Сколько стоит хлеб?"],["cena","цена","Jaka jest cena?","Какая цена?"],["drogi","дорогой","Ten ser jest drogi.","Этот сыр дорогой."],["tani","дешёвый","Chleb jest tani.","Хлеб дешёвый."],["razem","итого; вместе","Razem trzydzieści złotych.","Итого тридцать злотых."],["reszta","сдача","Proszę, reszta.","Вот, ваша сдача."],["paragon","чек","Czy mogę prosić paragon?","Можно чек?"],["gotówka","наличные","Płacę gotówką.","Плачу наличными."],["karta","карта","Płacę kartą.","Плачу картой."],["bułka","булочка","Poproszę dwie bułki.","Две булочки, пожалуйста."],["kostka","брусок; кубик","kostka masła","брусок масла"],["promocja","акция, скидка","Masło jest w promocji.","Масло по акции."]],"dr":[{"k":"gap","s":"To kosztuje pięć ___.","h":"złoty","a":["złotych"],"w":"После 5 → złotych."},{"k":"gap","s":"Płacę ___.","h":"karta, «чем?»","a":["kartą"],"w":"Płacić czym? → kartą (творительный: -ą)."},{"k":"build","pl":"Ile kosztuje ten ser?","ru":"Сколько стоит этот сыр?"},{"k":"build","pl":"Razem dwadzieścia dwa złote.","ru":"Итого двадцать два злотых."},{"k":"tr","ru":"Можно чек?","a":["Czy mogę prosić paragon?","Czy mogę prosić o paragon?","Poproszę paragon."]},{"k":"mc","q":"Как сказать 66 zł?","o":["sześćdziesiąt sześć złotych","szesnaście sześć złotych","sześćdziesiąt sześć złote"],"a":0,"w":"66 оканчивается на 6 → złotych."}],"snd":{"t":"Твёрдые sz, cz и мягкие ś, ć","how":["**sz, cz — твёрдые.** Кончик языка поднят к нёбу за верхними зубами, губы чуть вытянуты вперёд. Звук «толстый» и низкий: szkoła, czas, czterdzieści.","**ś, ć — мягкие.** Кончик языка опущен за нижние зубы, спинка языка выгнута к нёбу, губы растянуты, как в улыбке. Звук тонкий и высокий: sześć, dziś, pięć.","Перед гласной мягкость пишут через i: **si, ci** (siedem, ciastko) — это те же ś и ć. Типичная ошибка русских: произносить ś как обычное ш. Слушай пары и ищи разницу в «высоте» звука."],"pairs":[["wiesz","wieś","знаешь","деревня"],["kasza","Kasia","каша","Кася"],["czy","ci","ли","тебе"],["proszę","prosię","прошу","поросёнок"]],"say":["Sześć złotych.","Dziesięć złotych pięćdziesiąt groszy.","Czterdzieści pięć złotych.","Ile to kosztuje?"]},"wr":{"t":"Запятая перед a и ale; буква ó","rule":["**Запятая.** Перед **a** (а) и **ale** (но) ставим запятую — как в русском. Перед **i** (и) и **lub** (или), когда они соединяют однородные слова, запятой нет — тоже как в русском.","**ó или u?** Звучат одинаково, как «у». Пишем **ó**, если в родственном слове есть **o**: mój — moja, stół — stoły, król — królowa. Часто ó стоит там, где в русском «о»: мой — mój, король — król, стол — stół. Если такой проверки нет — пишем **u**: bułka, kupić."],"x":[{"k":"comma","s":"Chleb jest tani a ser jest drogi.","a":"Chleb jest tani, a ser jest drogi."},{"k":"comma","s":"Chcę płacić kartą ale terminal nie działa.","a":"Chcę płacić kartą, ale terminal nie działa."},{"k":"comma","s":"Kupuję chleb i masło.","a":"Kupuję chleb i masło."},{"k":"spell","s":"kr_l","o":["ó","u"],"a":"ó","w":"królowa → о → ó."},{"k":"spell","s":"st_ł","o":["ó","u"],"a":"ó","w":"stoły → о → ó; по-русски «стол»."},{"k":"spell","s":"b_łka","o":["ó","u"],"a":"u","w":"Проверки с «о» нет → u."},{"k":"spell","s":"k_pić","o":["ó","u"],"a":"u","w":"kupować, kupię — всегда u."}],"dict":["Razem dwadzieścia dwa złote.","Płacę kartą, a mąż płaci gotówką."]},"rd":{"pl":"Nadia mieszka we Wrocławiu od tygodnia. Rano idzie do małego sklepu na rogu. Pan Zbyszek zawsze mówi: „Dzień dobry, pani Nadio!”. Chleb kosztuje pięć złotych, a mleko cztery złote. Ser jest drogi, ale bardzo dobry. Nadia płaci kartą i bierze paragon. W domu liczy wydatki: razem dwadzieścia jeden złotych. „Nie jest źle” — myśli i się uśmiecha.","ru":"Надя живёт во Вроцлаве неделю. Утром она идёт в маленький магазин на углу. Пан Збышек всегда говорит: «Добрый день, пани Надя!». Хлеб стоит пять злотых, а молоко четыре. Сыр дорогой, но очень хороший. Надя платит картой и берёт чек. Дома она считает расходы: всего двадцать один злотый. «Неплохо», — думает она и улыбается.","q":[{"q":"Gdzie mieszka Nadia?","o":["we Wrocławiu","w Krakowie","w Warszawie"],"a":0},{"q":"Ile kosztuje mleko?","o":["cztery złote","pięć złotych","dwanaście złotych"],"a":0},{"q":"Ile wydaje Nadia razem?","o":["dwadzieścia jeden złotych","dwadzieścia dwa złote","dwanaście złotych"],"a":0}]},"trap":["reszta","«остаток»","в магазине это «сдача»: «Proszę, reszta» — вот ваша сдача"],"life":"Почти везде можно платить картой или телефоном. Популярен BLIK — шестизначный код из приложения банка. Чек (paragon) нужен для возврата товара, сохраняй его.","role":{"ru":"Ты в магазине. Ола — продавщица.","who":"sprzedawczyni","open":"Dzień dobry! Co podać?","goal":["Попроси 2 продукта (Poproszę …)","Спроси цену одного из них","Заплати картой и попроси чек"],"steps":[["Dzień dobry! Co podać?","Попроси хлеб и масло","Poproszę chleb i masło."],["Proszę bardzo. Coś jeszcze?","Спроси, сколько стоит сыр","Ile kosztuje ten ser?"],["Ser kosztuje czternaście złotych.","Скажи, что берёшь и платишь картой","Dobrze, biorę. Płacę kartą."],["Paragon?","Да, пожалуйста","Tak, poproszę."]]},"boss":[{"k":"mc","q":"Как сказать 47?","o":["czterdzieści siedem","czterdzieści sześć","czternaście siedem"],"a":0,"w":"40 = czterdzieści, 7 = siedem."},{"k":"mc","q":"pięć ___","o":["złote","złotych","złoty"],"a":1,"w":"После 5 → złotych."},{"k":"mc","q":"dwadzieścia dwa ___","o":["złote","złotych"],"a":0,"w":"22 оканчивается на 2 → złote."},{"k":"mc","q":"Что значит «reszta» в магазине?","o":["сдача","чек","скидка"],"a":0,"w":"Proszę, reszta — вот сдача."},{"k":"gap","s":"Płacę ___ (gotówka).","a":["gotówką"],"w":"Чем? → gotówką."},{"k":"comma","s":"Ser jest dobry ale drogi.","a":"Ser jest dobry, ale drogi."},{"k":"spell","s":"m_j paragon","o":["ó","u"],"a":"ó","w":"moja → ó."},{"k":"tr","ru":"Сколько стоит этот хлеб?","a":["Ile kosztuje ten chleb?"]},{"k":"listen","pl":"Sześćdziesiąt sześć złotych.","o":["66 zł","76 zł","56 zł"],"a":0},{"k":"listen","pl":"Osiem pięćdziesiąt.","o":["8,50 zł","18,50 zł","80,50 zł"],"a":0}]},{"d":10,"t":"Рынок: фрукты, овощи и множественное число","tp":"Na targu","lvl":"A1","city":"Wrocław","goal":"Купить на рынке овощи и фрукты с количеством и правильно образовать множественное число.","story":{"t":"Сцена 2. Рынок с пани Басей","ru":"Соседка Нади, пани Бася (ей 70, она знает всех), ведёт её на рынок.","l":[["Pani Basia","Nadia, chodź, idziemy na targ! Tam warzywa są tańsze.","Надя, пошли на рынок! Там овощи дешевле."],["Sprzedawca","Dzień dobry paniom! Co podać?","Добрый день, дамы! Что вам?"],["Nadia","Poproszę kilo jabłek i pół kilo pomidorów.","Килограмм яблок и полкило помидоров, пожалуйста."],["Sprzedawca","Jabłka są polskie, prosto z sadu.","Яблоки польские, прямо из сада."],["Pani Basia","A ogórki? Świeże?","А огурцы? Свежие?"],["Sprzedawca","Bardzo świeże. Trzy ogórki za dwa złote.","Очень свежие. Три огурца за два злотых."],["Nadia","Dobrze, biorę trzy ogórki i dwie cebule.","Хорошо, беру три огурца и две луковицы."],["Pani Basia","Widzisz? Tu wszystko jest tańsze!","Видишь? Здесь всё дешевле!"]],"q":[{"q":"Co kupuje Nadia?","o":["jabłka, pomidory, ogórki i cebule","tylko jabłka","ser i masło"],"a":0},{"q":"Ile kosztują trzy ogórki?","o":["dwa złote","trzy złote","pięć złotych"],"a":0}]},"why":{"t":"Почему banany, но ogórki и cebule?","q":"У польского множественного числа три окончания: -y, -i, -e. Как понять, какое нужно? Смотри на последнюю согласную.","p":["**Твёрдая основа → -y:** banan → banany, pomidor → pomidory, ryba → ryby.","**После k и g → -i:** ogórek → ogórki, bułka → bułki, noga → nogi. **Почему?** Сочетаний «ky» и «gy» в польском почти нет, как в русском нет «кы» и «гы». Поэтому и по-русски «руки», «ноги», а не «рукы».","**Мягкая основа и c, cz, sz, rz, ż, l, j → -e:** cebula → cebule, pomarańcza → pomarańcze, klucz → klucze.","**Средний род -o, -e → -a:** jabłko → jabłka, jajko → jajka, mieszkanie → mieszkania. Как русское окно → окна.","**Беглое e:** ogórek → ogórki — «e» выпадает, как в русском огурец → огурцы. А после 5 и больше — родительный падеж: pięć pomidorów, kilo jabłek (это следующий шаг, пока просто запомни)."],"tb":{"h":["Ед. число","Мн. число","Почему"],"r":[["banan","banany","твёрдая основа → -y"],["ogórek","ogórki","после k → -i, беглое e"],["cebula","cebule","мягкая основа → -e"],["jabłko","jabłka","средний род → -a"]]},"pr":[{"q":"gruszka → ?","o":["gruszki","gruszky","gruszke"],"a":0,"w":"После k → -i."},{"q":"pomarańcza → ?","o":["pomarańcze","pomarańczy","pomarańczi"],"a":0,"w":"После cz → -e."},{"q":"jajko → ?","o":["jajka","jajki","jajky"],"a":0,"w":"Средний род → -a."},{"q":"pomidor → ?","o":["pomidory","pomidori","pomidore"],"a":0,"w":"Твёрдая основа → -y."}]},"w":[["jabłko","яблоко","Kupuję jabłka.","Я покупаю яблоки."],["gruszka","груша","Te gruszki są słodkie.","Эти груши сладкие."],["śliwka","слива","Śliwki są w promocji.","Сливы по акции."],["truskawka","клубника","Zimą truskawki są drogie.","Зимой клубника дорогая."],["pomidor","помидор","Poproszę pół kilo pomidorów.","Полкило помидоров, пожалуйста."],["ogórek","огурец","Ogórki są świeże.","Огурцы свежие."],["cebula","лук (репчатый)","Zupa bez cebuli, proszę.","Суп без лука, пожалуйста."],["ziemniak","картофелина","Kilo ziemniaków kosztuje trzy złote.","Кило картошки стоит три злотых."],["marchew","морковь","Marchew jest zdrowa.","Морковь полезная."],["kapusta","капуста","Babcia robi kapustę z grzybami.","Бабушка готовит капусту с грибами."],["świeży","свежий","Czy to jest świeże?","Это свежее?"],["targ","рынок","W sobotę idę na targ.","В субботу я иду на рынок."]],"dr":[{"k":"gap","s":"dwa ___ (banan)","a":["banany"],"w":"Твёрдая основа → -y."},{"k":"gap","s":"trzy ___ (bułka)","a":["bułki"],"w":"После k → -i."},{"k":"gap","s":"dwie ___ (cebula)","a":["cebule"],"w":"Мягкая основа → -e."},{"k":"build","pl":"Poproszę kilo jabłek i pół kilo pomidorów.","ru":"Кило яблок и полкило помидоров, пожалуйста."},{"k":"tr","ru":"Огурцы свежие?","a":["Czy ogórki są świeże?","Ogórki są świeże?"]},{"k":"mc","q":"Как по-польски «картошка» (много)?","o":["ziemniaki","kartofla","ziemniaky"],"a":0,"w":"ziemniak → ziemniaki (после k → -i). В разговоре говорят и kartofle."}],"snd":{"t":"Звук ł","how":["**ł — это не русское «л».** Округли губы, как для «у», и сразу разомкни их — получится короткое скольжение, как английское w в слове water. Язык не касается зубов.","Обычное **l** в польском мягче русского «л», почти как «ль» в слове «лес»: las, lato.","Слова дня: jabłko, pół, słodki, łyżka. В jabłko звук ł почти незаметен — поляки говорят быстро и легко."],"pairs":[["lata","łata","лета","заплата"],["laska","łaska","трость","милость"],["bal","bał","бал","боялся"]],"say":["Pół kilo jabłek.","Słodkie śliwki.","Ogórki są świeże.","Jabłko i gruszka."]},"wr":{"t":"rz или ż? Запятая в перечислении","rule":["**rz и ż звучат одинаково.** Подсказка из русского: **rz** там, где в русском **р** (река → rzeka, море → morze, три → trzy). **ż** там, где в русском **ж** (жена → żona, жёлтый → żółty) или где ż чередуется с g, z, s, h (mogę → może).","**Перечисление:** запятые между однородными словами, перед последним «i» запятой нет — как в русском: Kupuję jabłka, gruszki i śliwki."],"x":[{"k":"spell","s":"_eka","o":["rz","ż"],"a":"rz","w":"река → р → rz."},{"k":"spell","s":"mo_e","o":["rz","ż"],"a":"rz","w":"море → р → rz."},{"k":"spell","s":"_ona","o":["rz","ż"],"a":"ż","w":"жена → ж → ż."},{"k":"spell","s":"t_y","o":["rz","ż"],"a":"rz","w":"три → р → rz."},{"k":"spell","s":"_ółty","o":["rz","ż"],"a":"ż","w":"жёлтый → ж → ż."},{"k":"comma","s":"Kupuję jabłka gruszki i śliwki.","a":"Kupuję jabłka, gruszki i śliwki."},{"k":"comma","s":"Mam marchew kapustę i trzy ogórki.","a":"Mam marchew, kapustę i trzy ogórki."}],"dict":["Poproszę kilo jabłek.","Trzy ogórki za dwa złote."]},"rd":{"pl":"W sobotę Nadia i pani Basia idą na targ. Na targu jest głośno i kolorowo. Są jabłka, gruszki, śliwki i dużo warzyw. Pani Basia zna wszystkich sprzedawców. „Tutaj są najlepsze ziemniaki w mieście” — mówi. Nadia kupuje marchew, kapustę i trzy ogórki. Płaci gotówką, bo na targu nie wszędzie można płacić kartą. Wieczorem robi sałatkę z pomidorów i ogórków.","ru":"В субботу Надя и пани Бася идут на рынок. На рынке шумно и ярко. Есть яблоки, груши, сливы и много овощей. Пани Бася знает всех продавцов. «Здесь лучшая картошка в городе», — говорит она. Надя покупает морковь, капусту и три огурца. Платит наличными, потому что на рынке не везде можно платить картой. Вечером она делает салат из помидоров и огурцов.","q":[{"q":"Kiedy idą na targ?","o":["w sobotę","w niedzielę","w poniedziałek"],"a":0},{"q":"Dlaczego Nadia płaci gotówką?","o":["nie wszędzie można płacić kartą","nie ma karty","gotówka jest tańsza"],"a":0},{"q":"Co robi Nadia wieczorem?","o":["sałatkę","zupę","ciasto"],"a":0}]},"trap":["jagody","«ягоды» вообще","в магазине так чаще всего называют чернику; ягоды вообще — owoce jagodowe"],"life":"Во многих городах есть крытые рынки (hala targowa). Овощи там часто свежее и дешевле. Небольшие суммы лучше иметь наличными.","role":{"ru":"Ты на рынке. Ола — продавщица.","who":"sprzedawczyni na targu","open":"Dzień dobry! Co dla pani?","goal":["Купи 3 вида овощей или фруктов с количеством (kilo, pół kilo, trzy…)","Спроси, свежие ли они","Заплати наличными"],"steps":[["Dzień dobry! Co dla pani?","Попроси кило яблок","Poproszę kilo jabłek."],["Proszę. Coś jeszcze?","Попроси полкило помидоров и спроси, свежие ли","Pół kilo pomidorów. Są świeże?"],["Bardzo świeże, z rana!","Попроси три огурца","I trzy ogórki, proszę."],["Razem jedenaście złotych.","Скажи, что платишь наличными","Płacę gotówką."]]},"boss":[{"k":"mc","q":"ogórek → множественное число","o":["ogórki","ogóreki","ogórky"],"a":0,"w":"Беглое e + после k → -i."},{"k":"mc","q":"śliwka → ?","o":["śliwki","śliwky","śliwke"],"a":0,"w":"После k → -i."},{"k":"mc","q":"jabłko → ?","o":["jabłka","jabłki","jabłky"],"a":0,"w":"Средний род → -a."},{"k":"spell","s":"_eka","o":["rz","ż"],"a":"rz","w":"река → rzeka."},{"k":"spell","s":"_aba","o":["rz","ż"],"a":"ż","w":"жаба → żaba."},{"k":"comma","s":"Kupuję gruszki śliwki i truskawki.","a":"Kupuję gruszki, śliwki i truskawki."},{"k":"gap","s":"dwa ___ (pomidor)","a":["pomidory"],"w":"Твёрдая основа → -y."},{"k":"tr","ru":"Полкило помидоров, пожалуйста.","a":["Pół kilo pomidorów, proszę.","Poproszę pół kilo pomidorów."]},{"k":"listen","pl":"Trzy ogórki za dwa złote.","o":["3 огурца за 2 злотых","2 огурца за 3 злотых","3 помидора за 2 злотых"],"a":0},{"k":"mc","q":"Что значит «targ»?","o":["рынок","торг, скидка","сумка"],"a":0,"w":"Iść na targ — идти на рынок."}]},{"d":11,"t":"Кафе: заказ и винительный падеж","tp":"W kawiarni","lvl":"A1","city":"Wrocław","goal":"Заказать напиток и десерт, выбрать «здесь» или «с собой», попросить счёт и правильно поставить слова в винительный падеж.","story":{"t":"Сцена 3. Кофе с Кубой","ru":"В пятницу коллега Куба зовёт Надю в кофейню рядом с офисом.","l":[["Kelnerka","Dzień dobry! Co dla państwa?","Здравствуйте! Что для вас?"],["Kuba","Dla mnie dużą czarną kawę.","Мне большой чёрный кофе."],["Nadia","A ja poproszę herbatę z cytryną i sernik.","А мне чай с лимоном и сырник, пожалуйста."],["Kelnerka","Na miejscu czy na wynos?","Здесь или с собой?"],["Kuba","Na miejscu.","Здесь."],["Kelnerka","Coś jeszcze? Mamy dziś pyszną szarlotkę.","Что-нибудь ещё? Сегодня у нас очень вкусная шарлотка."],["Nadia","Nie, dziękuję. Poproszę jeszcze wodę.","Нет, спасибо. И ещё воду, пожалуйста."],["Kelnerka","Razem trzydzieści osiem złotych.","Итого тридцать восемь злотых."]],"q":[{"q":"Co pije Kuba?","o":["dużą czarną kawę","herbatę z cytryną","sok"],"a":0},{"q":"Gdzie jedzą?","o":["na miejscu","na wynos","w domu"],"a":0}]},"why":{"t":"Почему kawa → kawę, но sok → sok?","q":"После «poproszę», «chcę», «mam», «kupuję» слово меняет окончание. Кто «виноват»? Винительный падеж — как в русском «хочу воду».","p":["**Женский род: -a → -ę.** kawa → kawę, herbata → herbatę, woda → wodę. Сравни: вода → воду.","**Почему ę, а не u?** В древнем славянском здесь был носовой звук. Русский потерял носовость, и получилось «у» (воду). Польский её сохранил, и получилось «ę» (wodę). Это одно и то же окончание, только с разной историей.","**Прилагательные женского рода: -a → -ą.** duża czarna kawa → dużą czarną kawę. Сравни: большую чёрную. Русское «-ую» и польское «-ą» тоже из одного древнего носового звука.","**Мужской род неодушевлённый и средний род не меняются:** sok → sok, sernik → sernik, ciastko → ciastko. Как в русском: хочу сок, хочу пирожное.","**Мужской род одушевлённый → -a:** brat → brata, kot → kota (как «вижу брата»). Это пригодится, когда будем говорить о людях."],"tb":{"h":["Род","Кто? Что?","Кого? Что? (винит.)","По-русски"],"r":[["жен.","duża kawa","dużą kawę","большую воду"],["муж. неодуш.","zimny sok","zimny sok","холодный сок"],["муж. одуш.","mój brat","mojego brata","моего брата"],["средн.","małe ciastko","małe ciastko","маленькое пирожное"]]},"pr":[{"q":"Poproszę ___ (zimna woda).","o":["zimną wodę","zimna woda","zimną woda"],"a":0,"w":"Женский род: -a → -ą, -a → -ę."},{"q":"Kupuję ___ (sok).","o":["sok","soka","soku"],"a":0,"w":"Неодушевлённый мужской род не меняется."},{"q":"Mam ___ (brat).","o":["brata","brat","bratę"],"a":0,"w":"Одушевлённый → -a, как «брата»."},{"q":"Chcę ___ (ciastko).","o":["ciastko","ciastkę","ciastka"],"a":0,"w":"Средний род не меняется."}]},"w":[["kawiarnia","кофейня, кафе","Ta kawiarnia jest bardzo przytulna.","Эта кофейня очень уютная."],["kelnerka","официантка","Kelnerka jest miła.","Официантка милая."],["kawa z mlekiem","кофе с молоком","Poproszę kawę z mlekiem.","Кофе с молоком, пожалуйста."],["herbata","чай","Herbata z cytryną.","Чай с лимоном."],["sok","сок","Sok pomarańczowy, proszę.","Апельсиновый сок, пожалуйста."],["ciastko","пирожное; печенье","To ciastko jest pyszne.","Это пирожное очень вкусное."],["sernik","польский творожный торт","Sernik to polski deser z twarogu.","Сернік — польский десерт из творога."],["szarlotka","шарлотка, яблочный пирог","Szarlotka z lodami.","Шарлотка с мороженым."],["rachunek","счёт","Poproszę rachunek.","Счёт, пожалуйста."],["na miejscu","здесь (не с собой)","Na miejscu, dziękuję.","Здесь, спасибо."],["na wynos","с собой","Kawa na wynos.","Кофе с собой."],["napiwek","чаевые","Zostawiam napiwek.","Я оставляю чаевые."]],"dr":[{"k":"gap","s":"Poproszę ___ (herbata).","a":["herbatę"],"w":"-a → -ę."},{"k":"gap","s":"Dla mnie ___ kawę (duża).","a":["dużą"],"w":"Прилагательное ж. р. → -ą."},{"k":"gap","s":"Chcę ___ (sok).","a":["sok"],"w":"Не меняется."},{"k":"build","pl":"Na miejscu czy na wynos?","ru":"Здесь или с собой?"},{"k":"build","pl":"Poproszę herbatę z cytryną i sernik.","ru":"Чай с лимоном и сернік, пожалуйста."},{"k":"tr","ru":"Счёт, пожалуйста.","a":["Poproszę rachunek.","Rachunek, proszę.","Proszę rachunek."]}],"snd":{"t":"Носовые ą и ę в конце слова","how":["**ę в конце слова** звучит почти как обычное e, с еле заметным носовым оттенком: kawę, herbatę, proszę. Не говори в конце «эн» — это ошибка.","**ą в конце слова** — это o с носовым призвуком, губы к концу округляются: dużą, czarną, idą. Воздух выходит и через нос.","Внутри слова перед p и b носовые звучат как om и em: ząb, kępa. Перед t и d — как on и en: kąt, będę. Перед k и g — как oŋ, eŋ (задний n): ręka, mąka."],"pairs":[["duża","dużą","большая","большую"],["czarna","czarną","чёрная","чёрную"],["woda","wodę","вода","воду"],["sama","samą","сама","саму"]],"say":["Poproszę dużą kawę.","Czarną herbatę z cytryną.","Na miejscu czy na wynos?","Poproszę rachunek."]},"wr":{"t":"Запятая перед czy; ch или h","rule":["**czy = «или»** между вариантами — без запятой: Kawa czy herbata? **czy = «ли»** в косвенном вопросе — с запятой: Nie wiem, czy mają sernik. В русском так же: «Не знаю, есть ли сырник».","**ch или h?** Звучат одинаково. **h** часто в заимствованиях: herbata, hotel, historia, harmonia. **ch** — в исконных словах и там, где в русском «х»: chleb (хлеб), chcę (хочу), ucho (ухо)."],"x":[{"k":"comma","s":"Kawa czy herbata?","a":"Kawa czy herbata?"},{"k":"comma","s":"Nie wiem czy mają sernik.","a":"Nie wiem, czy mają sernik."},{"k":"comma","s":"Zapytam czy jest wolny stolik.","a":"Zapytam, czy jest wolny stolik."},{"k":"spell","s":"_erbata","o":["h","ch"],"a":"h","w":"Заимствование → h."},{"k":"spell","s":"_leb","o":["h","ch"],"a":"ch","w":"хлеб → ch."},{"k":"spell","s":"_otel","o":["h","ch"],"a":"h","w":"Заимствование → h."},{"k":"spell","s":"_cę kawę","o":["h","ch"],"a":"ch","w":"хочу → ch."}],"dict":["Poproszę herbatę z cytryną.","Nie wiem, czy mają sernik."]},"rd":{"pl":"Kuba pracuje z Nadią w biurze. W piątek zaprasza ją do kawiarni obok. Kawiarnia jest mała, ale przytulna. Kuba zawsze pije czarną kawę bez cukru. Nadia woli herbatę z cytryną. Na deser biorą sernik i szarlotkę. Kuba mówi: „Sernik to polski skarb!”. Nadia się śmieje. Na koniec Kuba płaci rachunek, a Nadia zostawia napiwek.","ru":"Куба работает с Надей в офисе. В пятницу он приглашает её в соседнюю кофейню. Кофейня маленькая, но уютная. Куба всегда пьёт чёрный кофе без сахара. Надя предпочитает чай с лимоном. На десерт они берут сернік и шарлотку. Куба говорит: «Сернік — польское сокровище!». Надя смеётся. В конце Куба оплачивает счёт, а Надя оставляет чаевые.","q":[{"q":"Co pije Kuba?","o":["czarną kawę bez cukru","kawę z mlekiem","herbatę"],"a":0},{"q":"Co biorą na deser?","o":["sernik i szarlotkę","lody","ciastka"],"a":0},{"q":"Kto płaci rachunek?","o":["Kuba","Nadia","kelnerka"],"a":0}]},"trap":["pyszny","«пышный»","«очень вкусный»: pyszna szarlotka — очень вкусная шарлотка"],"life":"Чаевые в кафе не обязательны; принято оставить около 10% или округлить сумму. Фраза «Reszty nie trzeba» значит «Сдачи не надо».","role":{"ru":"Ты в кафе. Ола — официантка.","who":"kelnerka","open":"Dzień dobry! Co dla pani?","goal":["Закажи напиток (в винительном падеже)","Закажи десерт","Скажи «здесь» или «с собой»","Попроси счёт"],"steps":[["Dzień dobry! Co dla pani?","Закажи большой кофе с молоком","Poproszę dużą kawę z mlekiem."],["Coś do jedzenia?","Закажи сернік","Tak, poproszę sernik."],["Na miejscu czy na wynos?","Здесь","Na miejscu."],["Proszę bardzo. Smacznego!","Попроси счёт","Poproszę rachunek."]]},"boss":[{"k":"mc","q":"Poproszę ___ (woda).","o":["wodę","woda","wodą"],"a":0,"w":"Винительный ж. р.: -ę."},{"k":"mc","q":"Dla mnie ___ herbatę (czarna).","o":["czarną","czarna","czarnę"],"a":0,"w":"Прилагательное ж. р.: -ą."},{"k":"mc","q":"Chcę ___ (sernik).","o":["sernik","sernika","serniką"],"a":0,"w":"Неодушевлённый м. р. не меняется."},{"k":"mc","q":"«na wynos» значит…","o":["с собой","здесь","на вынос мусора"],"a":0,"w":"Kawa na wynos — кофе с собой."},{"k":"comma","s":"Nie wiem czy jest wolny stolik.","a":"Nie wiem, czy jest wolny stolik."},{"k":"spell","s":"_otel","o":["h","ch"],"a":"h","w":"Заимствование."},{"k":"spell","s":"u_o","o":["h","ch"],"a":"ch","w":"ухо → ucho."},{"k":"tr","ru":"Мне чай с лимоном.","a":["Dla mnie herbatę z cytryną.","Poproszę herbatę z cytryną.","Dla mnie herbata z cytryną."]},{"k":"listen","pl":"Razem trzydzieści osiem złotych.","o":["38 zł","48 zł","28 zł"],"a":0},{"k":"mc","q":"«pyszny» значит…","o":["очень вкусный","пышный","пушистый"],"a":0,"w":"Ловушка урока."}]},{"d":12,"t":"Аптека: «Boli mnie…» и «Mam…»","tp":"W aptece","lvl":"A1","city":"Wrocław","goal":"Объяснить в аптеке, что болит, спросить про рецепт и понять, как принимать лекарство.","story":{"t":"Сцена 4. Надя простыла","ru":"В понедельник Надя просыпается больной и идёт в аптеку рядом с домом. За прилавком фармацевт Магда.","l":[["Magda","Dzień dobry, w czym mogę pomóc?","Здравствуйте, чем могу помочь?"],["Nadia","Dzień dobry. Boli mnie gardło i głowa.","Здравствуйте. У меня болит горло и голова."],["Magda","Ma pani gorączkę?","У вас есть температура?"],["Nadia","Trochę, trzydzieści siedem i pół.","Немного, тридцать семь и пять."],["Magda","Polecam te tabletki do ssania i coś na gorączkę.","Рекомендую эти таблетки для рассасывания и что-нибудь от температуры."],["Nadia","Czy to jest bez recepty?","Это без рецепта?"],["Magda","Tak, bez recepty. Trzy razy dziennie po jedzeniu.","Да, без рецепта. Три раза в день после еды."],["Nadia","Dziękuję bardzo.","Большое спасибо."]],"q":[{"q":"Co boli Nadię?","o":["gardło i głowa","brzuch","ząb"],"a":0},{"q":"Jak brać tabletki?","o":["trzy razy dziennie po jedzeniu","raz dziennie rano","przed jedzeniem"],"a":0}]},"why":{"t":"Почему «boli mnie», а не «у меня болит»?","q":"В польском нет конструкции «у меня есть» и «у меня болит». Как же тогда говорят?","p":["**Боль: Boli mnie + что болит.** Буквально «болит меня горло». Человек стоит в винительном падеже: mnie, cię, go, ją. Если болит несколько частей, глагол во множественном: **Bolą mnie nogi.**","**Болезнь: Mam + болезнь.** Польский заменил «у меня есть» глаголом mieć (иметь): **Mam katar** — у меня насморк. После mam — винительный падеж из прошлого урока: gorączka → **Mam gorączkę.**","**Почему так?** Конструкция «у меня есть» — особенность русского языка. В польском и в большинстве европейских языков говорят «я имею»: польское mam, английское I have, немецкое ich habe. Поэтому русскую фразу «у меня…» почти всегда переводи через mam.","Местоимения для боли: mnie (меня), cię (тебя), go (его), ją (её), nas (нас), was (вас), ich (их)."],"tb":{"h":["По-русски","По-польски"],"r":[["У меня болит голова","Boli mnie głowa"],["У тебя болит горло?","Boli cię gardło?"],["У него болит зуб","Boli go ząb"],["У меня болят ноги","Bolą mnie nogi"],["У меня насморк","Mam katar"],["У меня температура","Mam gorączkę"]]},"pr":[{"q":"У неё болит живот →","o":["Boli ją brzuch.","U niej boli brzuch.","Ona boli brzuch."],"a":0,"w":"Boli + ją (её) + что болит."},{"q":"У меня кашель →","o":["Mam kaszel.","U mnie kaszel.","Boli mnie kaszel."],"a":0,"w":"Болезнь → mam."},{"q":"У меня болят зубы →","o":["Bolą mnie zęby.","Boli mnie zęby.","Mam zęby."],"a":0,"w":"Много зубов → bolą."}]},"w":[["apteka","аптека","Apteka jest otwarta do dwudziestej drugiej.","Аптека открыта до 22:00."],["farmaceutka","фармацевт (женщина)","Farmaceutka mi pomaga.","Фармацевт мне помогает."],["recepta","рецепт","Ten lek jest na receptę.","Это лекарство по рецепту."],["tabletka","таблетка","Jedna tabletka rano.","Одна таблетка утром."],["syrop","сироп","Syrop na kaszel.","Сироп от кашля."],["gardło","горло","Boli mnie gardło.","У меня болит горло."],["głowa","голова","Boli cię głowa?","У тебя болит голова?"],["brzuch","живот","Boli go brzuch.","У него болит живот."],["ząb","зуб","Boli mnie ząb.","У меня болит зуб."],["katar","насморк","Mam katar.","У меня насморк."],["kaszel","кашель","Mam suchy kaszel.","У меня сухой кашель."],["gorączka","температура, жар","Mam gorączkę.","У меня температура."]],"dr":[{"k":"gap","s":"___ mnie głowa.","a":["Boli"],"w":"Одна голова → boli."},{"k":"gap","s":"___ mnie nogi.","a":["Bolą"],"w":"Ноги — много → bolą."},{"k":"gap","s":"Mam ___ (gorączka).","a":["gorączkę"],"w":"После mam — винительный: -ę."},{"k":"build","pl":"Czy to jest bez recepty?","ru":"Это без рецепта?"},{"k":"build","pl":"Trzy razy dziennie po jedzeniu.","ru":"Три раза в день после еды."},{"k":"tr","ru":"У меня насморк и кашель.","a":["Mam katar i kaszel."]}],"snd":{"t":"Польское y — не русское ы","how":["**y** похоже на русское «ы», но оно ниже и расслабленнее: язык опущен чуть больше, губы нейтральные. Звук ближе к середине между «ы» и «э».","**i** — обычное «и», а перед i согласная всегда мягкая: mi, bić, pić.","Различие y и i меняет смысл: być (быть) и bić (бить), my (мы) и mi (мне). Слушай: в y язык не напрягается."],"pairs":[["być","bić","быть","бить"],["my","mi","мы","мне"],["pył","pił","пыль","пил"]],"say":["Boli mnie gardło.","Mam gorączkę i katar.","Czy to jest bez recepty?","Trzy razy dziennie."]},"wr":{"t":"nie раздельно или слитно; запятая перед bo и więc","rule":["**nie с глаголами пишем раздельно:** nie mam, nie boli, nie wiem — как в русском.","**nie с прилагательными — слитно:** niedrogi (недорогой), niezdrowy (нездоровый) — тоже как в русском.","**Запятая перед bo** (потому что) и **więc** (поэтому, так что): Biorę tabletkę, bo boli mnie głowa. Mam gorączkę, więc zostaję w domu."],"x":[{"k":"choice","s":"___ mnie gardło.","o":["Nie boli","Nieboli"],"a":"Nie boli","w":"С глаголом — раздельно: Nie boli."},{"k":"choice","s":"To jest ___ lek.","o":["niedrogi","nie drogi"],"a":"niedrogi","w":"С прилагательным — слитно."},{"k":"choice","s":"___ recepty.","o":["Nie mam","Niemam"],"a":"Nie mam","w":"Nie mam — раздельно."},{"k":"choice","s":"Ten syrop jest ___.","o":["niesmaczny","nie smaczny"],"a":"niesmaczny","w":"С прилагательным — слитно."},{"k":"comma","s":"Biorę tabletkę bo boli mnie głowa.","a":"Biorę tabletkę, bo boli mnie głowa."},{"k":"comma","s":"Mam gorączkę więc zostaję w domu.","a":"Mam gorączkę, więc zostaję w domu."}],"dict":["Boli mnie gardło.","Mam gorączkę, więc zostaję w domu."]},"rd":{"pl":"W poniedziałek Nadia budzi się chora. Boli ją gardło, ma katar i lekką gorączkę. Dzwoni do pracy i mówi Kubie, że dziś nie przyjdzie. Potem idzie do apteki obok domu. Farmaceutka jest bardzo miła i wszystko spokojnie tłumaczy. Nadia kupuje syrop i tabletki bez recepty. W domu pije herbatę z miodem i dużo śpi. Wieczorem czuje się już lepiej.","ru":"В понедельник Надя просыпается больной. У неё болит горло, насморк и небольшая температура. Она звонит на работу и говорит Кубе, что сегодня не придёт. Потом идёт в аптеку рядом с домом. Фармацевт очень милая и всё спокойно объясняет. Надя покупает сироп и таблетки без рецепта. Дома она пьёт чай с мёдом и много спит. Вечером ей уже лучше.","q":[{"q":"Co boli Nadię?","o":["gardło","brzuch","ząb"],"a":0},{"q":"Do kogo dzwoni Nadia?","o":["do Kuby","do pani Basi","do lekarza"],"a":0},{"q":"Co pije w domu?","o":["herbatę z miodem","kawę","syrop z wodą"],"a":0}]},"trap":["gorączka","«горячка» (бред)","просто «температура, жар»: Mam gorączkę — у меня температура"],"life":"Лекарство по рецепту выдают по e-рецепту: в SMS приходит четырёхзначный код, в аптеке называешь его и свой PESEL. Экстренный номер — 112. Ночная аптека называется apteka całodobowa.","role":{"ru":"Ты в аптеке. Ола — фармацевт.","who":"farmaceutka","open":"Dzień dobry, w czym mogę pomóc?","goal":["Скажи, что болит (2 вещи)","Скажи, есть ли температура","Спроси, нужен ли рецепт","Спроси, как принимать"],"steps":[["Dzień dobry, w czym mogę pomóc?","Скажи, что болит горло и голова","Boli mnie gardło i głowa."],["Ma pani gorączkę?","Скажи, что немного","Tak, trochę."],["Polecam ten syrop.","Спроси, без рецепта ли он","Czy to jest bez recepty?"],["Tak. Dwa razy dziennie.","Поблагодари","Dziękuję bardzo."]]},"boss":[{"k":"mc","q":"У меня болит зуб →","o":["Boli mnie ząb.","U mnie boli ząb.","Mam ząb."],"a":0,"w":"Boli mnie + что."},{"k":"mc","q":"У меня температура →","o":["Mam gorączkę.","Mam gorączka.","Boli mnie gorączka."],"a":0,"w":"Mam + винительный."},{"k":"mc","q":"___ mnie nogi.","o":["Bolą","Boli","Bolę"],"a":0,"w":"Ноги — множественное → bolą."},{"k":"mc","q":"«bez recepty» значит…","o":["без рецепта","без очереди","бесплатно"],"a":0,"w":"Recepta — рецепт."},{"k":"choice","s":"To jest ___ syrop.","o":["niedrogi","nie drogi"],"a":"niedrogi","w":"Слитно с прилагательным."},{"k":"comma","s":"Zostaję w domu bo mam katar.","a":"Zostaję w domu, bo mam katar."},{"k":"gap","s":"Boli ___ brzuch (у неё).","a":["ją"],"w":"Её → ją."},{"k":"tr","ru":"У меня болит горло.","a":["Boli mnie gardło."]},{"k":"listen","pl":"Trzy razy dziennie po jedzeniu.","o":["3 раза в день после еды","3 раза в день до еды","2 раза в день после еды"],"a":0},{"k":"mc","q":"«gorączka» значит…","o":["температура","горячка, бред","горчица"],"a":0,"w":"Ловушка урока."}]},{"d":13,"t":"Еда: jeść, pić и спряжение глаголов","tp":"Smacznego!","lvl":"A1","city":"Wrocław","goal":"Рассказать, что ты ешь и пьёшь, спрягать глаголы на -ać, а также jeść и pić, поддержать разговор за столом.","story":{"t":"Сцена 5. Ужин у пани Баси","ru":"Пани Бася зовёт Надю на польский ужин.","l":[["Pani Basia","Nadia, siadaj! Jesz zupę?","Надя, садись! Будешь суп?"],["Nadia","Tak, chętnie. Co to jest?","Да, с удовольствием. Что это?"],["Pani Basia","To żurek, polska zupa na zakwasie. Jemy go na Wielkanoc, ale ja robię go cały rok!","Это журек, польский суп на закваске. Его едят на Пасху, но я варю его круглый год!"],["Nadia","Pyszny! A co pani pije do obiadu?","Очень вкусный! А что вы пьёте за обедом?"],["Pani Basia","Kompot z jabłek. Mój mąż pije tylko herbatę.","Компот из яблок. Мой муж пьёт только чай."],["Nadia","My w domu też pijemy kompot!","Мы дома тоже пьём компот!"],["Pani Basia","No widzisz! Jedz, jedz, są jeszcze pierogi.","Ну вот видишь! Ешь, ешь, ещё есть вареники."],["Nadia","Dziękuję, było pyszne!","Спасибо, было очень вкусно!"]],"q":[{"q":"Co to jest żurek?","o":["polska zupa na zakwasie","ciasto","napój"],"a":0},{"q":"Co pije mąż pani Basi?","o":["tylko herbatę","kompot","kawę"],"a":0}]},"why":{"t":"Почему czytam, а не «czytaję»? И почему jem?","q":"Русское «читаю» по-польски — czytam. Откуда «-m»? Ответ сидит в русском слове «ем».","p":["**Группа -m, -sz (как mieć: mam, masz).** Почти все глаголы на -ać: czytać → czytam, czytasz, czyta, czytamy, czytacie, czytają.","**Почему -m?** В древнем славянском окончание -мь было лишь у нескольких глаголов: есмь, ямь (ем), дамь (дам), вѣмь (знаю). Русский сохранил его только в «ем» и «дам». Польский, наоборот, распространил -m на все глаголы на -ać. Поэтому русское «ем» и польское «czytam» — родственники.","**jeść** спрягается почти как русское «есть»: jem, jesz, je, jemy, jecie, jedzą — ем, ешь, ест, едим, едите, едят.","**pić** — группа -ę, -esz, как русское «пью»: piję, pijesz, pije, pijemy, pijecie, piją.","**Подсказка:** окончание «они» в группе -m — это **-ją**: czytają, mają. Носовое ą здесь — тот же древний звук, что в русском «-ют» (читают)."],"tb":{"h":["Лицо","czytać","jeść","pić"],"r":[["ja","czytam","jem","piję"],["ty","czytasz","jesz","pijesz"],["on, ona","czyta","je","pije"],["my","czytamy","jemy","pijemy"],["wy","czytacie","jecie","pijecie"],["oni, one","czytają","jedzą","piją"]]},"pr":[{"q":"oni ___ (jeść)","o":["jedzą","jedą","jeją"],"a":0,"w":"Как русское «едят»: jedzą."},{"q":"ty ___ (pić)","o":["pijesz","pisz","piesz"],"a":0,"w":"piję, pijesz — как «пью, пьёшь»."},{"q":"my ___ (czekać)","o":["czekamy","czekajemy","czekymy"],"a":0,"w":"Группа -m: czekam, czekamy."},{"q":"ja ___ (jeść)","o":["jem","jedę","jeszę"],"a":0,"w":"Как русское «ем»."}]},"w":[["śniadanie","завтрак","Na śniadanie jem jajecznicę.","На завтрак я ем яичницу."],["obiad","обед (главная еда дня)","Obiad jemy o piętnastej.","Обедаем в 15:00."],["kolacja","ужин","Kolacja jest o dziewiętnastej.","Ужин в 19:00."],["zupa","суп","Zupa pomidorowa z makaronem.","Томатный суп с макаронами."],["żurek","журек (кислый суп)","Żurek jest kwaśny.","Журек кислый."],["pierogi","вареники","Pierogi ruskie są z serem i ziemniakami.","«Русские» вареники — с творогом и картошкой."],["kompot","компот","Kompot z truskawek.","Компот из клубники."],["mięso","мясо","Nie jem mięsa.","Я не ем мясо."],["ryba","рыба","W piątek jemy rybę.","В пятницу мы едим рыбу."],["Smacznego!","Приятного аппетита!","Smacznego! — Dziękuję, nawzajem!","Приятного аппетита! — Спасибо, и вам!"],["głodny","голодный","Jestem bardzo głodna.","Я очень голодная."],["chętnie","с удовольствием","Chętnie spróbuję.","С удовольствием попробую."]],"dr":[{"k":"gap","s":"Ja ___ zupę (jeść).","a":["jem"],"w":"jem — как «ем»."},{"k":"gap","s":"My ___ kompot (pić).","a":["pijemy"],"w":"pijemy — как «пьём»."},{"k":"gap","s":"Oni ___ książkę (czytać).","a":["czytają"],"w":"Группа -m: oni → -ją."},{"k":"build","pl":"Co pani pije do obiadu?","ru":"Что вы пьёте за обедом?"},{"k":"build","pl":"Na śniadanie jem jajecznicę.","ru":"На завтрак я ем яичницу."},{"k":"tr","ru":"Спасибо, было очень вкусно!","a":["Dziękuję, było pyszne!","Dziękuję, było bardzo smaczne!","Dziękuję, było bardzo pyszne!"]}],"snd":{"t":"rz и ż — один звук; оглушение после t, p, k","how":["**rz и ż звучат одинаково:** твёрдый звонкий звук, похожий на русское «ж», но язык чуть дальше назад, губы слегка округлены: żurek, rzeka, może.","**После глухих p, t, k, ch rz оглушается** и звучит как sz: przepraszam, trzy, krzesło, chrzan. Это правило, а не ошибка.","**ż и sz различают слова:** żal (жаль) и szal (шаль), żyć (жить) и szyć (шить). Голос: в ż связки работают — приложи руку к горлу и почувствуешь вибрацию."],"pairs":[["żal","szal","жаль","шаль"],["żyć","szyć","жить","шить"],["rzeka","trzy","река (звонко)","три (глухо)"]],"say":["Jem żurek i pierogi.","Pijemy kompot.","Smacznego!","Przepraszam, jestem głodna."]},"wr":{"t":"Большая и маленькая буква; запятая перед że","rule":["**С маленькой буквы:** дни недели и месяцы (poniedziałek, listopad), прилагательные от стран (polska zupa) — как в русском.","**С большой буквы:** страны и города (Polska, Wrocław), праздники (Wielkanoc, Boże Narodzenie). Праздники — отличие от русского!","**Запятая перед że** (что): Pani Basia mówi, że żurek jest zdrowy. В русском тоже запятая перед «что»."],"x":[{"k":"choice","s":"To jest ___ zupa.","o":["polska","Polska"],"a":"polska","w":"Прилагательное — с маленькой."},{"k":"choice","s":"Mieszkam w ___.","o":["Polsce","polsce"],"a":"Polsce","w":"Страна — с большой."},{"k":"choice","s":"Do zobaczenia w ___!","o":["piątek","Piątek"],"a":"piątek","w":"Дни недели — с маленькой."},{"k":"choice","s":"Jemy żurek na ___.","o":["Wielkanoc","wielkanoc"],"a":"Wielkanoc","w":"Праздник — с большой."},{"k":"comma","s":"Basia mówi że żurek jest zdrowy.","a":"Basia mówi, że żurek jest zdrowy."},{"k":"comma","s":"Wiem że jesteś głodna.","a":"Wiem, że jesteś głodna."}],"dict":["Na obiad jemy zupę.","Mówi, że jest głodna."]},"rd":{"pl":"W Polsce obiad to najważniejszy posiłek dnia. Ludzie jedzą go zwykle po pracy, około piętnastej. Na początku jest zupa, na przykład pomidorowa, ogórkowa albo żurek. Potem drugie danie: mięso albo ryba, ziemniaki i surówka. Do picia jest kompot albo woda. Na kolację Polacy jedzą coś lekkiego: kanapki albo sałatkę. Pani Basia mówi, że bez zupy obiad się nie liczy!","ru":"В Польше обед — самая важная еда дня. Его обычно едят после работы, около трёх часов. Сначала суп, например томатный, огуречный или журек. Потом второе блюдо: мясо или рыба, картошка и салат из сырых овощей. Пьют компот или воду. На ужин поляки едят что-то лёгкое: бутерброды или салат. Пани Бася говорит, что без супа обед не считается!","q":[{"q":"Kiedy ludzie jedzą obiad?","o":["około piętnastej","rano","o północy"],"a":0},{"q":"Co jest na początku obiadu?","o":["zupa","deser","kanapki"],"a":0},{"q":"Co Polacy jedzą na kolację?","o":["coś lekkiego","żurek","dużo mięsa"],"a":0}]},"trap":["pierogi ruskie","«русские вареники»","название от исторической Червонной Руси (Галиция); начинка — картошка с творогом, к России отношения нет"],"life":"Перед едой говорят «Smacznego!», а в ответ — «Dziękuję, nawzajem!» (спасибо, и вам). Обед в Польше поздний, часто в 14–16 часов, а ужин лёгкий.","role":{"ru":"Ты за столом у пани Баси. Ола играет пани Басю.","who":"pani Basia","open":"Nadia, siadaj! Jesz zupę?","goal":["Скажи, что ешь и что пьёшь (jem, piję)","Спроси, что это за блюдо","Похвали еду и поблагодари"],"steps":[["Nadia, siadaj! Jesz zupę?","Да, с удовольствием","Tak, chętnie."],["To żurek. Lubisz?","Скажи, что очень вкусно, и спроси, что пьют к обеду","Jest pyszny! Co pani pije do obiadu?"],["Kompot z jabłek. A ty?","Скажи, что пьёшь чай","Ja piję herbatę."],["Jedz, jedz, są jeszcze pierogi!","Поблагодари: было очень вкусно","Dziękuję, było pyszne!"]]},"boss":[{"k":"mc","q":"oni ___ (jeść)","o":["jedzą","jemy","jedą"],"a":0,"w":"jedzą — едят."},{"k":"mc","q":"ja ___ (pić)","o":["piję","pijem","pię"],"a":0,"w":"piję — пью."},{"k":"mc","q":"wy ___ (czytać)","o":["czytacie","czytajecie","czytamy"],"a":0,"w":"Группа -m: wy → -cie."},{"k":"mc","q":"Ответ на «Smacznego!»","o":["Dziękuję, nawzajem!","Proszę bardzo!","Na zdrowie!"],"a":0,"w":"Nawzajem — и вам тоже."},{"k":"choice","s":"W ___ jemy rybę.","o":["piątek","Piątek"],"a":"piątek","w":"Дни недели — с маленькой."},{"k":"comma","s":"Mówię że jestem głodna.","a":"Mówię, że jestem głodna."},{"k":"spell","s":"p_epraszam","o":["rz","ż"],"a":"rz","w":"Пишем rz, слышим sz после p."},{"k":"tr","ru":"На завтрак я ем яичницу.","a":["Na śniadanie jem jajecznicę."]},{"k":"listen","pl":"Obiad jemy o piętnastej.","o":["Обедаем в 15:00","Обедаем в 5:00","Ужинаем в 15:00"],"a":0},{"k":"mc","q":"pierogi ruskie — это…","o":["вареники с картошкой и творогом","русские пельмени","пироги с мясом"],"a":0,"w":"Ловушка урока."}]},{"d":14,"type":"rev","t":"Повторение недели 2 и мини-экзамен","t
