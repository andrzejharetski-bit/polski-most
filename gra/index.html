<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F1">
<title>Ogonek · Polski Most — польский как игра</title>
<style>:root{--bg:#FFF8F1;--card:#FFFFFF;--ink:#1E2235;--muted:#5E6378;--line:#EDE3D8;--red:#E0414F;--red2:#B92E3B;--navy:#2B3A67;--gold:#F4B942;--ok:#2E9E6A;--okbg:#E5F5EC;--warn:#C9761A;--warnbg:#FFF1DE;--err:#D64545;--errbg:#FDE8E8;--lav:#EEF0FA;--r:18px;--sh:0 6px 22px rgba(30,34,53,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:88px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,248,241,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:16px;flex:1;display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.brand i{font-style:normal;background:var(--red);color:#fff;border-radius:8px;padding:1px 7px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-weight:700;font-size:13px;white-space:nowrap}
.wrap{padding:16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:0 0 14px}
.card.soft{background:var(--lav);box-shadow:none}
.card.hero{background:linear-gradient(135deg,#2B3A67,#46578F);color:#fff}
.card.hero .muted{color:#D5DBF0}
h1{font-size:24px;line-height:1.2;margin:0 0 6px}
h2{font-size:20px;line-height:1.25;margin:0 0 10px}
h3{font-size:17px;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 0 var(--red2);margin-top:10px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red2)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.navy{background:var(--navy);box-shadow:0 4px 0 #1B2546}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #20744D}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--lav);color:var(--navy);margin:2px 4px 2px 0}
.chip.red{background:#FCE3E5;color:var(--red2)}
.chip.ok{background:var(--okbg);color:#20744D}
.chip.gold{background:#FFF1CF;color:#8A5B00}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center}
.tabs .in{display:flex;max-width:640px;width:100%}
.tabs button{flex:1;padding:8px 0 calc(10px + env(safe-area-inset-bottom));font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:21px;line-height:1}
.tabs button.on{color:var(--red)}
.ring{width:84px;height:84px;flex:0 0 84px}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.dots{display:flex;gap:5px;padding:8px 16px}
.dots i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--red)}
.dots i.done{background:var(--ok)}
.lhead{display:flex;align-items:center;gap:10px;padding:10px 16px 0}
.x{font-size:24px;padding:4px 8px;color:var(--muted)}
.bt{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.say{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--lav);font-size:18px;flex:0 0 40px}
.say.big{width:56px;height:56px;font-size:24px;flex-basis:56px}
.say.playing{background:var(--gold)}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.who{font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.pl{font-weight:700;font-size:18px}
.ru{color:var(--muted);font-size:15px}
.ru.hide{filter:blur(5px);cursor:pointer}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:#fff;margin:8px 0;font-weight:600;font-size:17px;box-shadow:0 3px 0 var(--line)}
.opt.ok{border-color:var(--ok);background:var(--okbg);box-shadow:0 3px 0 var(--ok)}
.opt.bad{border-color:var(--err);background:var(--errbg);box-shadow:0 3px 0 var(--err)}
.opt.dim{opacity:.55}
.fb{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:15px}
.fb.ok{background:var(--okbg);color:#165C3C}
.fb.hint{background:var(--warnbg);color:#7A4600}
.fb.bad{background:var(--errbg);color:#8E2323}
.inp{width:100%;min-height:52px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;background:#fff;outline:none}
.inp:focus{border-color:var(--navy)}
.kb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.kb button{min-width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:17px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border:2px dashed var(--line);border-radius:14px;margin:8px 0}
.tile{padding:9px 13px;border-radius:12px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:17px}
.tile.used{opacity:.25;pointer-events:none}
.sent{font-size:20px;font-weight:700;line-height:2.1}
.gapbtn{display:inline-block;min-width:22px;height:30px;margin:0 1px;border-radius:8px;border:2px dashed #C9BFB3;vertical-align:middle;color:var(--red);font-weight:900}
.gapbtn.on{border-style:solid;border-color:var(--red);background:#FCE3E5}
.letter{display:inline-block;min-width:44px;padding:8px 12px;margin:4px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:20px;box-shadow:0 3px 0 var(--line)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 12px}
.tbl th{text-align:left;background:var(--lav);color:var(--navy);padding:8px;font-size:13px}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{font-weight:700}
.why p{font-size:16px}
.big{font-size:22px;font-weight:800}
.mic{width:88px;height:88px;border-radius:50%;background:var(--red);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:10px auto;box-shadow:0 6px 0 var(--red2)}
.mic.rec{background:var(--err);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,69,69,.5)}100%{box-shadow:0 0 0 22px rgba(214,69,69,0)}}
.target{font-size:21px;font-weight:800;text-align:center;line-height:1.6}
.target span{padding:1px 3px;border-radius:6px;transition:background .2s}
.w-ok{background:var(--okbg);color:#165C3C}
.w-diac{background:var(--warnbg);color:#7A4600}
.w-bad{background:var(--errbg);color:#8E2323}
.heard{text-align:center;color:var(--muted);min-height:24px;font-style:italic}
.score{font-size:40px;font-weight:900;text-align:center}
.pairbtns{display:flex;gap:10px}
.pairbtns button{flex:1;padding:18px 8px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:21px;box-shadow:0 3px 0 var(--line)}
.pairbtns button small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;font-size:16px}
.msg.ola{background:var(--lav);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:#FCE3E5;align-self:flex-end;border-bottom-right-radius:4px}
.msg .fix{display:block;margin-top:6px;font-size:14px;color:#7A4600}
.day{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fff;margin:8px 0;box-shadow:var(--sh);width:100%;text-align:left}
.day .n{width:44px;height:44px;border-radius:12px;background:var(--lav);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--navy);flex:0 0 44px}
.day.done .n{background:var(--okbg);color:var(--ok)}
.day.cur .n{background:var(--red);color:#fff}
.day.lock{opacity:.55}
.mission{display:flex;align-items:center;gap:10px;padding:8px 0}
.mission .ic{font-size:22px}
.mission .prog{flex:1}
.city{display:inline-flex;flex-direction:column;align-items:center;width:23%;margin:1%;padding:8px 2px;border-radius:12px;background:#fff;font-size:12px;font-weight:700;box-shadow:var(--sh)}
.city b{font-size:22px}
.city.off{opacity:.35;filter:grayscale(1)}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:99;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(30,34,53,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.emo{display:flex;justify-content:space-between;margin:10px 0}
.emo button{font-size:34px;padding:6px;border-radius:12px}
.emo button.on{background:#FCE3E5}
.stage{border-left:4px solid var(--red);padding:2px 0 2px 12px;margin:14px 0}
.combo{color:var(--warn);font-weight:900}
.hidden{display:none!important}
.cele{text-align:center;font-size:64px;margin:10px 0}
.timer{font-size:13px;font-weight:700;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;color:var(--navy);padding:6px 0}

.lsticky{position:sticky;top:49px;z-index:15;background:var(--bg);margin:-16px -16px 6px;padding:2px 0 0;box-shadow:0 6px 10px -8px rgba(30,34,53,.25)}
.card{scroll-margin-top:136px}
.line.hl{background:#FFF1CF;border-radius:12px}
.row.wrap{flex-wrap:wrap}
.row.wrap>.cue{flex:1 1 44%;min-height:44px;font-size:14px;padding:8px 10px;margin-top:0}
.btn.cue.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 0 #1B2546}
.hero .prog{background:rgba(255,255,255,.22);margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.wd{border-radius:12px;background:var(--lav);text-align:center;padding:9px 0;font-size:13px;font-weight:700;color:var(--muted)}
.wd.on{background:var(--ok);color:#fff}
.wd.today{outline:2px solid var(--navy);outline-offset:1px}

/* ===== 3.0 additions ===== */
.whyb{float:right;margin:-6px -6px 6px 8px;padding:5px 11px;border-radius:999px;background:var(--lav);color:var(--navy);font-size:13px;font-weight:800;border:1px solid var(--line);position:relative;z-index:2}
.whyb:disabled{opacity:1}
.kbsw{display:block;margin:10px auto 0;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);border:1px dashed var(--line)}
.letter.wopt{font-size:18px;min-width:auto;padding:9px 14px}
.lvl{display:inline-block;width:70px;height:8px;border-radius:9px;background:var(--line);vertical-align:middle;overflow:hidden;margin-left:6px}
.lvl i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.pl,.sent,.target,.rd span,.big,.tile,.opt,.letter{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.modal .sheet h2{margin-top:0}
#thb{cursor:pointer;flex:0 0 auto}
.top .brand{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
body[data-theme=neon] .top .brand{font-size:14px;letter-spacing:.02em}
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thc{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:10px;border-radius:16px;border:2px solid var(--line);background:var(--card)}
.thc.on{border-color:var(--red)}
.sw{display:block;width:100%;height:58px;border-radius:12px;margin-bottom:4px}
.sw-classic{background:linear-gradient(135deg,#FFF8F1 0 50%,#E0414F 50% 75%,#2B3A67 75%)}
.sw-runner{background:linear-gradient(135deg,#1FB6FF,#7B5CFF 55%,#FF3D7F 56%,#FFD400)}
.sw-neon{background:linear-gradient(135deg,#0B0820 40%,#FF2BD6 41% 60%,#00E5FF 61% 80%,#F7FF00 81%)}
.sw-arena{background:radial-gradient(circle at 70% 30%,#0AC8B9 0 12%,transparent 13%),linear-gradient(135deg,#0A1428 55%,#C8AA6E 56% 70%,#785A28 71%)}
.ogmini{display:inline-block;vertical-align:middle;margin:-6px 0 -6px -4px}
.ogo{overflow:visible}
.ogo .og-eyes{transform-origin:60px 44px;animation:ogblink 4.2s infinite}
.ogo .og-wl{transform-origin:34px 66px;animation:ogwing 1.6s ease-in-out infinite}

.ogo .og-tail{transform-origin:84px 90px;animation:ogtail 2.2s ease-in-out infinite}
@keyframes ogblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes ogwing{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes ogtail{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
.ogwrap{animation:ogbob 2.6s ease-in-out infinite}
@keyframes ogbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.bubble{position:relative;flex:1;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:700;margin-bottom:34px}
.bubble:after{content:"";position:absolute;left:-10px;bottom:14px;border:8px solid transparent;border-right-color:var(--line)}
.ghome{overflow:hidden}
#ogobub{position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
#ogobub .ob-t{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;box-shadow:var(--sh);max-width:210px}
#ogobub.jump .ob-s{animation:ogjump .55s ease}
@keyframes ogjump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16px) scale(1.06)}70%{transform:translateY(0) scale(.97)}100%{transform:scale(1)}}
.cfx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.cfx i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:cf 1.9s ease-in forwards}
@keyframes cf{to{top:105%;transform:translateX(30px) rotate(720deg)}}
.bpl{display:flex;flex-direction:column;gap:6px}
.bpr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--lav);font-weight:700;font-size:15px}
.bpr.un{background:var(--warnbg);outline:2px solid var(--gold)}
.bpr.got{opacity:.7}
.bpn{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card);font-weight:900}
.bpc{width:auto;min-height:34px;padding:0 12px;font-size:14px;margin:0}
.accb{display:flex;flex-direction:column;align-items:center;padding:6px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
.accb.on{border-color:var(--red)}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:14px;background:var(--lav);min-height:110px}
.kc.on{background:var(--card);border:2px solid var(--gold)}
.kq{width:54px;height:63px;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:var(--muted)}
.kfind{border:2px solid var(--gold)}
.sz .prog{background:rgba(255,255,255,.25)}
.sz .prog>i{background:var(--gold)}

/* ===== skins ===== */
body[data-theme=runner]{--bg:#E8F6FF;--card:#FFFFFF;--ink:#14213D;--muted:#4A5A7A;--line:#CDE2F5;--red:#FF3D7F;--red2:#C81E5B;--navy:#1E5BFF;--gold:#FFD400;--ok:#00B862;--okbg:#DBFAE8;--warn:#FF8A00;--warnbg:#FFF1D2;--err:#FF3B30;--errbg:#FFE3DF;--lav:#E7F0FF;--r:22px;--sh:0 6px 0 #CDE2F5;font-family:"Rubik",-apple-system,sans-serif;
 background:linear-gradient(180deg,#BFE9FF 0,#E8F6FF 260px) fixed,var(--bg)}
body[data-theme=runner] h1,body[data-theme=runner] h2,body[data-theme=runner] h3,body[data-theme=runner] .brand,body[data-theme=runner] .bt{font-family:"Russo One","Rubik",sans-serif;font-weight:400;letter-spacing:.01em}
body[data-theme=runner] .top{background:linear-gradient(90deg,#1FB6FF,#7B5CFF);color:#fff;border-bottom:0}
body[data-theme=runner] .top .pill{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
body[data-theme=runner] .card{border:2px solid #CDE2F5}
body[data-theme=runner] .card.hero{background:linear-gradient(135deg,#FF3D7F,#FF8A00);border:0;box-shadow:0 8px 0 #C81E5B}
body[data-theme=runner] .btn{box-shadow:0 6px 0 var(--red2);text-transform:uppercase;letter-spacing:.03em}
body[data-theme=runner] .btn.navy{box-shadow:0 6px 0 #0F3BB8}
body[data-theme=runner] .btn.sec{text-transform:none}
body[data-theme=runner] .opt,body[data-theme=runner] .tile,body[data-theme=runner] .letter{box-shadow:0 4px 0 #CDE2F5}
body[data-theme=runner] .tabs button.on{color:var(--navy)}
body[data-theme=runner] .mic{background:linear-gradient(135deg,#FF3D7F,#FF8A00)}

body[data-theme=neon],body[data-theme=arena]{color-scheme:dark}
body[data-theme=neon]{--bg:#0B0820;--card:#141133;--ink:#EDEBFF;--muted:#A6A2D6;--line:#2E2A62;--red:#FF2BD6;--red2:#A30F8D;--navy:#00D8F0;--gold:#F7FF00;--ok:#21F3A3;--okbg:rgba(33,243,163,.13);--warn:#FFB800;--warnbg:rgba(255,184,0,.13);--err:#FF4D6D;--errbg:rgba(255,77,109,.15);--lav:#1C1844;--r:6px;--sh:0 0 0 1px rgba(0,216,240,.18),0 10px 30px rgba(255,43,214,.08);font-family:"Rubik",-apple-system,sans-serif;
 background:linear-gradient(rgba(0,216,240,.05) 1px,transparent 1px) 0 0/100% 28px,radial-gradient(circle at 20% 0,rgba(255,43,214,.22),transparent 45%),radial-gradient(circle at 90% 30%,rgba(0,216,240,.18),transparent 40%),#0B0820}
body[data-theme=neon] h1,body[data-theme=neon] h2,body[data-theme=neon] h3,body[data-theme=neon] .brand,body[data-theme=neon] .bt{font-family:"Unbounded","Rubik",sans-serif;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
body[data-theme=neon] h1,body[data-theme=neon] h2{text-shadow:0 0 12px rgba(255,43,214,.55)}
body[data-theme=neon] .top{background:rgba(11,8,32,.9);border-bottom:1px solid #FF2BD6;box-shadow:0 0 18px rgba(255,43,214,.35)}
body[data-theme=neon] .card{border:1px solid rgba(0,216,240,.28)}
body[data-theme=neon] .card.hero{background:linear-gradient(135deg,#2A0B4D,#0B2A4D);border:1px solid #FF2BD6;box-shadow:0 0 24px rgba(255,43,214,.35)}
body[data-theme=neon] .btn{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:none;text-transform:uppercase;letter-spacing:.06em;font-family:"Unbounded","Rubik",sans-serif;font-weight:600;font-size:14px}
body[data-theme=neon] .btn.navy{color:#0B0820}
body[data-theme=neon] .btn.ok{color:#0B0820}
body[data-theme=neon] .btn.sec{border:1px solid var(--navy);color:var(--navy);background:transparent}
body[data-theme=neon] .mic{background:#FF2BD6;box-shadow:0 0 28px rgba(255,43,214,.7)}

<script>var V1=[{"d":1,"s":1,"wk":1,"t":"Шипящие звуки и первые слова","tp":"Dzień dobry!","w":[["dzień dobry","добрый день, здравствуйте"],["dziękuję","спасибо"],["proszę","пожалуйста; прошу; вот, держите"],["przepraszam","извините"],["tak","да"],["nie","нет; не"],["cześć","привет; пока (на «ты»)"],["do widzenia","до свидания"]],"p":[["Dzień dobry! Poproszę kawę.","Здравствуйте! Кофе, пожалуйста."],["Przepraszam, nie rozumiem.","Извините, я не понимаю."],["Dziękuję bardzo!","Большое спасибо!"]],"g":{"t":"Как читать польские буквы","x":"Польский пишется латиницей, но почти все звуки вам знакомы. Запомните: sz = ш, cz = ч, rz и ż = ж, ch и h = х, w = в, y — похоже на ы, но ниже и мягче, ó = у, ł = короткое «у», как английское w. Ударение почти всегда на предпоследний слог: dzię-KU-ję, prze-PRA-szam.","e":[["szkoła","школа"],["czekolada","шоколад (че-ко-ЛА-да)"],["rzeka","река"],["łóżko","кровать"]]},"dl":[["Sprzedawca","Dzień dobry!","Здравствуйте!"],["Ty","Dzień dobry! Poproszę kawę.","Здравствуйте! Кофе, пожалуйста."],["Sprzedawca","Proszę. Dziesięć złotych.","Пожалуйста. Десять злотых."],["Ty","Dziękuję. Do widzenia!","Спасибо. До свидания!"]],"r":{"pl":"Dzień dobry! To jest lekcja numer jeden. Mówię: tak, nie, proszę, dziękuję. Polski nie jest trudny. Krok po kroku!","ru":"Здравствуйте! Это урок номер один. Я говорю: да, нет, пожалуйста, спасибо. Польский не трудный. Шаг за шагом!"},"ff":["uroda","уродство","красота, внешность («piękna uroda» — красивая внешность)"],"lf":"Входя в магазин, кабинет врача или лифт, поляки говорят «Dzień dobry». Это обычная вежливость.","ts":"Скажите вслух 5 раз, чётко: Dzień dobry — Dziękuję — Przepraszam — Do widzenia. Запишите себя на диктофон и сравните с озвучкой.","tw":"Напишите 3 слова из урока с буквами sz, cz или rz и переведите их."},{"d":2,"s":1,"wk":1,"t":"Мягкие звуки и «как дела?»","tp":"Jak się masz?","w":[["dobrze","хорошо"],["źle","плохо"],["bardzo","очень"],["też","тоже"],["świetnie","отлично"],["tak sobie","так себе"],["dziś","сегодня"],["a ty?","а ты?"]],"p":[["Jak się masz?","Как дела? (на «ты»)"],["Dobrze, dziękuję. A ty?","Хорошо, спасибо. А ты?"],["Miło mi.","Приятно познакомиться."]],"g":{"t":"Мягкие звуки ś, ć, ź, dź, ń","x":"Чёрточка над буквой делает звук мягким: ś — мягкое «щ», ć — мягкое «чь», ź — мягкое «жь», dź — мягкое «джь», ń — «нь». Перед гласной вместо чёрточки пишут i: si, ci, zi, dzi, ni.","e":[["dziś","сегодня"],["ciepło","тепло"],["siostra","сестра"],["koń","конь"]]},"dk":{"t":"Правило моста №1: -ть → -ć","e":[["читать","czytać"],["знать","znać"],["пить","pić"],["жить","żyć"],["спать","spać"]]},"dl":[["Ania","Cześć! Jak się masz?","Привет! Как дела?"],["Ty","Dobrze, dziękuję. A ty?","Хорошо, спасибо. А ты?"],["Ania","Też dobrze. Dziś jest świetnie!","Тоже хорошо. Сегодня отлично!"],["Ty","Bardzo się cieszę!","Очень рада!"]],"r":{"pl":"Cześć! Mam na imię Ania. Dziś jest zimno, ale mam się dobrze. Mam kawę i dobrą książkę. A ty? Jak się masz?","ru":"Привет! Меня зовут Аня. Сегодня холодно, но у меня всё хорошо. У меня есть кофе и хорошая книга. А ты? Как дела?"},"ff":["czas","час","время («nie mam czasu» — нет времени); час = godzina"],"lf":"«Jak się masz?» говорят только на «ты». Незнакомому взрослому достаточно «Dzień dobry».","ts":"Ответьте вслух на «Jak się masz?» тремя способами: świetnie / dobrze / tak sobie.","tw":"Переведите по правилу №1: знать, пить, жить."},{"d":3,"s":1,"wk":1,"t":"Носовые ą и ę. Знакомство","tp":"Mam na imię…","w":[["imię","имя"],["nazwisko","фамилия"],["jestem","я (есть)"],["z Białorusi","из Беларуси"],["z Ukrainy","из Украины"],["z Rosji","из России"],["Polska","Польша"],["mieszkam","я живу"]],"p":[["Mam na imię Olga.","Меня зовут Ольга."],["Jestem z Białorusi.","Я из Беларуси."],["Mieszkam w Polsce.","Я живу в Польше."]],"g":{"t":"Носовые гласные ą и ę","x":"ą — это o с носовым призвуком (ząb, mąż), ę — e с носовым призвуком (ręka). В конце слова ę почти как обычное e: dziękuję. Слушай озвучку, а не русские буквы. Фамилию говорят так: «Nazywam się Iwanowa» — моя фамилия Иванова.","e":[["ręka","рука"],["ząb","зуб"],["Nazywam się Iwanowa.","Моя фамилия Иванова."]]},"dk":{"t":"Правило моста №2: у/я → ą/ę","e":[["рука","ręka"],["зуб","ząb"],["пять","pięć"],["мясо","mięso"],["муж","mąż"]]},"dl":[["Urzędniczka","Jak pani ma na imię?","Как вас зовут?"],["Ty","Mam na imię Olga.","Меня зовут Ольга."],["Urzędniczka","A nazwisko?","А фамилия?"],["Ty","Nazywam się Iwanowa. Jestem z Białorusi.","Моя фамилия Иванова. Я из Беларуси."]],"r":{"pl":"Mam na imię Olga. Jestem z Białorusi, ale teraz mieszkam w Polsce, we Wrocławiu. Mój mąż pracuje. Ja uczę się polskiego codziennie.","ru":"Меня зовут Ольга. Я из Беларуси, но сейчас живу в Польше, во Вроцлаве. Мой муж работает. Я учу польский каждый день."},"ff":["rodzina","родина","семья; родина = ojczyzna"],"lf":"В официальных бумагах сначала фамилия, потом имя: «Nazwisko, imię».","ts":"Представьтесь вслух: имя, фамилия, откуда вы, где живёте.","tw":"Напишите о себе 3 предложения по образцу диалога."},{"d":4,"s":1,"wk":1,"t":"Глагол «быть» и обращение Pan/Pani","tp":"Pan, Pani","w":[["pan","господин; вы (мужчине)"],["pani","госпожа; вы (женщине)"],["państwo","господа; вы (группе)"],["kto","кто"],["co","что"],["tutaj","здесь"],["tam","там"],["czy","ли (вопрос «да/нет»)"]],"p":[["Czy pan mówi po rosyjsku?","Вы говорите по-русски?"],["Proszę mówić wolniej.","Говорите, пожалуйста, медленнее."],["Czy to miejsce jest wolne?","Это место свободно?"]],"g":{"t":"Być: jestem, jesteś, jest…","x":"В польском «быть» в настоящем времени не пропускают. ja jestem, ty jesteś, on/ona jest, my jesteśmy, wy jesteście, oni/one są. Незнакомым говорят «pan/pani» и глагол в 3-м лице: «Czy pani jest z Polski?» — Вы из Польши? Вопрос «да/нет» начинают с «czy».","e":[["Czy pani jest z Polski?","Вы из Польши?"],["Oni są w domu.","Они дома."],["Jesteś tutaj?","Ты здесь?"]]},"dk":{"t":"Правило моста №3: ж → ż, ре/ри → rze/rzy","e":[["река","rzeka"],["море","morze"],["три","trzy"],["жена","żona"],["жаба","żaba"]]},"dl":[["Ty","Przepraszam, czy pan mówi po rosyjsku?","Извините, вы говорите по-русски?"],["Pan","Niestety nie. Mówię po polsku i po angielsku.","К сожалению, нет. Я говорю по-польски и по-английски."],["Ty","Proszę mówić wolniej.","Говорите, пожалуйста, медленнее."],["Pan","Dobrze. Pani jest z Ukrainy?","Хорошо. Вы из Украины?"],["Ty","Nie, jestem z Białorusi.","Нет, я из Беларуси."]],"r":{"pl":"To jest pan Marek. On jest z Polski. To jest pani Olga. Ona jest z Białorusi. Oni są tutaj, w szkole językowej. Pan Marek jest nauczycielem.","ru":"Это пан Марек. Он из Польши. Это пани Ольга. Она из Беларуси. Они здесь, в языковой школе. Пан Марек — учитель."},"ff":["pytać","пытать","спрашивать («Mogę zapytać?» — Можно спросить?)"],"lf":"На «ты» к незнакомому взрослому обращаться невежливо. Говорите «pan/pani», пока вам не предложат перейти на «ty».","ts":"Задайте вслух 3 вопроса воображаемому прохожему с «pan/pani».","tw":"Проспрягайте «być» для всех лиц и напишите 2 вопроса с «Czy pani…?»."},{"d":5,"s":1,"wk":1,"t":"Цифры 0–10 и номер телефона","tp":"Liczby 0–10","c":11,"w":[["zero","ноль"],["jeden","один"],["dwa","два"],["trzy","три"],["cztery","четыре"],["pięć","пять"],["sześć","шесть"],["siedem","семь"],["osiem","восемь"],["dziewięć","девять"],["dziesięć","десять"]],"p":[["Mój numer telefonu to…","Мой номер телефона…"],["Proszę powtórzyć.","Повторите, пожалуйста."],["Jaki jest pana numer?","Какой у вас номер?"]],"g":{"t":"Числа и диктовка номера","x":"Числа похожи на русские, но звучат по-польски: trzy — «тшы», cztery — «чтэры», sześć — «шещчь», dziewięć — «джевенчь». Номер телефона новичку проще диктовать по одной цифре: pięć, zero, jeden…","e":[["dwa plus trzy to pięć","два плюс три — пять"],["Mój numer: pięć, zero, jeden…","Мой номер: 5-0-1…"]]},"dk":{"t":"Правило моста №4: оло/оро/ере → ło/ro/rze","e":[["голова","głowa"],["золото","złoto"],["берег","brzeg"],["дерево","drzewo"],["ворона","wrona"]]},"dl":[["Recepcja","Proszę podać numer telefonu.","Назовите, пожалуйста, номер телефона."],["Ty","Pięć, zero, jeden, trzy, cztery, osiem…","Пять, ноль, один, три, четыре, восемь…"],["Recepcja","Przepraszam, proszę powtórzyć wolniej.","Извините, повторите медленнее."],["Ty","Oczywiście. Pięć… zero… jeden…","Конечно. Пять… ноль… один…"]],"r":{"pl":"Mam dwa telefony: jeden polski i jeden białoruski. Polski numer ma dziewięć cyfr. Mój mąż ma jeden telefon. W domu mamy trzy komputery i zero problemów!","ru":"У меня два телефона: польский и белорусский. Польский номер состоит из девяти цифр. У мужа один телефон. Дома у нас три компьютера и ноль проблем!"},"ff":["rok","рок (судьба)","год («dwa lata» — два года)"],"lf":"112 — единый номер экстренной помощи в Польше и ЕС. Сохраните его в телефоне.","ts":"Продиктуйте вслух свой номер телефона по-польски: сначала медленно, потом быстро.","tw":"Запишите словами цифры своего номера телефона."},{"d":6,"s":1,"wk":1,"t":"«Mieć» — у меня есть","tp":"Mam, masz, ma","w":[["mąż","муж"],["żona","жена"],["dziecko","ребёнок"],["dzieci","дети"],["syn","сын"],["córka","дочь"],["praca","работа"],["pies","собака"]],"p":[["Mam męża.","У меня есть муж."],["Nie mam czasu.","У меня нет времени."],["Ile masz lat?","Сколько тебе лет?"]],"g":{"t":"Mieć: mam, masz, ma…","x":"Русское «у меня есть» по-польски «mam» (я имею): mam, masz, ma, mamy, macie, mają. Отрицание «nie mam» требует родительного падежа, как русское «нет чего»: mam czas → nie mam czasu. Возраст: «Mam trzydzieści lat» — мне 30 лет.","e":[["Mam męża i syna.","У меня есть муж и сын."],["Czy masz dzieci?","У тебя есть дети?"],["Nie mamy samochodu.","У нас нет машины."]]},"dk":{"t":"Правило моста №5: -ость → -ość","e":[["радость","radość"],["молодость","młodość"],["новость","nowość"],["гость","gość"],["кость","kość"]]},"dl":[["Ania","Masz rodzinę w Polsce?","У тебя есть семья в Польше?"],["Ty","Tak, mam męża. Nie mam dzieci.","Да, у меня есть муж. Детей нет."],["Ania","A psa?","А собака?"],["Ty","Mamy psa! Ma na imię Reks.","У нас есть собака! Её зовут Рекс."]],"r":{"pl":"Mam męża. On ma na imię Paweł i ma dobrą pracę w firmie. Nie mamy dzieci, ale mamy psa. Pies ma trzy lata. Mamy też dużo planów!","ru":"У меня есть муж. Его зовут Павел, у него хорошая работа в фирме. Детей у нас нет, но есть собака. Собаке три года. А ещё у нас много планов!"},"ff":["jutro","утро","завтра; утро = rano"],"lf":"Возраст по-польски говорят через «mieć»: «Mam dwadzieścia osiem lat» — мне 28 лет.","ts":"Расскажите вслух о своей семье: 4 предложения с mam / nie mam.","tw":"Проспрягайте «mieć» и напишите 3 предложения: что у вас есть и чего нет."},{"d":7,"s":1,"wk":1,"type":"rev","t":"Повторение: неделя 1","tp":"Powtórka","rng":[1,6],"x":"Сегодня без новых слов. Повторяем дни 1–6: карточки, тест, произношение. Цель — 80% правильных ответов. Ошибки не страшны: именно они показывают, что повторить.","ts":"Монолог на 30 секунд: поздоровайтесь, представьтесь, скажите, откуда вы и кто у вас есть.","tw":"Напишите короткое сообщение новой знакомой: приветствие, имя, откуда вы и 1 вопрос."},{"d":8,"s":1,"wk":2,"t":"В магазине: «Poproszę…»","tp":"W sklepie","w":[["chleb","хлеб"],["woda","вода"],["mleko","молоко"],["masło","сливочное масло"],["ser","сыр"],["jajka","яйца"],["kawa","кофе"],["herbata","чай"]],"p":[["Poproszę chleb.","Хлеб, пожалуйста."],["Czy jest świeży?","Он свежий?"],["Torbę? — Nie, dziękuję.","Пакет? — Нет, спасибо."]],"g":{"t":"Просьба и винительный падеж","x":"Вежливая просьба — «Poproszę…», прямое «Chcę…» звучит резче. Chcieć: chcę, chcesz, chce, chcemy, chcecie, chcą. После них женский род на -a меняет окончание на -ę: woda → wodę, kawa → kawę. Как в русском «воду».","e":[["Poproszę wodę.","Воду, пожалуйста."],["Chcę kawę z mlekiem.","Я хочу кофе с молоком."]]},"dk":{"t":"Правило моста №6: о в закрытом слоге → ó (читается «у»)","e":[["Бог","Bóg"],["нож","nóż"],["мой","mój"],["твой","twój"],["двор","dwór"]]},"dl":[["Ty","Dzień dobry. Poproszę chleb i mleko.","Здравствуйте. Хлеб и молоко, пожалуйста."],["Sprzedawczyni","Proszę. Coś jeszcze?","Пожалуйста. Что-нибудь ещё?"],["Ty","Tak, ser i dziesięć jajek.","Да, сыр и десять яиц."],["Sprzedawczyni","Torbę?","Пакет?"],["Ty","Nie, dziękuję.","Нет, спасибо."]],"r":{"pl":"Rano idę do sklepu. Kupuję chleb, masło i ser. Mąż pije kawę, a ja piję herbatę z mlekiem. W sklepie mówię: «Poproszę» i «Dziękuję». Sprzedawczyni się uśmiecha.","ru":"Утром я иду в магазин. Покупаю хлеб, масло и сыр. Муж пьёт кофе, а я — чай с молоком. В магазине я говорю «Poproszę» и «Dziękuję». Продавщица улыбается."},"ff":["owoce","овощи","фрукты; овощи = warzywa"],"lf":"Пакеты (torby) в магазинах платные, носите свою сумку. «Żabka» — маленький магазин у дома, открыт допоздна.","ts":"Сыграйте вслух покупку: поздоровайтесь, попросите 3 продукта, откажитесь от пакета, попрощайтесь.","tw":"Составьте список покупок на польском из 6 продуктов."},{"d":9,"s":1,"wk":2,"t":"Сколько стоит? Числа до 100","tp":"Ile to kosztuje?","w":[["ile kosztuje?","сколько стоит?"],["złoty","злотый"],["grosz","грош (копейка)"],["drogi","дорогой"],["tani","дешёвый"],["reszta","сдача"],["paragon","чек"],["karta","карта (банковская)"]],"p":[["Ile to kosztuje?","Сколько это стоит?"],["Płacę kartą.","Плачу картой."],["Czy mogę prosić paragon?","Можно чек?"]],"g":{"t":"Злотые и числа 11–100","x":"Złoty меняется как русский «рубль»: 1 złoty, 2–4 złote, 5 и больше złotych (22 złote, 25 złotych). 11–19: jedenaście, dwanaście, trzynaście… dziewiętnaście. Десятки: dwadzieścia, trzydzieści, czterdzieści, pięćdziesiąt, sześćdziesiąt, siedemdziesiąt, osiemdziesiąt, dziewięćdziesiąt, sto.","e":[["To kosztuje dwadzieścia dwa złote.","Это стоит 22 злотых."],["Pięćdziesiąt groszy.","Пятьдесят грошей."],["Sto złotych.","Сто злотых."]]},"dl":[["Ty","Przepraszam, ile kosztuje ten ser?","Извините, сколько стоит этот сыр?"],["Sprzedawca","Dwanaście złotych.","Двенадцать злотых."],["Ty","A to masło?","А это масло?"],["Sprzedawca","Osiem pięćdziesiąt.","Восемь пятьдесят."],["Ty","Dobrze, płacę ka wadrans","четверть часа"],["o której?","во сколько?"],["teraz","сейчас"],["później","позже"],["wcześnie","рано"],["późno","поздно"]],"p":[["Która jest godzina?","Который час?"],["Jest wpół do trzeciej.","Сейчас половина третьего."],["Spotkajmy się o piątej.","Встретимся в пять."]],"g":{"t":"Время","x":"Часы называют порядковыми числительными женского рода: pierwsza, druga, trzecia, czwarta, piąta… «Jest druga» — сейчас два. «O której?» — «O drugiej» (в два). «Wpół do trzeciej» — половина третьего, как в русском. Официально часто 24-часовой формат: piętnasta (15:00).","e":[["Jest piąta dziesięć.","Сейчас 5:10."],["Pracuję od ósmej do szesnastej.","Я работаю с 8 до 16."]]},"dl":[["Ty","Przepraszam, która jest godzina?","Извините, который час?"],["Pan","Jest za kwadrans dziewiąta.","Без четверти девять."],["Ty","O której jest autobus?","Во сколько автобус?"],["Pan","O dziewiątej. Zaraz przyjedzie.","В девять. Сейчас подъедет."]],"r":{"pl":"Wstaję o siódmej. O ósmej jestem w pracy. Mam przerwę o dwunastej. Wracam do domu o szesnastej trzydzieści. Wieczorem, o dwudziestej, uczę się polskiego. Kładę się spać o dwudziestej trzeciej.","ru":"Я встаю в 7. В 8 я на работе. Перерыв в 12. Домой возвращаюсь в 16:30. Вечером, в 20, учу польский. Спать ложусь в 23."},"ff":["zaraz","сразу","сейчас, через минутку («Zaraz wracam» — сейчас вернусь); сразу = od razu"],"lf":"Поляки ценят пунктуальность: к врачу и в urząd приходите за 5–10 минут.","ts":"Расскажите вслух свой распорядок дня с точным временем (5 предложений).","tw":"Напишите словами: 7:00, 12:30, 15:15, 20:45."},{"d":18,"s":1,"wk":3,"t":"Дни недели и планы","tp":"Dni tygodnia","c":8,"w":[["poniedziałek","понедельник"],["wtorek","вторник"],["środa","среда"],["czwartek","четверг"],["piątek","пятница"],["sobota","суббота"],["niedziela","воскресенье"],["tydzień","неделя"]],"p":[["Jaki dziś jest dzień?","Какой сегодня день?"],["W sobotę mam wolne.","В субботу у меня выходной."],["Do zobaczenia w poniedziałek!","До встречи в понедельник!"]],"g":{"t":"Когда? — w + день","x":"w + винительный: w poniedziałek, we wtorek, w środę, w czwartek, w piątek, w sobotę, w niedzielę. Перед «wtorek» пишут «we» — так легче произнести. «W weekend» — в выходные.","e":[["We wtorek idę do lekarza.","Во вторник я иду к врачу."],["W niedzielę sklepy są zamknięte.","В воскресенье магазины закрыты."]]},"dl":[["Koleżanka","Masz czas w piątek?","У тебя есть время в пятницу?"],["Ty","W piątek pracuję. Może w sobotę?","В пятницу я работаю. Может, в субботу?"],["Koleżanka","W sobotę rano?","В субботу утром?"],["Ty","Tak, o dziesiątej. Do zobaczenia!","Да, в десять. До встречи!"]],"r":{"pl":"W poniedziałek i we wtorek pracuję długo. W środę mam kurs polskiego. W czwartek robię zakupy, a w piątek sprzątam. W sobotę odpoczywamy. W niedzielę idziemy na spacer, bo sklepy są zamknięte.","ru":"В понедельник и вторник я долго работаю. В среду у меня курс польского. В четверг делаю покупки, а в пятницу убираю. В субботу отдыхаем. В воскресенье идём гулять, потому что магазины закрыты."},"ff":["niedziela","неделя","воскресенье; неделя = tydzień"],"lf":"В большинство воскресений крупные магазины закрыты (niedziela niehandlowa). Закупайтесь в субботу.","ts":"Расскажите вслух план на неделю: одно дело на каждый день.","tw":"Напишите дни недели и одно дело на каждый день с «w/we»."},{"d":19,"s":1,"wk":3,"t":"Погода и одежда","tp":"Pogoda","w":[["pogoda","погода"],["zimno","холодно"],["ciepło","тепло"],["deszcz","дождь"],["śnieg","снег"],["słońce","солнце"],["kurtka","куртка"],["buty","обувь"]],"p":[["Jaka jest dziś pogoda?","Какая сегодня погода?"],["Pada deszcz.","Идёт дождь."],["Weź parasol!","Возьми зонт!"]],"g":{"t":"Безличные фразы о погоде","x":"Jest zimno (холодно), jest ciepło (тепло), jest gorąco (жарко), wieje wiatr (дует ветер), pada deszcz / pada śnieg (идёт дождь/снег — буквально «падает»). Будущее: «będzie zimno» — будет холодно.","e":[["Dziś jest zimno i pada śnieg.","Сегодня холодно и идёт снег."],["Jutro będzie ciepło.","Завтра будет тепло."]]},"dk":{"t":"Правило моста №10: е/ё перед твёрдым → o","e":[["весна","wiosna"],["сестра","siostra"],["мёд","miód"],["лёд","lód"],["берёза","brzoza"]]},"dl":[["Mąż","Jaka jest pogoda?","Какая погода?"],["Ty","Jest zimno i pada deszcz.","Холодно, идёт дождь."],["Mąż","To weź kurtkę i parasol.","Тогда возьми куртку и зонт."],["Ty","A ty weź ciepłe buty!","А ты надень тёплую обувь!"]],"r":{"pl":"W Polsce zima jest zimna, ale nie bardzo. Często pada deszcz, czasem śnieg. Latem jest ciepło, a nawet gorąco. Wiosna jest piękna. Zawsze mam w torbie parasol, bo pogoda szybko się zmienia.","ru":"Зима в Польше холодная, но не очень. Часто идёт дождь, иногда снег. Летом тепло, даже жарко. Весна красивая. В сумке у меня всегда зонт: погода быстро меняется."},"ff":["wygodny","выгодный","удобный («wygodne buty» — удобная обувь); выгодный = korzystny"],"lf":"Поставьте прогноз погоды (prognoza pogody) на польском в телефоне — это бесплатная ежедневная практика.","ts":"Опишите вслух погоду за окном и что вы наденете.","tw":"Напишите прогноз погоды на 3 дня."},{"d":20,"s":1,"wk":3,"t":"Почта и посылки","tp":"Poczta i paczkomat","w":[["poczta","почта"],["paczka","посылка"],["paczkomat","почтомат"],["adres","адрес"],["kod pocztowy","почтовый индекс"],["nadać","отправить"],["odebrać","забрать, получить"],["awizo","извещение"]],"p":[["Chcę nadać paczkę.","Я хочу отправить посылку."],["Przyszło awizo.","Пришло извещение."],["Gdzie mogę odebrać paczkę?","Где я могу забрать посылку?"]],"g":{"t":"Пары глаголов","x":"Как в русском, глаголы идут парами: процесс и результат. nadawać/nadać (отправлять/отправить), odbierać/odebrać (забирать/забрать), kupować/kupić. В винительном мужской неодушевлённый не меняется (nadać list), женский: -ę (nadać paczkę).","e":[["Odbieram paczkę z paczkomatu.","Я забираю посылку из почтомата."],["Muszę nadać list polecony.","Мне нужно отправить заказное письмо."]]},"dl":[["Ty","Dzień dobry, chcę odebrać paczkę.","Здравствуйте, я хочу забрать посылку."],["Pani","Poproszę awizo i dowód osobisty.","Извещение и удостоверение личности, пожалуйста."],["Ty","Mam paszport, może być?","У меня паспорт, подойдёт?"],["Pani","Tak, może być. Proszę podpisać tutaj.","Да, подойдёт. Подпишите здесь."]],"r":{"pl":"W Polsce paczki często są w paczkomatach. Dostaję SMS z kodem i odbieram paczkę o każdej porze. Na poczcie nadaję listy i odbieram ważne pisma z urzędu. Zawsze mam przy sobie dokument.","ru":"В Польше посылки часто приходят в почтоматы. Я получаю SMS с кодом и забираю посылку в любое время. На почте отправляю письма и забираю важные письма из ведомств. Документ всегда ношу с собой."},"ff":["list","лист","письмо; лист = liść (дерева) или kartka (бумаги)"],"lf":"Почтоматы InPost стоят почти на каждом углу: посылку забирают по коду из SMS или приложения круглосуточно.","ts":"Сыграйте вслух сцену на почте: вы забираете посылку по извещению.","tw":"Напишите свой польский адрес: ulica, numer, kod pocztowy, miasto."},{"d":21,"s":1,"wk":3,"type":"rev","t":"Повторение: неделя 3","tp":"Powtórka","rng":[15,20],"x":"Повторяем город: направления, транспорт, время, дни недели, погоду и почту. Новых слов нет. Пройдите тест и 5 минут слушайте диалоги с повтором вслух (шэдоуинг).","ts":"Расскажите вслух, как вы завтра поедете в центр: во сколько, на чём, где пересадка.","tw":"Напишите подруге SMS: пригласите её на встречу, укажите день, время и место."},{"d":22,"s":1,"wk":4,"t":"Квартира","tp":"Mieszkanie","w":[["mieszkanie","квартира"],["pokój","комната"],["kuchnia","кухня"],["łazienka","ванная"],["sypialnia","спальня"],["balkon","балкон"],["okno","окно"],["drzwi","дверь"]],"p":[["Mieszkam w mieszkaniu dwupokojowym.","Я живу в двухкомнатной квартире."],["Ile pokoi ma mieszkanie?","Сколько комнат в квартире?"],["Nie ma ciepłej wody.","Нет горячей воды."]],"g":{"t":"Jest / nie ma","x":"«Jest» + именительный, «nie ma» + родительный, как русское «нет чего»: Jest balkon → Nie ma balkonu. Jest winda → Nie ma windy. Где? — w + предложный: w kuchni, w łazience, w pokoju.","e":[["W kuchni jest lodówka.","На кухне есть холодильник."],["W łazience nie ma okna.","В ванной нет окна."]]},"dl":[["Agent","To jest salon, a tu jest sypialnia.","Это гостиная, а здесь спальня."],["Ty","Czy jest balkon?","Балкон есть?"],["Agent","Tak, duży balkon. Ale nie ma windy.","Да, большой балкон. Но нет лифта."],["Ty","Na którym piętrze?","На каком этаже?"],["Agent","Na trzecim.","На третьем."]],"r":{"pl":"Nasze mieszkanie ma dwa pokoje, kuchnię i łazienkę. W salonie jest duże okno i balkon. Kuchnia jest mała, ale wygodna. W bloku nie ma windy, a mieszkamy na trzecim piętrze. To dobry trening!","ru":"В нашей квартире две комнаты, кухня и ванная. В гостиной большое окно и балкон. Кухня маленькая, но удобная. В доме нет лифта, а мы живём на третьем этаже. Хорошая тренировка!"},"ff":["dywan","диван","ковёр; диван = kanapa или sofa"],"lf":"Этажи считают по-европейски: parter — наш первый, pierwsze piętro — наш второй.","ts":"Опишите вслух своё жильё: комнаты, что есть и чего нет.","tw":"Напишите 4 предложения с «jest» и «nie ma» о своей квартире."},{"d":23,"s":1,"wk":4,"t":"Аренда жилья","tp":"Wynajem","w":[["wynająć","снять (в аренду)"],["właściciel","владелец, хозяин"],["umowa najmu","договор аренды"],["czynsz","квартплата"],["kaucja","залог"],["opłata","плата"],["miesięcznie","в месяц"],["od zaraz","с сегодняшнего дня, сразу"]],"p":[["Szukam mieszkania do wynajęcia.","Я ищу квартиру в аренду."],["Ile wynosi czynsz?","Сколько составляет квартплата?"],["Czy media są wliczone?","Коммунальные услуги включены?"]],"g":{"t":"Глаголы на -ić/-yć","x":"robić → robię, robisz, robi, robimy, robicie, robią. Так же mówić (mówię), płacić (płacę), prosić (proszę) — с чередованием согласной в форме «я», как в русском «прошу».","e":[["Płacę czynsz co miesiąc.","Я плачу за квартиру каждый месяц."],["Właściciel prosi o kaucję.","Хозяин просит залог."]]},"dl":[["Ty","Dzień dobry, dzwonię w sprawie mieszkania.","Здравствуйте, я звоню насчёт квартиры."],["Właściciel","Tak, jest wolne od zaraz.","Да, свободна уже сейчас."],["Ty","Ile wynosi czynsz?","Сколько квартплата?"],["Właściciel","Dwa tysiące złotych plus media. Kaucja to jeden czynsz.","Две тысячи злотых плюс коммуналка. Залог — одна месячная плата."],["Ty","Czy mogę je zobaczyć jutro?","Можно посмотреть её завтра?"]],"r":{"pl":"Szukamy mieszkania do wynajęcia. Czytamy ogłoszenia w internecie i dzwonimy do właścicieli. Pytamy o czynsz, media i kaucję. Zawsze podpisujemy umowę najmu i robimy zdjęcia mieszkania przed wprowadzeniem się.","ru":"Мы ищем квартиру в аренду. Читаем объявления в интернете и звоним владельцам. Спрашиваем про квартплату, коммуналку и залог. Всегда подписываем договор аренды и фотографируем квартиру перед заездом."},"ff":["media","СМИ","коммунальные услуги (свет, газ, вода, отопление)"],"lf":"Перед заездом сфотографируйте квартиру и счётчики: это защита залога при выезде.","ts":"Позвоните «хозяину» вслух: спросите про цену, коммуналку и залог.","tw":"Проспрягайте «płacić» и «robić»."},{"d":24,"s":1,"wk":4,"t":"Поломки и мастер","tp":"Coś nie działa","w":[["zepsuty","сломанный"],["kran","кран"],["prąd","электричество"],["ogrzewanie","отопление"],["pralka","стиральная машина"],["naprawić","починить"],["hydraulik","сантехник"],["elektryk","электрик"]],"p":[["Pralka nie działa.","Стиральная машина не работает."],["Kran cieknie.","Кран течёт."],["Kiedy może pan przyjść?","Когда вы можете прийти?"]],"g":{"t":"Trzeba и nie działa","x":"«Trzeba» — нужно (безлично): Trzeba naprawić kran. «Nie działa» — не работает (о технике). Zepsuty, zepsuta, zepsute — сломанный, сломанная, сломанное.","e":[["Trzeba wezwać hydraulika.","Нужно вызвать сантехника."],["Lodówka jest zepsuta.","Холодильник сломан."]]},"dl":[["Ty","Dzień dobry, mam problem. Nie ma prądu w kuchni.","Здравствуйте, у меня проблема. На кухне нет света."],["Właściciel","Od kiedy?","С какого времени?"],["Ty","Od rana. I pralka też nie działa.","С утра. И стиральная машина тоже не работает."],["Właściciel","Dobrze, wyślę elektryka po południu.","Хорошо, пришлю электрика после обеда."]],"r":{"pl":"Dziś w mieszkaniu nie działa ogrzewanie. Jest zimno. Dzwonię do właściciela. On mówi: «Trzeba wezwać fachowca». Hydraulik przychodzi po południu i naprawia wszystko w godzinę.","ru":"Сегодня в квартире не работает отопление. Холодно. Я звоню хозяину. Он говорит: «Нужно вызвать мастера». Сантехник приходит после обеда и всё чинит за час."},"ff":["lodówka","лодка","холодильник (от lód — лёд); лодка = łódź"],"lf":"Кто платит за ремонт, обычно записано в umowa najmu: мелочи — жилец, крупные поломки — владелец.","ts":"Опишите вслух 2 поломки и попросите мастера прийти.","tw":"Напишите SMS хозяину: что сломалось и с какого времени."},{"d":25,"s":1,"wk":4,"t":"Ведомство: PESEL и прописка","tp":"W urzędzie","w":[["urząd","ведомство, учреждение"],["formularz","бланк, анкета"],["zameldowanie","прописка (регистрация)"],["dowód osobisty","удостоверение личности"],["paszport","паспорт"],["podpis","подпись"],["okienko","окошко"],["numerek","талончик (очереди)"]],"p":[["Chcę złożyć wniosek o PESEL.","Я хочу подать заявление на PESEL."],["Jakie dokumenty są potrzebne?","Какие документы нужны?"],["Gdzie mam podpisać?","Где мне подписать?"]],"g":{"t":"Musieć — должен","x":"muszę, musisz, musi, musimy, musicie, muszą + инфинитив. «Muszę iść do urzędu». Важно: «nie muszę» значит «мне не нужно», а не «мне нельзя». «Нельзя» — «nie wolno».","e":[["Muszę wypełnić formularz.","Мне нужно заполнить бланк."],["Nie musisz czekać.","Тебе не нужно ждать."]]},"dl":[["Urzędnik","Numerek trzydzieści dwa, okienko numer pięć!","Талон 32, окно номер 5!"],["Ty","Dzień dobry, chcę się zameldować.","Здравствуйте, я хочу прописаться."],["Urzędnik","Proszę paszport i umowę najmu.","Паспорт и договор аренды, пожалуйста."],["Ty","Proszę. Gdzie mam podpisać?","Вот. Где мне подписать?"],["Urzędnik","Tutaj, na dole.","Здесь, внизу."]],"r":{"pl":"W urzędzie biorę numerek i czekam. Na ekranie widzę numer okienka. Urzędniczka sprawdza paszport i umowę najmu. Wypełniam formularz i podpisuję. Muszę mieć cierpliwość, ale wszystko jest jasne.","ru":"В учреждении я беру талончик и жду. На экране вижу номер окна. Сотрудница проверяет паспорт и договор аренды. Я заполняю бланк и подписываю. Нужно терпение, но всё понятно."},"ff":["wniosek","вывод","заявление («złożyć wniosek» — подать заявление); вывод = wniosek тоже, но в документах это заявление"],"lf":"PESEL и прописку оформляют в urząd gminy или miasta. Потом многие дела можно решать онлайн в приложении mObywatel.","ts":"Сыграйте вслух визит в urząd: поздоровайтесь, назовите цель, спросите про документы.","tw":"Проспрягайте «musieć» и напишите 3 дела, которые вам нужно сделать на этой неделе."},{"d":26,"s":1,"wk":4,"t":"Банк и телефон","tp":"Bank","w":[["bank","банк"],["konto","счёт в банке"],["przelew","перевод"],["bankomat","банкомат"],["wypłacić","снять (деньги)"],["prowizja","комиссия"],["umowa","договор"],["karta SIM","SIM-карта"]],"p":[["Chciałabym założyć konto.","Я хотела бы открыть счёт."],["Jaka jest opłata za kartę?","Какая плата за карту?"],["Potrzebuję polskiego numeru telefonu.","Мне нужен польский номер телефона."]],"g":{"t":"Chciałbym / chciałabym","x":"Вежливое «хотел(а) бы»: chciałbym (говорит мужчина), chciałabym (говорит женщина) + инфинитив. Звучит мягче, чем «chcę». Пока учим как готовую фразу, грамматику разберём позже.","e":[["Chciałbym zapłacić kartą.","Я хотел бы заплатить картой."],["Chciałabym zapytać o kredyt.","Я хотела бы спросить о кредите."]]},"dl":[["Pracownik banku","W czym mogę pomóc?","Чем могу помочь?"],["Ty","Chciałabym założyć konto.","Я хотела бы открыть счёт."],["Pracownik banku","Poproszę paszport i numer PESEL.","Паспорт и номер PESEL, пожалуйста."],["Ty","Czy konto jest darmowe?","Счёт бесплатный?"],["Pracownik banku","Tak, jeśli płaci pani kartą raz w miesiącu.","Да, если вы расплачиваетесь картой раз в месяц."]],"r":{"pl":"Mam konto w polskim banku. Pensję dostaję przelewem. Płacę kartą lub telefonem, a w bankomacie wypłacam gotówkę rzadko. Rachunki za prąd i internet płacę w aplikacji. To szybkie i wygodne.","ru":"У меня счёт в польском банке. Зарплату получаю переводом. Плачу картой или телефоном, наличные в банкомате снимаю редко. Счета за свет и интернет оплачиваю в приложении. Быстро и удобно."},"ff":["pensja","пенсия","зарплата; пенсия = emerytura"],"lf":"Для счёта в банке иностранцу обычно нужны паспорт и PESEL. SIM-карту на предоплате регистрируют по документу.","ts":"Попросите вслух в банке открыть счёт и спросите про плату за карту.","tw":"Напишите 3 вежливые просьбы с chciałbym/chciałabym."},{"d":27,"s":1,"wk":4,"t":"Анкета и даты","tp":"Formularz","w":[["data urodzenia","дата рождения"],["miejsce urodzenia","место рождения"],["obywatelstwo","гражданство"],["stan cywilny","семейное положение"],["mężatka","замужняя"],["żonaty","женатый"],["adres zamieszkania","адрес проживания"],["płeć","пол"]],"p":[["Proszę wypełnić ten formularz.","Заполните, пожалуйста, эту форму."],["Urodziłam się piątego maja.","Я родилась пятого мая."],["Jestem mężatką.","Я замужем."]],"g":{"t":"Даты","x":"Число — порядковое, месяц — в родительном: piąty maja (5 мая), «urodziłam się piątego maja» (родилась пятого мая). Месяцы в родительном: stycznia, lutego, marca, kwietnia, maja, czerwca, lipca, sierpnia, września, października, listopada, grudnia.","e":[["Dziś jest pierwszy marca.","Сегодня первое марта."],["Urodziłem się dziesiątego lipca.","Я родился десятого июля."]]},"dl":[["Urzędniczka","Data urodzenia?","Дата рождения?"],["Ty","Piętnasty października.","Пятнадцатое октября."],["Urzędniczka","Obywatelstwo?","Гражданство?"],["Ty","Białoruskie.","Белорусское."],["Urzędniczka","Stan cywilny?","Семейное положение?"],["Ty","Mężatka.","Замужем."]],"r":{"pl":"W formularzu piszę imię, nazwisko, datę i miejsce urodzenia. Obywatelstwo: białoruskie. Stan cywilny: zamężna. Adres zamieszkania: Wrocław, ulica Kwiatowa 5. Na końcu data i podpis. Gotowe!","ru":"В анкете я пишу имя, фамилию, дату и место рождения. Гражданство: белорусское. Семейное положение: замужем. Адрес: Вроцлав, улица Квятова, 5. В конце дата и подпись. Готово!"},"ff":["wiek","век","возраст («w jakim wieku?» — в каком возрасте?), а также век"],"lf":"В анкетах «stan cywilny»: kawaler/panna — холост/не замужем, żonaty/zamężna — женат/замужем, rozwiedziony/rozwiedziona — разведён(а).","ts":"Ответьте вслух на вопросы анкеты: имя, дата рождения, гражданство, семейное положение.","tw":"Заполните мини-анкету о себе на польском (5 строк)."},{"d":28,"s":1,"wk":4,"type":"rev","t":"Повторение: неделя 4","tp":"Powtórka","rng":[22,27],"x":"Повторяем жильё, аренду, поломки, urząd, банк и анкеты. Это самые нужные темы для жизни в Польше. Пройдите тест и перечитайте диалоги вслух.","ts":"Сыграйте вслух: вы звоните хозяину, сообщаете о поломке и договариваетесь о времени визита мастера.","tw":"Заполните по-польски анкету: имя, фамилия, дата рождения, гражданство, адрес, семейное положение."},{"d":29,"s":1,"wk":4,"type":"exam","t":"Экзамен этапа 1","tp":"Egzamin 1","rng":[1,28],"x":"Контрольная работа по первому месяцу: 30 вопросов по словам и фразам дней 1–28. Проходной балл — 70%. Ниже 70% — не страшно: повторите отмеченные слова и сдайте завтра ещё раз.","ts":"Устная часть, 2 минуты без подготовки: представьтесь, расскажите о жилье, распорядке дня и планах на выходные.","tw":"Письменная часть: SMS хозяину о поломке (3–4 предложения) и список покупок с ценами словами."},{"d":30,"s":1,"wk":4,"t":"Проект: мой первый день в Польше","tp":"Mój pierwszy dzień","w":[["podoba mi się","мне нравится"],["trudny","трудный"],["łatwy","лёгкий"],["powoli","медленно"],["szybko","быстро"],["uczę się","я учусь, учу"],["miesiąc","месяц"],["przyjechać","приехать"]],"p":[["Podoba mi się Polska.","Мне нравится Польша."],["Uczę się polskiego od miesiąca.","Я учу польский уже месяц."],["Na początku było trudno.","Сначала было трудно."]],"g":{"t":"Podoba mi się и lubię","x":"«Podoba mi się» — мне нравится что-то конкретное: Podoba mi się to miasto. Множественное: Podobają mi się polskie góry. «Lubię» — люблю вообще: Lubię kawę.","e":[["Lubię polską kuchnię.","Мне нравится польская кухня."],["Podobają mi się te buty.","Мне нравятся эти туфли."]]},"dk":{"t":"Мост: все 10 правил одним взглядом","e":[["читать","czytać"],["рука","ręka"],["река","rzeka"],["голова","głowa"],["радость","radość"],["мой","mój"],["яблоко","jabłko"],["дети","dzieci"],["человек","człowiek"],["весна","wiosna"]]},"dl":[["Koleżanka","Jak się czujesz w Polsce?","Как ты себя чувствуешь в Польше?"],["Ty","Dobrze! Na początku było trudno.","Хорошо! Сначала было трудно."],["Koleżanka","A teraz?","А сейчас?"],["Ty","Teraz jest łatwiej. Mówię powoli, ale rozumiem dużo!","Сейчас легче. Говорю медленно, но понимаю много!"]],"r":{"pl":"Przyjechałam do Polski miesiąc temu. Pierwszy dzień był trudny: nie rozumiałam ludzi i nie wiedziałam, jak kupić bilet. Teraz jest lepiej. Robię zakupy, pytam o drogę i rozmawiam z sąsiadką. Mówię powoli, ale codziennie uczę się czegoś nowego. Podoba mi się Polska!","ru":"Я приехала в Польшу месяц назад. Первый день был трудным: я не понимала людей и не знала, как купить билет. Сейчас лучше. Я делаю покупки, спрашиваю дорогу и разговариваю с соседкой. Говорю медленно, но каждый день узнаю что-то новое. Мне нравится Польша!"},"ff":["dziwny","дивный","странный; дивный = cudowny"],"lf":"Сохраните запись сегодняшнего рассказа. Через 30 и 60 дней запишите тот же рассказ и сравните: прогресс слышно сразу.","ts":"Расскажите вслух «Мой первый день в Польше» (1 минута) и запишите на диктофон.","tw":"Напишите текст «Mój pierwszy dzień w Polsce» (6–8 предложений) по образцу."},{"d":31,"s":2,"wk":5,"t":"Поликлиника и запись к врачу","tp":"W przychodni","w":[["przychodnia","поликлиника"],["lekarz rodzinny","семейный врач"],["rejestracja","регистратура"],["wizyta","приём (у врача)"],["zapisać się","записаться"],["NFZ","госстрахование (фонд здоровья)"],["ubezpieczenie","страховка"],["pilne","срочно"]],"p":[["Chciałabym zapisać się do lekarza.","Я хотела бы записаться к врачу."],["Czy jest wolny termin na jutro?","Есть свободное время на завтра?"],["Jestem ubezpieczona w NFZ.","Я застрахована в NFZ."]],"g":{"t":"Прошедшее время «быть»","x":"byłem/byłam (я был/была), byłeś/byłaś, był/była/było, byliśmy/byłyśmy, byliście/byłyście, byli/były. Окончание уже показывает лицо, поэтому «ja» не нужно: «Byłam u lekarza» — я была у врача.","e":[["Wczoraj byłam w przychodni.","Вчера я была в поликлинике."],["Gdzie byłeś?","Где ты был?"]]},"dl":[["Rejestratorka","Przychodnia, słucham.","Поликлиника, слушаю."],["Ty","Dzień dobry, chciałabym zapisać się do lekarza rodzinnego.","Здравствуйте, я хотела бы записаться к семейному врачу."],["Rejestratorka","Najbliższy termin jest w czwartek o dziesiątej.","Ближайшее время — четверг, 10:00."],["Ty","Pasuje. Nazywam się Olga Iwanowa.","Подходит. Меня зовут Ольга Иванова."],["Rejestratorka","Proszę podać PESEL.","Назовите PESEL, пожалуйста."]],"r":{"pl":"W Polsce do lekarza rodzinnego zapisuję się przez telefon albo przez internet. Wizyta na NFZ jest bezpłatna, ale czasem trzeba czekać. Prywatnie jest szybciej, ale drożej. Wczoraj byłam w przychodni z przeziębieniem.","ru":"В Польше к семейному врачу я записываюсь по телефону или через интернет. Приём по NFZ бесплатный, но иногда нужно ждать. Частно быстрее, но дороже. Вчера я была в поликлинике с простудой."},"ff":["termin","термин","срок; время записи («termin wizyty» — время приёма)"],"lf":"Сначала выберите поликлинику и семейного врача (подаётся deklaracja wyboru lekarza POZ). Направления к специалистам выдаёт он.","ts":"Позвоните вслух в регистратуру и запишитесь к врачу.","tw":"Напишите «być» в прошедшем времени для всех лиц (м. и ж. род)."},{"d":32,"s":2,"wk":5,"t":"У врача: что болит","tp":"U lekarza","w":[["głowa","голова"],["gardło","горло"],["brzuch","живот"],["plecy","спина"],["noga","нога"],["serce","сердце"],["kaszel","кашель"],["oddychać","дышать"]],"p":[["Co panią boli?","Что у вас болит?"],["Od trzech dni mam kaszel.","Уже три дня у меня кашель."],["Proszę głęboko oddychać.","Дышите глубоко."]],"g":{"t":"Od kiedy? — od + родительный","x":"«С какого времени» — od + родительный: od wczoraj, od rana, od trzech dni, od tygodnia. Боль: «Boli mnie…», если много — «Bolą mnie…». Симптомы — «Mam…»: mam kaszel, mam katar.","e":[["Boli mnie gardło od wczoraj.","Горло болит со вчерашнего дня."],["Bolą mnie nogi.","У меня болят ноги."]]},"dl":[["Lekarz","Co panią boli?","Что у вас болит?"],["Ty","Boli mnie gardło i mam kaszel.","Болит горло и кашель."],["Lekarz","Od kiedy?","С какого времени?"],["Ty","Od trzech dni.","Три дня."],["Lekarz","Proszę otworzyć usta i powiedzieć «a».","Откройте рот и скажите «а»."]],"r":{"pl":"U lekarza mówię, co mnie boli. Lekarz słucha serca i płuc, pyta o temperaturę. Mówię: «Mam katar, kaszel i boli mnie głowa». Lekarz wypisuje receptę i mówi, żebym dużo piła i odpoczywała.","ru":"У врача я говорю, что у меня болит. Врач слушает сердце и лёгкие, спрашивает о температуре. Я говорю: «У меня насморк, кашель и болит голова». Врач выписывает рецепт и говорит много пить и отдыхать."},"ff":["katar","катар","насморк"],"lf":"Рецепты сейчас электронные (e-recepta): в аптеке называют PESEL и 4-значный код из SMS.","ts":"Опишите вслух врачу 3 симптома и с какого времени они у вас.","tw":"Напишите 5 частей тела и фразу «boli mnie…» с каждой."},{"d":33,"s":2,"wk":5,"t":"Прошедшее время","tp":"Co robiłaś wczoraj?","w":[["wczoraj","вчера"],["przedwczoraj","позавчера"],["temu","назад (tydzień temu)"],["w zeszłym tygodniu","на прошлой неделе"],["zrobić","сделать"],["spać","спать"],["wrócić","вернуться"],["poszłam / poszedłem","я пошла / я пошёл"]],"p":[["Co robiłaś wczoraj?","Что ты делала вчера?"],["Byłam w pracy.","Я была на работе."],["Wróciłam późno.","Я вернулась поздно."]],"g":{"t":"Прошедшее время: -łem, -łam","x":"Основа + ł + окончание лица. Он robił, она robiła. Я: robiłem (м.) / robiłam (ж.). Ты: robiłeś / robiłaś. Мы: robiliśmy / robiłyśmy. Вы: robiliście / robiłyście. Они: robili / robiły. Почти как русское «делал», только лицо видно по окончанию.","e":[["Wczoraj gotowałam obiad.","Вчера я готовила обед."],["Tydzień temu byliśmy w Krakowie.","Неделю назад мы были в Кракове."]]},"dl":[["Koleżanka","Co robiłaś w weekend?","Что ты делала в выходные?"],["Ty","W sobotę sprzątałam, a w niedzielę byliśmy w parku.","В субботу убирала, а в воскресенье мы были в парке."],["Koleżanka","A wczoraj?","А вчера?"],["Ty","Wczoraj pracowałam i wróciłam późno.","Вчера работала и вернулась поздно."]],"r":{"pl":"Wczoraj miałam długi dzień. Rano poszłam do pracy, w południe zjadłam obiad z koleżanką. Po pracy zrobiłam zakupy i wróciłam do domu o dziewiętnastej. Wieczorem uczyłam się polskiego i wcześnie poszłam spać.","ru":"Вчера у меня был длинный день. Утром пошла на работу, в полдень пообедала с подругой. После работы сделала покупки и вернулась домой в 19:00. Вечером учила польский и рано легла спать."},"ff":["gorączka","горячка","температура, жар («mam gorączkę» — у меня температура)"],"lf":"Глагол «iść» в прошедшем неправильный: szedłem/szłam (шёл/шла), poszedłem/poszłam (пошёл/пошла).","ts":"Расскажите вслух, что вы делали вчера (6 предложений в прошедшем времени).","tw":"Поставьте в прошедшее время о себе: robić, pracować, czytać, iść, mieć."},{"d":34,"s":2,"wk":5,"t":"Скорая, больница, больничный","tp":"Pogotowie i szpital","w":[["karetka","машина скорой"],["szpital","больница"],["SOR","приёмный покой (экстренный)"],["pielęgniarka","медсестра"],["skierowanie","направление"],["badanie","обследование, анализ"],["wynik","результат"],["zwolnienie lekarskie","больничный лист"]],"p":[["Proszę wezwać karetkę!","Вызовите скорую!"],["Potrzebuję zwolnienia lekarskiego.","Мне нужен больничный."],["Kiedy będą wyniki?","Когда будут результаты?"]],"g":{"t":"Proszę + инфинитив","x":"Так вежливо просят и дают указания врачи и чиновники: Proszę usiąść (садитесь), Proszę poczekać (подождите), Proszę się nie ruszać (не двигайтесь). Понимать эти фразы — половина успеха в больнице.","e":[["Proszę usiąść i poczekać.","Садитесь и подождите."],["Proszę zrobić badanie krwi.","Сдайте анализ крови."]]},"dl":[["Dyspozytor","Numer alarmowy 112, co się stało?","Экстренная служба 112, что случилось?"],["Ty","Mąż źle się czuje, boli go serce.","Мужу плохо, у него болит сердце."],["Dyspozytor","Proszę podać adres.","Назовите адрес."],["Ty","Ulica Kwiatowa 5, mieszkanie 12.","Улица Квятова, 5, квартира 12."],["Dyspozytor","Karetka już jedzie. Proszę zostać na linii.","Скорая уже едет. Оставайтесь на линии."]],"r":{"pl":"Kiedy sytuacja jest groźna, dzwonię pod numer 112. Dyspozytor pyta o adres i objawy. Na SOR-ze czasem długo się czeka. Lekarz robi badania i daje skierowanie albo zwolnienie lekarskie.","ru":"Если ситуация опасная, я звоню 112. Диспетчер спрашивает адрес и симптомы. В приёмном покое иногда долго ждут. Врач делает обследования и даёт направление или больничный."},"ff":["pogotowie","«наготове»","скорая помощь («pogotowie ratunkowe»), аварийная служба"],"lf":"SOR — для экстренных случаев. Вечером и в выходные с обычной болезнью идите в «nocna i świąteczna opieka zdrowotna».","ts":"Сыграйте вслух звонок 112: что случилось, адрес, состояние человека.","tw":"Напишите 3 указания врача в форме «Proszę + инфинитив»."},{"d":35,"s":2,"wk":5,"t":"Стоматолог, частно или по NFZ","tp":"U dentysty","w":[["dentysta","стоматолог"],["plomba","пломба"],["znieczulenie","обезболивание"],["ból zęba","зубная боль"],["prywatnie","частно, платно"],["na NFZ","по госстраховке"],["płatny","платный"],["poczekalnia","приёмная, зал ожидания"]],"p":[["Mam silny ból zęba.","У меня сильно болит зуб."],["Ile kosztuje wizyta prywatnie?","Сколько стоит приём частно?"],["Czy to będzie bolało?","Будет больно?"]],"g":{"t":"Количество + родительный","x":"dużo (много), mało (мало), ile (сколько), kilka (несколько), trochę (немного) требуют родительного падежа, как в русском: dużo ludzi, mało czasu, kilka dni, trochę wody.","e":[["W poczekalni jest dużo ludzi.","В приёмной много людей."],["Mam mało czasu.","У меня мало времени."]]},"dl":[["Dentystka","Który ząb boli?","Какой зуб болит?"],["Ty","Ten na dole, z lewej strony.","Нижний, слева."],["Dentystka","Trzeba założyć plombę.","Нужно поставить пломбу."],["Ty","Czy to będzie bolało?","Будет больно?"],["Dentystka","Nie, dam znieczulenie.","Нет, я сделаю обезболивание."]],"r":{"pl":"Na NFZ do dentysty czasem jest długa kolejka. Prywatnie jest szybciej, ale trzeba zapłacić. Wybieram prywatną wizytę, bo ząb bardzo boli. Dentystka daje znieczulenie i zakłada plombę. Po godzinie wszystko jest dobrze.","ru":"По NFZ к стоматологу иногда длинная очередь. Частно быстрее, но нужно платить. Я выбираю частный приём, потому что зуб очень болит. Стоматолог делает обезболивание и ставит пломбу. Через час всё хорошо."},"ff":["kolejka","колея","очередь («stać w kolejce» — стоять в очереди)"],"lf":"Многие работодатели дают частную медицинскую подписку (pakiet medyczny). Спросите о ней на собеседовании.","ts":"Объясните вслух стоматологу, какой зуб болит и как сильно.","tw":"Напишите 4 фразы с dużo / mało / ile / kilka."},{"d":36,"s":2,"wk":5,"t":"Самочувствие и эмоции","tp":"Jak się czujesz?","w":[["czuć się","чувствовать себя"],["zmęczony","усталый"],["chory","больной"],["zdrowy","здоровый"],["smutny","грустный"],["wesoły","весёлый"],["zestresowany","в стрессе"],["odpocząć","отдохнуть"]],"p":[["Jak się czujesz?","Как ты себя чувствуешь?"],["Czuję się lepiej.","Мне лучше."],["Muszę odpocząć.","Мне нужно отдохнуть."]],"g":{"t":"Прилагательные: он, она, они","x":"zmęczony (он), zmęczona (она), zmęczone (оно). Во множественном две формы: zmęczeni — мужчины или смешанная группа, zmęczone — женщины, дети, вещи. Такой «мужско-личной» формы в русском нет.","e":[["Mąż jest zmęczony i ja jestem zmęczona.","Муж устал, и я устала."],["Dzieci są zmęczone.","Дети устали."]]},"dl":[["Koleżanka","Wyglądasz na zmęczoną. Wszystko w porządku?","Ты выглядишь усталой. Всё в порядке?"],["Ty","Jestem trochę zestresowana. Dużo pracy.","Я немного в стрессе. Много работы."],["Koleżanka","Musisz odpocząć!","Тебе нужно отдохнуть!"],["Ty","Masz rację. W weekend śpię do południa.","Ты права. В выходные сплю до обеда."]],"r":{"pl":"Ostatnio czuję się zmęczona. Dużo pracuję i uczę się polskiego. Czasem jestem smutna, bo tęsknię za rodziną. Ale kiedy rozmawiam z mamą przez telefon, jestem wesoła. W weekend odpoczywam i znowu mam energię.","ru":"В последнее время я устаю. Много работаю и учу польский. Иногда мне грустно: скучаю по семье. Но когда разговариваю с мамой по телефону, мне весело. В выходные отдыхаю, и снова есть энергия."},"ff":["cieszyć się","тешиться","радоваться («cieszę się» — я рада)"],"lf":"«Tęsknić za…» — скучать по… («tęsknię za domem»). Очень частое слово у тех, кто переехал.","ts":"Скажите вслух, как вы себя чувствуете сегодня и почему (4 предложения).","tw":"Напишите 3 прилагательных в формах: on / ona / oni / one."},{"d":37,"s":2,"wk":5,"type":"rev","t":"Повторение: неделя 5","tp":"Powtórka","rng":[31,36],"x":"Повторяем здоровье: поликлиника, симптомы, прошедшее время, скорая, стоматолог, самочувствие. Пройдите тест и прочитайте вслух все диалоги недели вместе с озвучкой.","ts":"Расскажите вслух, когда вы последний раз болели: что болело, к кому пошли, что сказал врач (в прошедшем времени).","tw":"Напишите работодателю SMS: вы заболели, идёте к врачу, будете на больничном."},{"d":38,"s":2,"wk":6,"t":"Ищем работу. Будущее время","tp":"Szukam pracy","w":[["oferta pracy","вакансия"],["ogłoszenie","объявление"],["CV","резюме"],["doświadczenie","опыт"],["wykształcenie","образование"],["umiejętności","навыки"],["pracodawca","работодатель"],["aplikować","откликаться (на вакансию)"]],"p":[["Szukam pracy.","Я ищу работу."],["Mam doświadczenie w sprzedaży.","У меня есть опыт в продажах."],["Wyślę CV jutro.","Я отправлю резюме завтра."]],"g":{"t":"Будущее время","x":"Несовершенный вид: będę + инфинитив или będę + форма на -ł: będę pracować = będę pracowała. Формы: będę, będziesz, będzie, będziemy, będziecie, będą. Совершенный вид — простая форма, как в русском: wyślę (отправлю), zrobię (сделаю).","e":[["Będę szukać pracy w Polsce.","Я буду искать работу в Польше."],["Jutro napiszę CV.","Завтра я напишу резюме."]]},"dl":[["Doradca","Jakiej pracy pani szuka?","Какую работу вы ищете?"],["Ty","Szukam pracy w biurze albo w sklepie.","Ищу работу в офисе или в магазине."],["Doradca","Ma pani doświadczenie?","У вас есть опыт?"],["Ty","Tak, pięć lat w sprzedaży.","Да, пять лет в продажах."],["Doradca","Świetnie. Pomogę pani napisać CV po polsku.","Отлично. Я помогу вам написать резюме на польском."]],"r":{"pl":"Szukam pracy w Polsce. Codziennie czytam oferty pracy na portalach. Moje CV jest po polsku. Mam wykształcenie ekonomiczne i doświadczenie w sprzedaży. W przyszłym tygodniu będę miała dwie rozmowy kwalifikacyjne.","ru":"Я ищу работу в Польше. Каждый день читаю вакансии на порталах. Моё резюме на польском. У меня экономическое образование и опыт в продажах. На следующей неделе у меня будет два собеседования."},"ff":["zawód","завод","профессия («Jaki jest pana zawód?»); завод = zakład, fabryka"],"lf":"Польское CV обычно заканчивается согласием на обработку данных (klauzula RODO). Без неё резюме могут не рассмотреть.","ts":"Расскажите вслух, какую работу вы ищете и какой у вас опыт.","tw":"Напишите 3 предложения о своих планах в будущем времени."},{"d":39,"s":2,"wk":6,"t":"Собеседование","tp":"Rozmowa kwalifikacyjna","w":[["rozmowa kwalifikacyjna","собеседование"],["wynagrodzenie","вознаграждение, зарплата"],["stawka","ставка"],["na godzinę","в час"],["grafik","график"],["pełny etat","полная ставка"],["pół etatu","полставки"],["od kiedy","с какого времени"]],"p":[["Dlaczego chce pani u nas pracować?","Почему вы хотите у нас работать?"],["Od kiedy może pani zacząć?","С какого числа вы можете начать?"],["Jakie są godziny pracy?","Какой график работы?"]],"g":{"t":"Вопросительные слова","x":"dlaczego (почему), jak długo (как долго), od kiedy (с какого времени), ile (сколько), który/która (который), jaki/jaka (какой). Порядок слов свободный, как в русском.","e":[["Jak długo pracowała pani w sklepie?","Как долго вы работали в магазине?"],["Ile wynosi stawka na godzinę?","Какая ставка в час?"]]},"dl":[["Kierowniczka","Proszę opowiedzieć o sobie.","Расскажите о себе."],["Ty","Mam na imię Olga, od roku mieszkam w Polsce. Pracowałam pięć lat w sprzedaży.","Меня зовут Ольга, год живу в Польше. Пять лет работала в продажах."],["Kierowniczka","Od kiedy może pani zacząć?","С какого числа можете начать?"],["Ty","Od poniedziałku. Jakie są godziny pracy?","С понедельника. Какой график?"],["Kierowniczka","Pracujemy na dwie zmiany, grafik jest co tydzień.","Работаем в две смены, график каждую неделю."]],"r":{"pl":"Na rozmowie kwalifikacyjnej jestem spokojna. Opowiadam o doświadczeniu i umiejętnościach. Pytam o wynagrodzenie, grafik i umowę. Kierowniczka mówi, że zadzwoni w piątek. Jestem z siebie dumna: cała rozmowa była po polsku!","ru":"На собеседовании я спокойна. Рассказываю об опыте и навыках. Спрашиваю о зарплате, графике и договоре. Руководитель говорит, что позвонит в пятницу. Я горжусь собой: весь разговор был на польском!"},"ff":["zmiana","измена","смена (на работе) и изменение; измена = zdrada"],"lf":"Зарплату обсуждают brutto (до налогов) или netto (на руки). Всегда уточняйте, о какой сумме речь.","ts":"Ответьте вслух на 3 вопроса собеседования: о себе, об опыте, с какого числа начнёте.","tw":"Напишите 4 вопроса работодателю: о ставке, графике, договоре, начале работы."},{"d":40,"s":2,"wk":6,"t":"Трудовой договор","tp":"Umowa","w":[["umowa o pracę","трудовой договор"],["umowa zlecenie","договор поручения"],["okres próbny","испытательный срок"],["na czas określony","на определённый срок"],["na czas nieokreślony","бессрочно"],["urlop","отпуск"],["wypowiedzenie","уведомление о расторжении"],["podpisać","подписать"]],"p":[["Jaki rodzaj umowy pan oferuje?","Какой вид договора вы предлагаете?"],["Ile mam dni urlopu?","Сколько у меня дней отпуска?"],["Muszę to przeczytać przed podpisaniem.","Мне нужно прочитать это перед подписанием."]],"g":{"t":"Модальные: mogę, muszę, powinnam, nie wolno","x":"mogę (могу), muszę (должна, нужно), powinienem/powinnam (следует; он/она), powinniśmy (нам следует), wolno (разрешено), nie wolno (нельзя).","e":[["Powinnam przeczytać umowę.","Мне следует прочитать договор."],["W pracy nie wolno palić.","На работе нельзя курить."]]},"dl":[["Ty","Czy to jest umowa o pracę?","Это трудовой договор?"],["Kadrowa","Na początku umowa na okres próbny, potem na czas określony.","Сначала договор на испытательный срок, потом на определённый срок."],["Ty","A ile dni urlopu?","А сколько дней отпуска?"],["Kadrowa","Dwadzieścia dni w roku.","Двадцать дней в году."],["Ty","Dobrze. Mogę zabrać umowę do domu i przeczytać?","Хорошо. Можно взять договор домой и прочитать?"]],"r":{"pl":"W Polsce najczęściej spotykam umowę o pracę i umowę zlecenie. Umowa o pracę daje płatny urlop i zwolnienie lekarskie. Przed podpisaniem zawsze czytam umowę i pytam o okres wypowiedzenia. Jeśli czegoś nie rozumiem, proszę o wyjaśnienie.","ru":"В Польше чаще всего встречаются трудовой договор и договор поручения. Трудовой договор даёт оплачиваемый отпуск и больничный. Перед подписанием я всегда читаю договор и спрашиваю о сроке уведомления. Если что-то непонятно, прошу объяснить."},"ff":["zwolnienie","освобождение","увольнение («zwolnienie z pracy») или больничный («zwolnienie lekarskie»)"],"lf":"Umowa o pracę защищает лучше, чем umowa zlecenie. По Трудовому кодексу отпуск — 20 или 26 дней в год в зависимости от стажа.","ts":"Задайте вслух работодателю 3 вопроса о договоре.","tw":"Напишите 4 предложения с mogę / muszę / powinnam / nie wolno."},{"d":41,"s":2,"wk":6,"t":"На работе: поручения","tp":"W pracy","w":[["szef","начальник"],["kierownik","руководитель"],["kolega","коллега (м.)"],["koleżanka","коллега (ж.)"],["zadanie","задание"],["przerwa","перерыв"],["nadgodziny","сверхурочные"],["spotkanie","встреча, совещание"]],"p":[["Czy mogę wziąć przerwę?","Можно сделать перерыв?"],["Nie rozumiem zadania. Może pan wytłumaczyć?","Я не понимаю задание. Можете объяснить?"],["Skończyłam!","Я закончила!"]],"g":{"t":"Повелительное наклонение на «ты»","x":"zrób (сделай), przynieś (принеси), zadzwoń (позвони), czekaj (жди), pomóż (помоги). Вежливо на «вы»: «Proszę zrobić…» или «Niech pan zrobi…».","e":[["Zadzwoń do klienta.","Позвони клиенту."],["Proszę przynieść dokumenty.","Принесите, пожалуйста, документы."]]},"dl":[["Kierownik","Olga, zrób proszę raport do piątku.","Ольга, сделай, пожалуйста, отчёт до пятницы."],["Ty","Dobrze. Czy mogę zadać pytanie?","Хорошо. Можно вопрос?"],["Kierownik","Jasne.","Конечно."],["Ty","Raport ma być po polsku czy po angielsku?","Отчёт на польском или на английском?"],["Kierownik","Po polsku. Dasz radę!","На польском. Ты справишься!"]],"r":{"pl":"W pracy mam miłych kolegów. Rano mamy krótkie spotkanie, a szef daje zadania. O dwunastej jest przerwa na kawę. Czasem robię nadgodziny, ale są dodatkowo płatne. Po pracy idziemy czasem razem na pizzę.","ru":"На работе у меня приятные коллеги. Утром короткое совещание, начальник раздаёт задания. В 12 перерыв на кофе. Иногда я работаю сверхурочно, но это оплачивается отдельно. После работы иногда вместе идём на пиццу."},"ff":["kierowca","«руководитель»","водитель; руководитель = kierownik"],"lf":"«Dasz radę!» — «Ты справишься!» Самая частая польская поддержка.","ts":"Дайте вслух 3 поручения коллеге на «ты» и 2 — начальнику на «вы».","tw":"Образуйте повелительное наклонение на «ты»: zrobić, przynieść, zadzwonić, czekać, pomóc."},{"d":42,"s":2,"wk":6,"t":"Зарплата, налоги, большие числа","tp":"Wypłata","w":[["wypłata","зарплата (выплата)"],["brutto","брутто (до налогов)"],["netto","нетто (на руки)"],["podatek","налог"],["składki","взносы"],["premia","премия"],["sto","сто"],["tysiąc","тысяча"]],"p":[["Kiedy jest wypłata?","Когда зарплата?"],["Ile to będzie netto?","Сколько это будет на руки?"],["Wypłata jest dziesiątego.","Зарплата десятого числа."]],"g":{"t":"Сотни и тысячи","x":"sto (100), dwieście (200), trzysta (300), czterysta (400), pięćset (500), sześćset, siedemset, osiemset, dziewięćset. tysiąc (1000), dwa tysiące (2000), pięć tysięcy (5000) — склоняется как русское «тысяча — тысячи — тысяч».","e":[["Cztery tysiące pięćset złotych.","Четыре тысячи пятьсот злотых."],["Dwieście pięćdziesiąt złotych premii.","Двести пятьдесят злотых премии."]]},"dl":[["Ty","Przepraszam, mam pytanie o wypłatę.","Извините, у меня вопрос о зарплате."],["Księgowa","Słucham.","Слушаю."],["Ty","W umowie jest pięć tysięcy brutto. Ile to będzie netto?","В договоре пять тысяч брутто. Сколько это на руки?"],["Księgowa","Około trzech tysięcy sześciuset, to zależy od umowy i ulg.","Около трёх тысяч шестисот, это зависит от договора и льгот."],["Ty","Dziękuję, teraz rozumiem.","Спасибо, теперь понимаю."]],"r":{"pl":"Wypłatę dostaję dziesiątego dnia miesiąca. Na pasku wynagrodzenia widzę kwotę brutto, podatek i składki. Na konto dostaję kwotę netto. W grudniu dostałam premię. Część pieniędzy oszczędzam, a część wysyłam rodzinie.","ru":"Зарплату я получаю десятого числа. В расчётном листке вижу сумму брутто, налог и взносы. На счёт приходит сумма нетто. В декабре я получила премию. Часть денег коплю, часть отправляю семье."},"ff":["kwota","квота","сумма («kwota netto» — сумма на руки)"],"lf":"Минимальную зарплату пересматривают каждый год. Актуальную сумму смотрите на gov.pl, а не в старых статьях.","ts":"Назовите вслух суммы: 250 zł, 1 800 zł, 4 500 zł, 10 000 zł.","tw":"Напишите словами 3 суммы: 300 zł, 2 750 zł, 6 000 zł."},{"d":43,"s":2,"wk":6,"t":"Телефонный разговор","tp":"Rozmowa telefoniczna","w":[["dzwonić","звонить"],["oddzwonić","перезвонить"],["rozmawiać","разговаривать"],["połączenie","соединение, звонок"],["słychać","слышно"],["przerywa","прерывается"],["poczekać","подождать"],["przełączyć","переключить, соединить"]],"p":[["Halo, słucham?","Алло, слушаю?"],["Czy mogę rozmawiać z panem Nowakiem?","Могу я поговорить с паном Новаком?"],["Proszę oddzwonić później.","Перезвоните, пожалуйста, позже."]],"g":{"t":"Дательный падеж местоимений","x":"mi (мне), ci (тебе), mu (ему), jej (ей), nam (нам), wam (вам), im (им). Вежливо: panu (вам, мужчине), pani (вам, женщине). Oddzwonię panu. Dam ci znać. Powiem jej.","e":[["Oddzwonię pani za godzinę.","Я перезвоню вам через час."],["Dam ci znać jutro.","Дам тебе знать завтра."]]},"dl":[["Recepcja","Firma Nowak, dzień dobry.","Фирма «Новак», добрый день."],["Ty","Dzień dobry, czy mogę rozmawiać z panem Nowakiem?","Здравствуйте, могу я поговорить с паном Новаком?"],["Recepcja","Niestety, ma spotkanie. Coś przekazać?","К сожалению, он на встрече. Что-то передать?"],["Ty","Proszę mu powiedzieć, że dzwoniła Olga Iwanowa.","Передайте ему, пожалуйста, что звонила Ольга Иванова."],["Recepcja","Oczywiście, oddzwoni po południu.","Конечно, он перезвонит после обеда."]],"r":{"pl":"Rozmowy telefoniczne po polsku są trudne, bo nie widzę twarzy. Dlatego mówię wolno i proszę o powtórzenie. Zawsze mam kartkę i długopis. Kiedy połączenie przerywa, mówię: «Przepraszam, źle słychać, oddzwonię».","ru":"Телефонные разговоры на польском трудные, потому что не видно лица. Поэтому я говорю медленно и прошу повторить. У меня всегда под рукой листок и ручка. Когда связь прерывается, говорю: «Извините, плохо слышно, я перезвоню»."},"ff":["wiadomość","ведомость","сообщение, новость («wiadomości» — новости)"],"lf":"По телефону поляки часто отвечают «Słucham» — это нормальное начало, а не грубость.","ts":"Сыграйте вслух звонок в фирму: попросите соединить и оставьте сообщение.","tw":"Напишите 4 фразы с mi / ci / mu / jej / panu / pani."},{"d":44,"s":2,"wk":6,"type":"rev","t":"Повторение: неделя 6","tp":"Powtórka","rng":[38,43],"x":"Повторяем работу: поиск, собеседование, договор, поручения, зарплату, телефон. Пройдите тест. Зат
