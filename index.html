 kawałek."]},"wr":{"t":"Письмо: всё вместе","rule":["Повторяем всё: ó или u, rz или ż, ch или h, nie раздельно или слитно, большая буква и запятые перед a, ale, bo, więc, że, czy.","На экзамене B1 есть отдельная часть «Poprawność gramatyczna» — грамматика и орфография. Тренируемся уже сейчас."],"x":[{"k":"spell","s":"kr_l","o":["ó","u"],"a":"ó","w":"królowa."},{"k":"spell","s":"mo_e","o":["rz","ż"],"a":"rz","w":"море → morze."},{"k":"spell","s":"_erbata","o":["h","ch"],"a":"h","w":"Заимствование."},{"k":"choice","s":"Przepraszam, ___.","o":["nie wiem","niewiem"],"a":"nie wiem","w":"С глаголом раздельно."},{"k":"comma","s":"Kupuję tort bo są imieniny.","a":"Kupuję tort, bo są imieniny."},{"k":"comma","s":"Basia mówi że kwiaty są piękne.","a":"Basia mówi, że kwiaty są piękne."},{"k":"comma","s":"Tort jest drogi ale pyszny.","a":"Tort jest drogi, ale pyszny."}],"dict":["Poproszę tort i kwiaty.","Wiem, że pani Basia lubi sernik."]},"rd":{"pl":"W Polsce imieniny są tak samo ważne jak urodziny, a czasem nawet ważniejsze. W kalendarzu każdy dzień ma swoje imiona. Pani Basia ma imieniny w grudniu i zawsze zaprasza sąsiadów na kawę i ciasto. Goście przynoszą kwiaty albo mały prezent. Mówią: „Wszystkiego najlepszego!”. Nadia jest pierwszy raz na polskich imieninach i bardzo jej się podoba.","ru":"В Польше именины так же важны, как день рождения, а иногда даже важнее. В календаре у каждого дня свои имена. У пани Баси именины в декабре, и она всегда приглашает соседей на кофе и пирог. Гости приносят цветы или маленький подарок. Говорят: «Всего наилучшего!». Надя впервые на польских именинах, и ей очень нравится.","q":[{"q":"Co przynoszą goście?","o":["kwiaty albo mały prezent","zupę","pieniądze"],"a":0},{"q":"Kiedy pani Basia ma imieniny?","o":["w grudniu","w maju","w lipcu"],"a":0},{"q":"Czy Nadii podobają się imieniny?","o":["tak, bardzo","nie","trochę"],"a":0}]},"trap":["imieniny","«имена»","«именины» — праздник в день святого, чьё имя ты носишь"],"life":"Реальная миссия недели: зайди в магазин и всё скажи только по-польски — поздоровайся, спроси цену, заплати, попрощайся. Потом отметь миссию в приложении.","role":{"ru":"Ты на именинах. Ола играет пани Басю.","who":"pani Basia","open":"Nadia! Wchodź, kochana!","goal":["Поздравь","Вручи подарок","Ответь, что будешь есть и пить"],"steps":[["Nadia! Wchodź, kochana!","Поздравь пани Басю","Wszystkiego najlepszego, pani Basiu!"],["Dziękuję! Jakie piękne kwiaty!","Скажи, что у тебя есть ещё подарок","Mam też mały prezent."],["Och, dziękuję! Kawa czy herbata?","Попроси кофе с молоком","Poproszę kawę z mlekiem."],["Jesz sernik?","Да, но только маленький кусочек","Tak, ale tylko mały kawałek."]]},"exam":{"t":"Мини-экзамен недели 2","note":"Пять частей, как на настоящем экзамене. Чтобы сдать, нужно минимум 50% в каждой части.","parts":[{"name":"Słuchanie","ru":"Слушание","q":[{"k":"listen","pl":"Ile kosztuje ten ser? — Dwanaście złotych.","o":["12 zł","20 zł","2 zł"],"a":0},{"k":"listen","pl":"Boli mnie gardło i mam katar.","o":["горло и насморк","голова и кашель","живот"],"a":0},{"k":"listen","pl":"Na miejscu czy na wynos?","o":["здесь или с собой?","наличные или карта?","чай или кофе?"],"a":0},{"k":"listen","pl":"Pół kilo pomidorów i trzy ogórki.","o":["0,5 кг помидоров и 3 огурца","1 кг помидоров и 3 огурца","0,5 кг огурцов и 3 помидора"],"a":0}]},{"name":"Czytanie","ru":"Чтение","text":"Sklep „U Zbyszka” jest otwarty od siódmej do dwudziestej drugiej. W niedzielę sklep jest zamknięty. Dziś w promocji: masło 6,99 zł, jabłka 3,50 zł za kilogram.","q":[{"k":"mc","q":"Do której jest otwarty sklep?","o":["do 22:00","do 20:00","do 7:00"],"a":0},{"k":"mc","q":"Kiedy sklep jest zamknięty?","o":["w niedzielę","w sobotę","w poniedziałek"],"a":0},{"k":"mc","q":"Ile kosztuje kilo jabłek?","o":["3,50 zł","6,99 zł","35 zł"],"a":0}]},{"name":"Poprawność gramatyczna","ru":"Грамматика","q":[{"k":"mc","q":"To kosztuje pięć ___.","o":["złotych","złote","złoty"],"a":0},{"k":"mc","q":"Poproszę ___ kawę.","o":["dużą","duża","dużę"],"a":0},{"k":"mc","q":"___ mnie nogi.","o":["Bolą","Boli","Mam"],"a":0},{"k":"mc","q":"Oni ___ obiad.","o":["jedzą","jemy","je"],"a":0},{"k":"mc","q":"dwa ___ (pomidor)","o":["pomidory","pomidorów","pomidori"],"a":0}]},{"name":"Pisanie","ru":"Письмо","q":[{"k":"comma","s":"Mam gorączkę więc zostaję w domu.","a":"Mam gorączkę, więc zostaję w domu."},{"k":"spell","s":"_ona","o":["rz","ż"],"a":"ż","w":"жена → żona."},{"k":"tr","ru":"Счёт, пожалуйста.","a":["Poproszę rachunek.","Rachunek, proszę.","Proszę rachunek."]}]},{"name":"Mówienie","ru":"Говорение","speak":["Dzień dobry. Poproszę chleb i masło.","Ile to kosztuje?","Boli mnie głowa.","Wszystkiego najlepszego!"]}]},"boss":[]},{"d":15,"t":"Как пройти? Направления в городе","tp":"Jak dojść?","lvl":"A1","city":"Wrocław","goal":"Спросить дорогу, понять ответ (prosto, w lewo, w prawo, obok…) и объяснить дорогу самой.","story":{"t":"Сцена 7. Где Рынок?","ru":"Суббота. Надя хочет увидеть главную площадь Вроцлава и знаменитых гномов — krasnale. Она спрашивает дорогу у прохожего.","l":[["Nadia","Przepraszam, gdzie jest Rynek?","Извините, где Рынок (главная площадь)?"],["Przechodzień","Rynek? To niedaleko. Proszę iść prosto tą ulicą.","Рынок? Это недалеко. Идите прямо по этой улице."],["Nadia","Prosto, a potem?","Прямо, а потом?"],["Przechodzień","Na skrzyżowaniu proszę skręcić w lewo.","На перекрёстке поверните налево."],["Nadia","Czy to daleko pieszo?","Это далеко пешком?"],["Przechodzień","Nie, jakieś pięć minut. Ratusz będzie po prawej stronie.","Нет, минут пять. Ратуша будет справа."],["Nadia","Dziękuję bardzo!","Большое спасибо!"],["Przechodzień","Nie ma za co. I proszę szukać krasnali!","Не за что. И ищите гномов!"]],"q":[{"q":"Gdzie Nadia skręca?","o":["na skrzyżowaniu w lewo","na skrzyżowaniu w prawo","obok ratusza"],"a":0},{"q":"Jak daleko jest Rynek?","o":["pięć minut pieszo","pół godziny tramwajem","bardzo daleko"],"a":0}]},"why":{"t":"Почему «w lewo», но «po lewej stronie»?","q":"Поляк говорит «skręć w lewo», но «apteka jest po lewej stronie». В русском тоже два разных слова: «налево» и «слева». Угадаешь, где какое?","p":["**Куда? → w lewo, w prawo, prosto.** Это направление движения, как русское «налево, направо, прямо»: Proszę skręcić w lewo.","**Где? → po lewej stronie, po prawej stronie.** Это место, как русское «слева, справа»: Apteka jest po prawej stronie. В разговоре часто коротко: po lewej, po prawej.","**Вежливая просьба = proszę + инфинитив.** По-русски мы говорим «идите, поверните», а поляк вежливо говорит «прошу идти, прошу повернуть»: Proszę iść prosto. Proszę skręcić w prawo. Это даже проще: глагол не надо спрягать, достаточно формы на -ć.","**obok, koło, naprzeciwko + родительный падеж** — как русское «возле, около, напротив + чего?»: obok apteki (возле аптеки), koło dworca (около вокзала), naprzeciwko banku (напротив банка). **Почему так?** Все эти слова отвечают на вопрос «возле чего?», а «чего?» — родительный падеж в обоих языках."],"tb":{"h":["Вопрос","Польский","Русский"],"r":[["Куда?","w lewo / w prawo / prosto","налево / направо / прямо"],["Где?","po lewej / po prawej stronie","слева / справа"],["Возле чего?","obok apteki, koło dworca","возле аптеки, около вокзала"],["Напротив чего?","naprzeciwko banku","напротив банка"]]},"pr":[{"q":"Proszę skręcić ___ (налево).","o":["w lewo","po lewej"],"a":0,"w":"Куда? → w lewo."},{"q":"Bank jest ___ stronie (справа).","o":["po prawej","w prawo"],"a":0,"w":"Где? → po prawej stronie."},{"q":"Sklep jest obok ___ (apteka).","o":["apteki","apteka","aptekę"],"a":0,"w":"obok + родительный: apteka → apteki."},{"q":"Вежливо: «Идите прямо».","o":["Proszę iść prosto.","Proszę idzie prosto.","Idziesz prosto."],"a":0,"w":"proszę + инфинитив: iść."}]},"w":[["gdzie","где","Gdzie jest apteka?","Где аптека?"],["ulica","улица","Mieszkam na tej ulicy.","Я живу на этой улице."],["w lewo","налево","Proszę skręcić w lewo.","Поверните налево."],["w prawo","направо","Potem w prawo i prosto.","Потом направо и прямо."],["prosto","прямо","Proszę iść prosto.","Идите прямо."],["skręcić","повернуть","Tutaj trzeba skręcić.","Здесь нужно повернуть."],["daleko","далеко","Czy to daleko?","Это далеко?"],["blisko","близко","Sklep jest blisko.","Магазин близко."],["obok","рядом, возле","Apteka jest obok banku.","Аптека рядом с банком."],["skrzyżowanie","перекрёсток","Na skrzyżowaniu proszę skręcić w lewo.","На перекрёстке поверните налево."],["światła","светофор","Na światłach proszę skręcić w prawo.","На светофоре поверните направо."],["pieszo","пешком","Idę pieszo, bo jest blisko.","Я иду пешком, потому что близко."]],"dr":[{"k":"gap","s":"Apteka jest ___ banku.","h":"рядом с","a":["obok","koło"],"w":"obok + родительный: obok banku."},{"k":"gap","s":"Proszę skręcić w ___.","h":"налево","a":["lewo"],"w":"Куда? → w lewo."},{"k":"gap","s":"Sklep jest koło ___ (dworzec).","a":["dworca"],"w":"koło + родительный: dworzec → dworca. Беглое e, как «огурец → огурца»."},{"k":"build","pl":"Przepraszam, jak dojść do Rynku?","ru":"Извините, как дойти до Рынка?"},{"k":"tr","ru":"Это далеко?","a":["Czy to daleko?","To daleko?","Czy to jest daleko?"]},{"k":"mc","q":"Что значит «Proszę iść prosto»?","o":["Идите прямо","Это просто","Прошу, всё просто"],"a":0,"w":"prosto = прямо. А «просто» по-польски — po prostu."}],"snd":{"t":"Носовые ę и ą внутри слова","how":["**Перед t, d, c, ć, cz** ę и ą звучат как en и on: pięć, będę, kąt, skręcić. **Перед k и g** — с задним n, как в английском «long»: ręka, mąka.","**Перед p и b** — как em и om: ząb, gęba. **Перед s, sz, z, ż, w, f, ch** — чистый носовой гласный, без n: wąs, gęś, mięso.","**Перед l и ł** носового звука нет совсем: wziął, zaczęła. В парах ниже слушай: в первой разница только в гласной (o или e), во второй и третьей — есть ли носовой призвук вообще."],"pairs":[["mąka","męka","мука (для теста)","мучение"],["pięć","piec","пять","печь"],["wąs","was","ус","вас"]],"say":["Proszę skręcić w lewo.","Pięć minut pieszo.","Idę prosto, potem w prawo.","Mąka jest w sklepie obok."]},"wr":{"t":"Запятая перед gdzie и jak; пишем ę, хотя слышим en","rule":["**Запятая перед gdzie, jak, kiedy, co**, когда они начинают придаточное — как в русском: Nie wiem, gdzie jest bank. Powiedz, jak dojść do dworca.","**Пишем ą и ę, хотя слышим on, en, om:** ręka, pięć, skręcić, ząb. На письме носовые буквы не исчезают. Если перед согласной слышно on/en/om/em, почти всегда пишется ą или ę (кроме заимствований: kontakt, tempo)."],"x":[{"k":"comma","s":"Nie wiem gdzie jest apteka.","a":"Nie wiem, gdzie jest apteka."},{"k":"comma","s":"Przepraszam czy wie pan jak dojść do Rynku?","a":"Przepraszam, czy wie pan, jak dojść do Rynku?"},{"k":"comma","s":"Idę prosto i skręcam w prawo.","a":"Idę prosto i skręcam w prawo."},{"k":"choice","s":"Proszę ___ w lewo.","o":["skręcić","skrencić"],"a":"skręcić","w":"Слышим en, пишем ę."},{"k":"choice","s":"___ minut pieszo.","o":["Pięć","Pieńć"],"a":"Pięć","w":"Пишем ę: pięć."},{"k":"spell","s":"m_ka","o":["ą","on"],"a":"ą","w":"Слышим on, пишем ą: mąka."}],"dict":["Proszę iść prosto, potem w lewo.","Nie wiem, gdzie jest poczta."]},"rd":{"pl":"Wrocław ma ponad sześćset krasnali. Są małe, z brązu, i stoją w całym mieście. Nadia ma mapę i szuka ich na Rynku. Pierwszy krasnal jest obok ratusza, drugi koło banku, a trzeci przy przystanku tramwajowym. Nadia idzie prosto, skręca w lewo, potem w prawo. Po godzinie ma w telefonie dwadzieścia zdjęć. „To lepsze niż muzeum!” — myśli.","ru":"Во Вроцлаве больше шестисот гномов. Они маленькие, из бронзы, и стоят по всему городу. У Нади есть карта, и она ищет их на Рынке. Первый гном рядом с ратушей, второй около банка, а третий у трамвайной остановки. Надя идёт прямо, поворачивает налево, потом направо. Через час у неё в телефоне двадцать фотографий. «Это лучше, чем музей!» — думает она.","q":[{"q":"Z czego są krasnale?","o":["z brązu","z drewna","z papieru"],"a":0},{"q":"Gdzie jest pierwszy krasnal?","o":["obok ratusza","koło banku","przy przystanku"],"a":0},{"q":"Ile zdjęć ma Nadia?","o":["dwadzieścia","dwanaście","dwa"],"a":0}]},"trap":["prosto","«просто»","«прямо»: Proszę iść prosto — идите прямо. А русское «просто» по-польски — po prostu"],"life":"Дорогу удобно спрашивать фразой «Przepraszam, jak dojść do…?». Поляки часто объясняют по ориентирам: na światłach (на светофоре), przy kościele (у костёла), za mostem (за мостом). Карту гномов Вроцлава можно найти в туристической информации на Рынке или в интернете.","role":{"ru":"Туристка спрашивает у тебя дорогу. Ола — туристка.","who":"turystka, która pyta o drogę","open":"Przepraszam, gdzie jest apteka?","goal":["Объясни дорогу: prosto, w lewo, w prawo","Скажи, далеко ли это","Скажи, что рядом с чем (obok + …)"],"steps":[["Przepraszam, gdzie jest apteka?","Скажи: прямо, потом направо","Proszę iść prosto, potem w prawo."],["Czy to daleko?","Скажи: нет, близко, пять минут пешком","Nie, blisko. Pięć minut pieszo."],["A gdzie jest bank?","Скажи: банк рядом с аптекой","Bank jest obok apteki."],["Dziękuję bardzo!","Ответь: не за что","Nie ma za co."]]},"boss":[{"k":"mc","q":"«Налево» — это…","o":["w lewo","po lewej","lewa strona"],"a":0,"w":"Куда? → w lewo."},{"k":"mc","q":"Apteka jest ___ stronie.","o":["po prawej","w prawo","prosto"],"a":0,"w":"Где? → po prawej stronie."},{"k":"mc","q":"obok ___ (bank)","o":["banku","bank","bankiem"],"a":0,"w":"obok + родительный: banku."},{"k":"mc","q":"Что значит «skrzyżowanie»?","o":["перекрёсток","светофор","мост"],"a":0,"w":"Na skrzyżowaniu — на перекрёстке."},{"k":"choice","s":"Boli mnie ___.","o":["ręka","renka"],"a":"ręka","w":"Слышим en, пишем ę."},{"k":"comma","s":"Nie wiem jak dojść do dworca.","a":"Nie wiem, jak dojść do dworca."},{"k":"gap","s":"Proszę ___ prosto.","h":"идти","a":["iść"],"w":"proszę + инфинитив: iść."},{"k":"tr","ru":"Извините, где аптека?","a":["Przepraszam, gdzie jest apteka?","Przepraszam, gdzie apteka?"]},{"k":"listen","pl":"Na skrzyżowaniu proszę skręcić w prawo.","o":["на перекрёстке — направо","на перекрёстке — налево","на светофоре — прямо"],"a":0},{"k":"listen","pl":"Bank jest obok apteki, po lewej stronie.","o":["банк рядом с аптекой, слева","банк напротив аптеки, справа","аптека рядом с банком, справа"],"a":0}]},{"d":16,"t":"Транспорт: iść или jechać?","tp":"Tramwajem na dworzec","lvl":"A1","city":"Wrocław","goal":"Узнать, какой транспорт идёт куда нужно, купить билет и правильно выбрать iść или jechać.","story":{"t":"Сцена 8. Мама приезжает","ru":"В воскресенье к Наде на поезде приезжает мама. Надя звонит Кубе: как доехать до вокзала?","l":[["Nadia","Kuba, jak dojechać na dworzec? Moja mama przyjeżdża pociągiem.","Куба, как доехать до вокзала? Моя мама приезжает поездом."],["Kuba","To proste. Jedź tramwajem numer osiem. Przystanek jest obok twojego domu.","Это просто. Езжай на трамвае номер восемь. Остановка рядом с твоим домом."],["Nadia","A gdzie kupić bilet?","А где купить билет?"],["Kuba","W biletomacie albo w aplikacji. Bilet na trzydzieści minut wystarczy.","В билетном автомате или в приложении. Билета на тридцать минут хватит."],["Nadia","Czy muszę się przesiadać?","Мне нужно делать пересадку?"],["Kuba","Nie, to bezpośredni tramwaj. Wysiadasz na przystanku Dworzec Główny.","Нет, это прямой трамвай. Выходишь на остановке «Главный вокзал»."],["Nadia","A z dworca do domu idziemy pieszo?","А с вокзала домой мы идём пешком?"],["Kuba","Z walizką lepiej jechać!","С чемоданом лучше ехать!"]],"q":[{"q":"Czym Nadia jedzie na dworzec?","o":["tramwajem","autobusem","pociągiem"],"a":0},{"q":"Gdzie można kupić bilet?","o":["w biletomacie albo w aplikacji","tylko u kierowcy","na poczcie"],"a":0}]},"why":{"t":"Почему «idę pieszo», но «jadę tramwajem»?","q":"По-русски «иду пешком», но «еду на трамвае». В польском то же деление, и даже падеж знакомый. Угадаешь, как сказать «еду поездом»?","p":["**iść** — идти пешком, **jechać** — ехать на чём-то. Точно как русское «идти / ехать»: Idę do sklepu. Jadę do pracy.","**Чем? → творительный падеж:** jechać tramwajem, autobusem, pociągiem, taksówką. По-русски тоже можно сказать «ехать поездом, трамваем» — это тот же творительный. Окончание **-em** у мужского рода, **-ą** у женского (taksówką).","**Спряжение похоже на русское:** idę, idziesz, idzie, idziemy, idziecie, idą (иду, идёшь…); jadę, jedziesz, jedzie, jedziemy, jedziecie, jadą (еду, едешь…). **Почему d → dzi?** Перед e согласная смягчается, как в русском «еду — едешь». Только в польском смягчение видно на письме: jadę → jedziesz.","**Куда? → do + родительный** (do pracy, do domu, do Krakowa), но **na + винительный** для вокзала, остановки, почты, рынка: na dworzec, na przystanek, na pocztę, na targ. Как русское «на вокзал, на почту»."],"tb":{"h":["","iść (пешком)","jechać (на транспорте)"],"r":[["я","idę","jadę"],["ты","idziesz","jedziesz"],["он / она","idzie","jedzie"],["мы","idziemy","jedziemy"],["вы","idziecie","jedziecie"],["они","idą","jadą"]]},"tb2":{"h":["Чем?","Польский"],"r":[["трамвай","tramwajem"],["автобус","autobusem"],["поезд","pociągiem"],["такси","taksówką"],["машина","samochodem"]]},"pr":[{"q":"Do pracy ___ tramwajem.","o":["jadę","idę"],"a":0,"w":"Транспорт → jechać: jadę."},{"q":"Do sklepu ___ pieszo.","o":["idę","jadę"],"a":0,"w":"Пешком → iść: idę."},{"q":"Jedziemy ___ (pociąg).","o":["pociągiem","pociąg","pociągu"],"a":0,"w":"Чем? → творительный: pociągiem."},{"q":"oni ___ (jechać)","o":["jadą","jedzą","jedziemy"],"a":0,"w":"jadą — едут. Не путай с jedzą — едят!"}]},"w":[["tramwaj","трамвай","Czekam na tramwaj.","Я жду трамвай."],["autobus","автобус","Ten autobus jedzie do centrum.","Этот автобус едет в центр."],["pociąg","поезд","Pociąg ma spóźnienie.","Поезд опаздывает."],["bilet","билет","Mam bilet na trzydzieści minut.","У меня билет на тридцать минут."],["przystanek","остановка","Gdzie jest przystanek?","Где остановка?"],["dworzec","вокзал","Jadę na dworzec.","Я еду на вокзал."],["peron","платформа","Pociąg odjeżdża z peronu trzeciego.","Поезд отправляется с третьей платформы."],["przesiadka","пересадка","Jedziemy bez przesiadki.","Мы едем без пересадки."],["wsiadać","садиться (в транспорт)","Wsiadam do tramwaju.","Я сажусь в трамвай."],["wysiadać","выходить (из транспорта)","Wysiadam na następnym przystanku.","Я выхожу на следующей остановке."],["biletomat","билетный автомат","Biletomat przyjmuje karty.","Автомат принимает карты."],["walizka","чемодан","Mama ma dużą walizkę.","У мамы большой чемодан."]],"dr":[{"k":"gap","s":"Jadę do pracy ___ (autobus).","a":["autobusem"],"w":"Чем? → autobusem."},{"k":"gap","s":"Dziś ___ pieszo.","h":"я иду","a":["idę"],"w":"Пешком → idę."},{"k":"gap","s":"Oni ___ pociągiem do Krakowa.","h":"едут","a":["jadą"],"w":"jechać → oni jadą."},{"k":"build","pl":"Gdzie mogę kupić bilet?","ru":"Где я могу купить билет?"},{"k":"tr","ru":"Я выхожу на следующей остановке.","a":["Wysiadam na następnym przystanku."]},{"k":"mc","q":"«Dworzec» — это…","o":["вокзал","дворец","двор"],"a":0,"w":"Ловушка дня! Дворец по-польски — pałac."}],"snd":{"t":"s, c — свист; sz, cz — шипение","how":["**s и c** — свистящие, как русские «с» и «ц»: кончик языка у зубов. Слова: sok, kasa, cena.","**sz и cz** — шипящие и твёрдые: кончик языка поднят за верхние зубы к нёбу, губы чуть вперёд. Слова: szok, kasza, czas. Польское **cz всегда твёрдое** — не мягкое русское «ч».","Зачем это нужно: **kasa** — касса, а **kasza** — каша. На вокзале ты идёшь в kasa biletowa, а не за кашей!"],"pairs":[["sok","szok","сок","шок"],["kasa","kasza","касса","каша"],["lecę","leczę","лечу (лететь)","лечу (лечить)"]],"say":["Gdzie jest kasa biletowa?","Czekam na przystanku.","Jadę tramwajem.","Czy ten autobus jedzie na dworzec?"]},"wr":{"t":"Запятая перед który; rz после p, t, k","rule":["**Запятая перед który** (который) — как в русском. Если придаточное стоит в середине, запятые с двух сторон: Tramwaj, który jedzie na dworzec, ma numer osiem.","**rz после p, t, k, ch.** Слышим sz, а пишем rz: przystanek, przesiadka, trzy, krzesło. Исключений мало: pszczoła, pszenica, kształt."],"x":[{"k":"comma","s":"To jest autobus który jedzie do centrum.","a":"To jest autobus, który jedzie do centrum."},{"k":"comma","s":"Pociąg który jedzie do Krakowa ma spóźnienie.","a":"Pociąg, który jedzie do Krakowa, ma spóźnienie."},{"k":"spell","s":"p_ystanek","o":["rz","sz"],"a":"rz","w":"После p → rz."},{"k":"spell","s":"p_esiadka","o":["rz","sz"],"a":"rz","w":"После p → rz."},{"k":"spell","s":"k_esło","o":["rz","sz"],"a":"rz","w":"После k → rz."},{"k":"spell","s":"p_czoła","o":["sz","rz"],"a":"sz","w":"Редкое исключение: pszczoła."}],"dict":["Wysiadam na przystanku Dworzec Główny.","Jadę tramwajem, który jedzie do centrum."]},"rd":{"pl":"W niedzielę Nadia jedzie na dworzec. Kupuje bilet w aplikacji i czeka na przystanku. Tramwaj numer osiem przyjeżdża po trzech minutach. Nadia wsiada i siada przy oknie. Po dwudziestu minutach wysiada na przystanku Dworzec Główny. Pociąg z Warszawy ma dziesięć minut spóźnienia. Wreszcie mama wychodzi z wagonu z dużą walizką. „Córeczko!” — woła. Do domu jadą taksówką, bo walizka jest bardzo ciężka.","ru":"В воскресенье Надя едет на вокзал. Она покупает билет в приложении и ждёт на остановке. Трамвай номер восемь приезжает через три минуты. Надя заходит и садится у окна. Через двадцать минут она выходит на остановке «Главный вокзал». Поезд из Варшавы опаздывает на десять минут. Наконец мама выходит из вагона с большим чемоданом. «Доченька!» — зовёт она. Домой они едут на такси, потому что чемодан очень тяжёлый.","q":[{"q":"Gdzie Nadia kupuje bilet?","o":["w aplikacji","w biletomacie","u kierowcy"],"a":0},{"q":"Ile minut spóźnienia ma pociąg?","o":["dziesięć","trzy","dwadzieścia"],"a":0},{"q":"Dlaczego jadą do domu taksówką?","o":["walizka jest ciężka","nie ma tramwaju","pada deszcz"],"a":0}]},"trap":["dworzec","«дворец»","«вокзал»: Dworzec Główny — главный вокзал. Дворец по-польски — pałac"],"life":"Бумажный билет нужно пробить в компостере (kasownik) сразу после посадки. Электронный покупают в приложении до поездки. Контролёры штрафуют на месте. Цены и правила у каждого города свои: смотри сайт городского транспорта.","role":{"ru":"Ты на остановке. Ола — местная жительница, предлагает помощь.","who":"mieszkanka miasta na przystanku","open":"Dzień dobry! Mogę w czymś pomóc?","goal":["Спроси, какой трамвай едет на вокзал","Узнай, где купить билет","Спроси про пересадку"],"steps":[["Dzień dobry! Mogę w czymś pomóc?","Спроси, какой трамвай едет на вокзал","Który tramwaj jedzie na dworzec?"],["Ósemka, czyli numer osiem.","Спроси, где можно купить билет","Gdzie mogę kupić bilet?"],["W biletomacie albo w aplikacji.","Спроси, нужна ли пересадка","Czy muszę się przesiadać?"],["Nie, to bezpośredni tramwaj.","Поблагодари","Dziękuję bardzo!"]]},"boss":[{"k":"mc","q":"Do pracy ___ autobusem.","o":["jadę","idę","jem"],"a":0,"w":"Транспорт → jechać."},{"k":"mc","q":"oni ___ (jechać)","o":["jadą","jedzą","jedą"],"a":0,"w":"jadą — едут; jedzą — едят."},{"k":"mc","q":"Jadę ___ (taksówka).","o":["taksówką","taksówkę","taksówka"],"a":0,"w":"Чем? Женский род → -ą."},{"k":"mc","q":"«wysiadać» — это…","o":["выходить из транспорта","садиться в транспорт","пересаживаться"],"a":0,"w":"wsiadać — садиться, wysiadać — выходить."},{"k":"spell","s":"t_eba","o":["rz","sz"],"a":"rz","w":"После t → rz: trzeba."},{"k":"comma","s":"To jest tramwaj który jedzie na dworzec.","a":"To jest tramwaj, który jedzie na dworzec."},{"k":"gap","s":"Stoję na ___ (przystanek).","h":"где?","a":["przystanku"],"w":"na + местный падеж: na przystanku."},{"k":"tr","ru":"Где я могу купить билет?","a":["Gdzie mogę kupić bilet?"]},{"k":"listen","pl":"Pociąg do Krakowa odjeżdża z peronu drugiego.","o":["поезд в Краков — со 2-й платформы","поезд из Кракова — на 2-ю платформу","поезд в Краков — с 3-й платформы"],"a":0},{"k":"listen","pl":"Wysiadam na następnym przystanku.","o":["выхожу на следующей остановке","сажусь на этой остановке","жду на остановке"],"a":0}]},{"d":17,"t":"Который час? Время и встречи","tp":"Która godzina?","lvl":"A1","city":"Wrocław","goal":"Спросить и сказать время, договориться «o której?» и понять «wpół do» и «kwadrans po».","story":{"t":"Сцена 9. Во сколько встречаемся?","ru":"Куба зовёт Надю и её маму в кино. Нужно договориться о времени.","l":[["Kuba","Cześć, Nadia! Idziemy jutro do kina? Ty i twoja mama.","Привет, Надя! Пойдём завтра в кино? Ты и твоя мама."],["Nadia","Chętnie! O której jest film?","С удовольствием! Во сколько фильм?"],["Kuba","Jest seans o siedemnastej i o dwudziestej.","Есть сеанс в семнадцать и в двадцать часов."],["Nadia","Mama wcześnie chodzi spać. Lepiej o siedemnastej.","Мама рано ложится спать. Лучше в семнадцать."],["Kuba","Dobrze. Spotkajmy się o wpół do piątej przed kinem.","Хорошо. Давай встретимся в половине пятого перед кинотеатром."],["Nadia","O wpół do piątej, czyli o szesnastej trzydzieści?","В половине пятого, то есть в шестнадцать тридцать?"],["Kuba","Tak! Tylko się nie spóźnij.","Да! Только не опаздывай."],["Nadia","Zaraz zapiszę w telefonie.","Сейчас запишу в телефоне."]],"q":[{"q":"O której jest film?","o":["o siedemnastej","o dwudziestej","o wpół do piątej"],"a":0},{"q":"O której się spotykają?","o":["o szesnastej trzydzieści","o siedemnastej trzydzieści","o piątej"],"a":0}]},"why":{"t":"Почему «o drugiej», а не «o dwa»?","q":"По-русски «в два часа». А поляк говорит «o drugiej» — буквально «о второй». Почему порядковое число и почему женский род?","p":["**Слово godzina (час) — женского рода и «спрятано».** Поляк говорит: Jest druga (godzina) — сейчас «вторая». Поэтому время — это порядковое число в женском роде: pierwsza, druga, trzecia, czwarta, piąta…","**Во сколько? → o + местный падеж:** o pierwszej, o drugiej, o trzeciej, o piątej, o dwunastej. Похожая логика есть и в русском: «во втором часу» — тоже порядковое число.","**Половина — как русское «полтретьего»:** wpół do trzeciej = 2:30. Считаем до следующего часа, как в русском. **kwadrans** — четверть часа: kwadrans po drugiej = 2:15 (четверть третьего), za kwadrans trzecia = 2:45 (без четверти три).","**Официально — 24 часа:** pociąg o siedemnastej dwadzieścia (17:20). Минуты называем просто числом: ósma piętnaście, siedemnasta dwadzieścia."],"tb":{"h":["Время","Который час?","Во сколько?"],"r":[["1:00","pierwsza","o pierwszej"],["2:00","druga","o drugiej"],["3:00","trzecia","o trzeciej"],["5:00","piąta","o piątej"],["8:00","ósma","o ósmej"],["12:00","dwunasta","o dwunastej"],["17:00","siedemnasta","o siedemnastej"]]},"tb2":{"h":["Время","Польский","Русский"],"r":[["2:15","kwadrans po drugiej","четверть третьего"],["2:30","wpół do trzeciej","полтретьего"],["2:45","za kwadrans trzecia","без четверти три"],["17:20","siedemnasta dwadzieścia","семнадцать двадцать"]]},"pr":[{"q":"Jest 3:00. Która godzina?","o":["trzecia","trzy","trzeci"],"a":0,"w":"Порядковое число, женский род: trzecia (godzina)."},{"q":"Film jest o ___ (8:00).","o":["ósmej","osiem","ósma"],"a":0,"w":"o + местный падеж: o ósmej."},{"q":"wpół do trzeciej = ?","o":["2:30","3:30","3:15"],"a":0,"w":"Как «полтретьего»: половина до трёх."},{"q":"kwadrans po piątej = ?","o":["5:15","4:45","5:45"],"a":0,"w":"kwadrans po = четверть после: 5:15."}]},"w":[["godzina","час","Która jest godzina?","Который час?"],["minuta","минута","Za pięć minut.","Через пять минут."],["kwadrans","четверть часа","Czekam już kwadrans.","Я жду уже четверть часа."],["wpół do","половина (до часа)","Jest wpół do szóstej.","Сейчас полшестого."],["O której?","Во сколько?","O której jest pociąg?","Во сколько поезд?"],["teraz","сейчас","Teraz jest ósma.","Сейчас восемь."],["rano","утром","Rano piję kawę.","Утром я пью кофе."],["wieczorem","вечером","Wieczorem idziemy do kina.","Вечером мы идём в кино."],["wcześnie","рано","Mama wstaje wcześnie.","Мама встаёт рано."],["późno","поздно","Jest już późno.","Уже поздно."],["spóźnić się","опоздать","Nie spóźnij się!","Не опоздай!"],["kino","кино, кинотеатр","Idziemy do kina.","Мы идём в кино."]],"dr":[{"k":"gap","s":"Spotkajmy się o ___ (6:00).","h":"szósta","a":["szóstej"],"w":"o + местный падеж: o szóstej."},{"k":"gap","s":"Jest ___ (3:00).","h":"trzy","a":["trzecia"],"w":"Порядковое число, женский род: trzecia."},{"k":"mc","q":"Как сказать 7:30?","o":["wpół do ósmej","wpół do siódmej","siódma pół"],"a":0,"w":"Половина до восьми = wpół do ósmej (полвосьмого)."},{"k":"build","pl":"O której jest pociąg do Krakowa?","ru":"Во сколько поезд в Краков?"},{"k":"tr","ru":"Который час?","a":["Która jest godzina?","Która godzina?"]},{"k":"mc","q":"«Zaraz wracam» значит…","o":["Сейчас вернусь","Вернусь завтра","Не вернусь"],"a":0,"w":"zaraz = сейчас, через минутку. «Сразу» по-польски — od razu."}],"snd":{"t":"Звонкие и глухие пары","how":["**Звонкие b, d, g, z, ż, dź** — голосовые связки дрожат: положи ладонь на горло и почувствуешь. **Глухие p, t, k, s, sz, ć** — связки молчат.","Как в русском, в конце слова звонкие оглушаются: chleb звучит с p на конце, wóz — с s. Но в начале и в середине слова разница меняет смысл: **koza** — коза, **kosa** — коса.","**dź и ć** — мягкая пара: dzień — день, cień — тень. В названиях часов dź много: dziewiąta, dziesiąta, dwudziesta. Это один звук, не «д» плюс «зь»."],"pairs":[["koza","kosa","коза","коса"],["dzień","cień","день","тень"],["bić","pić","бить","пить"]],"say":["Jest dziewiąta.","O dziesiątej rano.","Spotkajmy się o wpół do piątej.","Za kwadrans dwudziesta."]},"wr":{"t":"Запятая перед kiedy и gdy; время на письме","rule":["**Запятая перед kiedy и gdy** (когда) — как в русском: Zadzwonię, kiedy będę w domu. Если придаточное стоит первым, запятая после него: Kiedy jest późno, jadę taksówką.","**Время цифрами** пишут через двоеточие или точку: 17:30 или 17.30. **Словами** — порядковое число в женском роде: o siódmej, o wpół do ósmej. Ошибка: «o siedem» — так не говорят."],"x":[{"k":"comma","s":"Zadzwonię kiedy będę w domu.","a":"Zadzwonię, kiedy będę w domu."},{"k":"comma","s":"Kiedy jest późno jadę taksówką.","a":"Kiedy jest późno, jadę taksówką."},{"k":"comma","s":"Wstaję o szóstej i piję kawę.","a":"Wstaję o szóstej i piję kawę."},{"k":"choice","s":"Spotkanie jest o ___.","o":["siódmej","siedem"],"a":"siódmej","w":"o + порядковое число: o siódmej."},{"k":"choice","s":"Jest ___ (2:30).","o":["wpół do trzeciej","wpół do drugiej"],"a":"wpół do trzeciej","w":"Считаем до следующего часа: полтретьего."},{"k":"spell","s":"p_źno","o":["ó","u"],"a":"ó","w":"Запомни: późno, później."}],"dict":["Film jest o siedemnastej.","Zadzwonię, kiedy będę na dworcu."]},"rd":{"pl":"Dzień Nadii. Nadia wstaje o szóstej trzydzieści. O siódmej je śniadanie i pije kawę. Za kwadrans ósma wychodzi z domu, bo tramwaj jest o ósmej. Pracuje od dziewiątej do siedemnastej. Po pracy idzie do sklepu. Wieczorem, o dwudziestej, ogląda serial z mamą. O dwudziestej trzeciej jest już w łóżku. „Jutro znowu wcześnie” — myśli.","ru":"День Нади. Надя встаёт в шесть тридцать. В семь она завтракает и пьёт кофе. Без четверти восемь выходит из дома, потому что трамвай в восемь. Работает с девяти до семнадцати. После работы идёт в магазин. Вечером, в двадцать часов, смотрит сериал с мамой. В двадцать три она уже в кровати. «Завтра снова рано», — думает она.","q":[{"q":"O której Nadia wstaje?","o":["o szóstej trzydzieści","o siódmej","o ósmej"],"a":0},{"q":"Kiedy Nadia pracuje?","o":["od dziewiątej do siedemnastej","od ósmej do szesnastej","od siódmej do piętnastej"],"a":0},{"q":"Co robi o dwudziestej?","o":["ogląda serial z mamą","idzie do sklepu","je śniadanie"],"a":0}]},"trap":["zaraz","«сразу»","«сейчас, через минутку»: Zaraz wracam — сейчас вернусь. «Сразу» по-польски — od razu"],"life":"На работу и в учреждения поляки приходят вовремя, а в гости можно прийти на 10–15 минут позже. Большие магазины по воскресеньям обычно закрыты, кроме нескольких торговых воскресений в году. Часы работы лучше проверять заранее.","role":{"ru":"Договорись с Олой о встрече.","who":"koleżanka Ola","open":"Cześć! Idziemy jutro na kawę?","goal":["Согласись на встречу","Договорись о времени (o + …)","Договорись о месте"],"steps":[["Cześć! Idziemy jutro na kawę?","Согласись и спроси, во сколько","Chętnie! O której?"],["Może o dziesiątej?","Скажи, что в десять ты работаешь, и предложи в семнадцать","O dziesiątej pracuję. Może o siedemnastej?"],["Dobrze, o siedemnastej. Gdzie?","Предложи встретиться перед кинотеатром","Przed kinem."],["Super! Tylko się nie spóźnij!","Скажи: не опоздаю, до завтра","Nie spóźnię się. Do jutra!"]]},"boss":[{"k":"mc","q":"Jest 4:00. Która godzina?","o":["czwarta","cztery","czwarty"],"a":0,"w":"Порядковое число, женский род."},{"k":"mc","q":"O której? (9:00)","o":["o dziewiątej","o dziewięć","o dziewiąta"],"a":0,"w":"o + местный падеж."},{"k":"mc","q":"wpół do szóstej = ?","o":["5:30","6:30","6:15"],"a":0,"w":"Как «полшестого»."},{"k":"mc","q":"za kwadrans ósma = ?","o":["7:45","8:15","8:45"],"a":0,"w":"Без четверти восемь."},{"k":"choice","s":"Kino jest o ___.","o":["dwudziestej","dwadzieścia"],"a":"dwudziestej","w":"o + порядковое число."},{"k":"comma","s":"Zadzwoń kiedy będziesz na dworcu.","a":"Zadzwoń, kiedy będziesz na dworcu."},{"k":"gap","s":"Spotkajmy się o ___ (1:00).","h":"pierwsza","a":["pierwszej"],"w":"o pierwszej."},{"k":"tr","ru":"Во сколько фильм?","a":["O której jest film?","O której film?"]},{"k":"listen","pl":"Pociąg odjeżdża o siedemnastej dwadzieścia.","o":["17:20","7:20","17:02"],"a":0},{"k":"listen","pl":"Spotkajmy się o wpół do ósmej.","o":["7:30","8:30","8:15"],"a":0}]},{"d":18,"t":"Дни недели и планы","tp":"Plany na tydzień","lvl":"A1","city":"Wrocław","goal":"Назвать дни недели, сказать «w poniedziałek, we wtorek…» и рассказать о планах на неделю.","story":{"t":"Сцена 10. План на неделю","ru":"Мама гостит у Нади неделю. Вечером они решают, что будут делать каждый день.","l":[["Mama","Nadia, co robimy w tym tygodniu?","Надя, что мы делаем на этой неделе?"],["Nadia","W poniedziałek i we wtorek pracuję do siedemnastej.","В понедельник и во вторник я работаю до семнадцати."],["Mama","A w środę?","А в среду?"],["Nadia","W środę mam wolne. Jedziemy do zoo!","В среду у меня выходной. Едем в зоопарк!"],["Mama","Świetnie! A w czwartek?","Отлично! А в четверг?"],["Nadia","W czwartek idziemy do pani Basi, a w piątek do teatru.","В четверг идём к пани Басе, а в пятницу в театр."],["Mama","A w weekend?","А на выходных?"],["Nadia","W sobotę jedziemy do Krakowa, a w niedzielę odpoczywamy.","В субботу едем в Краков, а в воскресенье отдыхаем."]],"q":[{"q":"Kiedy Nadia ma wolne?","o":["w środę","w poniedziałek","w piątek"],"a":0},{"q":"Co robią w niedzielę?","o":["odpoczywają","jadą do Krakowa","idą do teatru"],"a":0}]},"why":{"t":"Почему «w środę», но «we wtorek»?","q":"По-русски: «в среду», но «во вторник». Польский делает то же самое и даже добавляет лишнюю гласную в том же месте! Угадаешь почему?","p":["**Когда? → w + винительный падеж**, как в русском «в среду, в пятницу». Мужской род не меняется: w poniedziałek, w czwartek, w piątek. Женский род: -a → -ę: **w środę, w sobotę, w niedzielę** — как «среда → в среду».","**we wtorek — как «во вторник».** Перед словом на w- и перед трудным сочетанием согласных предлог w превращается в we, чтобы было легче сказать: we wtorek, we Wrocławiu. Русское «в → во» работает так же: во вторник, во Владимире.","**Каждую неделю → co + винительный:** co niedzielę jem obiad u mamy (каждое воскресенье), co tydzień (каждую неделю). «co» здесь значит «каждый».","**Ловушка:** niedziela — это воскресенье, а неделя — tydzień. Niedziela — «день, когда не работают» (nie działać). Кстати, в древнерусском «неделей» тоже называли воскресенье."],"tb":{"h":["День","Польский","Когда?"],"r":[["понедельник","poniedziałek","w poniedziałek"],["вторник","wtorek","we wtorek"],["среда","środa","w środę"],["четверг","czwartek","w czwartek"],["пятница","piątek","w piątek"],["суббота","sobota","w sobotę"],["воскресенье","niedziela","w niedzielę"]]},"pr":[{"q":"___ środę mam wolne.","o":["W","We"],"a":0,"w":"w środę — как «в среду»."},{"q":"___ wtorek pracuję.","o":["We","W"],"a":0,"w":"we wtorek — как «во вторник»."},{"q":"w ___ (sobota)","o":["sobotę","sobota","sobocie"],"a":0,"w":"Когда? → винительный: sobotę."},{"q":"Что значит «niedziela»?","o":["воскресенье","неделя","понедельник"],"a":0,"w":"Неделя по-польски — tydzień."}]},"w":[["poniedziałek","понедельник","W poniedziałek zaczynam pracę o ósmej.","В понедельник я начинаю работу в восемь."],["wtorek","вторник","We wtorek mam kurs.","Во вторник у меня курс."],["środa","среда","W środę idziemy do zoo.","В среду мы идём в зоопарк."],["czwartek","четверг","W czwartek gotuję obiad.","В четверг я готовлю обед."],["piątek","пятница","W piątek jest impreza.","В пятницу вечеринка."],["sobota","суббота","W sobotę śpię długo.","В субботу я долго сплю."],["niedziela","воскресенье","W niedzielę duże sklepy są zamknięte.","В воскресенье большие магазины закрыты."],["tydzień","неделя","Mama jest u mnie tydzień.","Мама у меня неделю."],["weekend","выходные","Co robisz w weekend?","Что делаешь на выходных?"],["mieć wolne","иметь выходной","Jutro mam wolne.","Завтра у меня выходной."],["odpoczywać","отдыхать","W niedzielę odpoczywamy.","В воскресенье мы отдыхаем."],["codziennie","каждый день","Codziennie uczę się polskiego.","Я каждый день учу польский."]],"dr":[{"k":"gap","s":"___ wtorek mam kurs.","h":"во","a":["We"],"w":"we wtorek — как «во вторник»."},{"k":"gap","s":"W ___ idziemy do teatru (piątek).","a":["piątek"],"w":"Мужской род не меняется: w piątek."},{"k":"gap","s":"W ___ odpoczywam (niedziela).","a":["niedzielę"],"w":"Женский род: -a → -ę."},{"k":"build","pl":"Co robisz w weekend?","ru":"Что ты делаешь на выходных?"},{"k":"tr","ru":"В среду у меня выходной.","a":["W środę mam wolne.","W środę mam dzień wolny."]},{"k":"mc","q":"«Неделя» по-польски —","o":["tydzień","niedziela","dzień"],"a":0,"w":"niedziela — воскресенье."}],"snd":{"t":"Окончания -ę и -ą: idę — idą","how":["**В глаголах окончание показывает, кто действует:** idę (я иду) и idą (они идут), robię (я делаю) и robią (они делают). Проглотишь окончание — и непонятно: я или они?","**-ę в конце** звучит почти как чистое e, носовой оттенок едва слышен. **-ą в конце** — o с ясным носовым призвуком: губы округляются, воздух идёт и через нос.","**w перед глухой согласной звучит как f:** wtorek, w piątek, w sklepie. В русском так же: «вторник» начинается со звука ф. Пишем всё равно w."],"pairs":[["idę","idą","иду","идут"],["robię","robią","делаю","делают"],["piszę","piszą","пишу","пишут"]],"say":["We wtorek idę do pracy.","W sobotę jadą do Krakowa.","W środę mam wolne.","Co robisz w piątek?"]},"wr":{"t":"Дни недели с маленькой буквы; запятая перед żeby и ponieważ","rule":["**Дни недели и месяцы пишем с маленькой буквы**, как в русском: w poniedziałek, w listopadzie. С большой — только в начале предложения.","**Запятая перед żeby (чтобы) и ponieważ (потому что)** — как в русском: Uczę się polskiego, żeby rozmawiać z sąsiadami. Nie idę do pracy, ponieważ mam wolne."],"x":[{"k":"choice","s":"Spotkanie jest we ___.","o":["wtorek","Wtorek"],"a":"wtorek","w":"Дни недели — с маленькой буквы."},{"k":"choice","s":"W ___ jedziemy do Krakowa.","o":["sobotę","Sobotę"],"a":"sobotę","w":"С маленькой буквы, как в русском."},{"k":"comma","s":"Uczę się polskiego żeby rozmawiać z sąsiadami.","a":"Uczę się polskiego, żeby rozmawiać z sąsiadami."},{"k":"comma","s":"Nie idę do pracy ponieważ mam wolne.","a":"Nie idę do pracy, ponieważ mam wolne."},{"k":"comma","s":"W sobotę i w niedzielę odpoczywam.","a":"W sobotę i w niedzielę odpoczywam."},{"k":"spell","s":"pi_tek","o":["ą","on"],"a":"ą","w":"Слышим on, пишем ą: piątek."}],"dict":["We wtorek mam kurs, a w środę mam wolne.","W niedzielę odpoczywamy."]},"rd":{"pl":"Mama Nadii jest we Wrocławiu przez tydzień. W poniedziałek i we wtorek Nadia pracuje, a mama spaceruje po mieście. W środę razem jadą tramwajem do zoo. Mama najbardziej lubi słonie. W czwartek pani Basia zaprasza je na kolację. W piątek idą do teatru. W sobotę jadą pociągiem do Krakowa. W niedzielę duże sklepy są zamknięte, więc odpoczywają w domu i piją herbatę.","ru":"Мама Нади во Вроцлаве на неделю. В понедельник и во вторник Надя работает, а мама гуляет по городу. В среду они вместе едут на трамвае в зоопарк. Больше всего мама любит слонов. В четверг пани Бася приглашает их на ужин. В пятницу они идут в театр. В субботу едут на поезде в Краков. В воскресенье большие магазины закрыты, поэтому они отдыхают дома и пьют чай.","q":[{"q":"Co robi mama w poniedziałek?","o":["spaceruje po mieście","pracuje","jedzie do Krakowa"],"a":0},{"q":"Jakie zwierzęta mama lubi najbardziej?","o":["słonie","lwy","małpy"],"a":0},{"q":"Kiedy jadą do Krakowa?","o":["w sobotę","w piątek","w niedzielę"],"a":0}]},"trap":["niedziela","«неделя»","«воскресенье». Неделя по-польски — tydzień"],"life":"Большие магазины в Польше по воскресеньям обычно закрыты: работают маленькие магазины, заправки и несколько торговых воскресений в году. Покупки лучше планировать на субботу. Учреждения (urząd) часто работают в будни примерно до 15–16 часов: проверяй часы на их сайте.","role":{"ru":"Ола — подруга. Расскажи ей о своих планах на неделю.","who":"przyjaciółka Ola","open":"Cześć! Co robisz w tym tygodniu?","goal":["Расскажи, когда ты работаешь","Скажи, когда ты свободна","Расскажи про выходные"],"steps":[["Cześć! Co robisz w tym tygodniu?","Скажи, что в понедельник и во вторник работаешь","W poniedziałek i we wtorek pracuję."],["A w środę? Masz czas?","Скажи, что в среду у тебя выходной","W środę mam wolne."],["Super! Idziemy w środę do kina?","Согласись и спроси, во сколько","Chętnie! O której?"],["O osiemnastej. A co robisz w weekend?","Скажи: в субботу еду в Краков","W sobotę jadę do Krakowa."]]},"boss":[{"k":"mc","q":"___ wtorek","o":["we","w","wo"],"a":0,"w":"we wtorek — как «во вторник»."},{"k":"mc","q":"w ___ (środa)","o":["środę","środa","środzie"],"a":0,"w":"Когда? → винительный: środę."},{"k":"mc","q":"«tydzień» — это…","o":["неделя","день","воскресенье"],"a":0,"w":"niedziela — воскресенье."},{"k":"mc","q":"Какой день после «czwartek»?","o":["piątek","środa","sobota"],"a":0,"w":"czwartek → piątek."},{"k":"choice","s":"Do zobaczenia w ___!","o":["piątek","Piątek"],"a":"piątek","w":"Дни недели — с маленькой буквы."},{"k":"comma","s":"Uczę się polskiego żeby pracować w Polsce.","a":"Uczę się polskiego, żeby pracować w Polsce."},{"k":"gap","s":"W ___ śpię długo (sobota).","a":["sobotę"],"w":"w sobotę."},{"k":"tr","ru":"Что ты делаешь на выходных?","a":["Co robisz w weekend?","Co robisz w weekendy?"]},{"k":"listen","pl":"We wtorek i w czwartek mam kurs polskiego.","o":["курс во вторник и в четверг","курс в среду и в пятницу","курс в понедельник и в четверг"],"a":0},{"k":"listen","pl":"W niedzielę sklep jest zamknięty.","o":["в воскресенье магазин закрыт","в понедельник магазин открыт","всю неделю магазин закрыт"],"a":0}]},{"d":19,"t":"Погода и одежда","tp":"Jaka jest pogoda?","lvl":"A1","city":"Wrocław","goal":"Сказать, какая погода и сколько градусов, посоветовать, что надеть, и сказать «мне холодно».","story":{"t":"Сцена 11. Едем в Краков","ru":"Суббота, утро. Надя и мама собираются в Краков. Мама смотрит в окно.","l":[["Mama","Nadia, jaka jest dziś pogoda?","Надя, какая сегодня погода?"],["Nadia","Aplikacja mówi, że w Krakowie pada deszcz.","Приложение говорит, что в Кракове идёт дождь."],["Mama","Deszcz? A jest zimno?","Дождь? А холодно?"],["Nadia","Tylko pięć stopni. Weź ciepłą kurtkę i parasol.","Всего пять градусов. Возьми тёплую куртку и зонт."],["Mama","A buty? Te są ładne, ale niewygodne.","А обувь? Эти красивые, но неудобные."],["Nadia","Weź wygodne buty. Będziemy dużo chodzić.","Возьми удобную обувь. Мы будем много ходить."],["Mama","Dobrze. Brr, już jest mi zimno!","Хорошо. Брр, мне уже холодно!"],["Nadia","W pociągu będzie ciepło, mamo!","В поезде будет тепло, мама!"]],"q":[{"q":"Jaka jest pogoda w Krakowie?","o":["pada deszcz","świeci słońce","pada śnieg"],"a":0},{"q":"Jakie buty ma wziąć mama?","o":["wygodne","ładne, ale niewygodne","nowe"],"a":0}]},"why":{"t":"Почему «pada deszcz», а не «idzie deszcz»?","q":"По-русски дождь «идёт». А в польском дождь и снег «падают». И как сказать «мне холодно»?","p":["**Осадки падают:** pada deszcz (идёт дождь), pada śnieg (идёт снег), а часто просто **pada** — «идёт дождь». Логика как в русском слове «снегопад».","**Безличные слова на -o — как в русском:** zimno (холодно), ciepło (тепло), gorąco (жарко), ślisko (скользко). Только поляк обычно добавляет jest: Dziś jest zimno.","**Мне холодно = Jest mi zimno**, а не «ja zimno». Это дательный падеж, как русское «мне»: mi (мне), ci (тебе), mamie (маме).","**Температура:** jeden stopień, dwa stopnie, pięć stopni — правило «2–4 и 5+» ты уже знаешь по злотым! Мороз: minus pięć stopni."],"tb":{"h":["Погода","Польский","Русский"],"r":[["☀️","świeci słońce","светит солнце"],["🌧️","pada deszcz","идёт дождь"],["❄️","pada śnieg","идёт снег"],["💨","wieje wiatr","дует ветер"],["🥶","jest zimno","холодно"],["🌤️","jest ciepło","тепло"]]},"tb2":{"h":["Число","stopień"],"r":[["1","jeden stopień"],["2, 3, 4","dwa stopnie"],["5+","pięć stopni"],["22","dwadzieścia dwa stopnie"]]},"pr":[{"q":"Идёт снег = ___ śnieg.","o":["Pada","Idzie","Jest"],"a":0,"w":"Осадки «падают»: pada śnieg."},{"q":"Мне холодно = …","o":["Jest mi zimno.","Ja zimno.","Mam zimno."],"a":0,"w":"mi — как русское «мне»."},{"q":"dziesięć ___","o":["stopni","stopnie","stopień"],"a":0,"w":"5+ → stopni, как złotych."},{"q":"trzy ___","o":["stopnie","stopni","stopień"],"a":0,"w":"2–4 → stopnie, как złote."}]},"w":[["pogoda","погода","Jaka jest dziś pogoda?","Какая сегодня погода?"],["deszcz","дождь","Pada deszcz.","Идёт дождь."],["śnieg","снег","W grudniu pada śnieg.","В декабре идёт снег."],["słońce","солнце","Świeci słońce.","Светит солнце."],["wiatr","ветер","Wieje silny wiatr.","Дует сильный ветер."],["zimno","холодно","Jest mi zimno.","Мне холодно."],["ciepło","тепло","Dziś jest ciepło.","Сегодня тепло."],["stopień","градус","Jest pięć stopni.","Пять градусов."],["kurtka","куртка","Weź ciepłą kurtkę.","Возьми тёплую куртку."],["buty","обувь, ботинки","Te buty są wygodne.","Эта обувь удобная."],["parasol","зонт","Mam parasol w torbie.","У меня зонт в сумке."],["wygodny","удобный","To jest wygodne krzesło.","Это удобный стул."]],"dr":[{"k":"gap","s":"Dziś ___ deszcz.","h":"идёт","a":["pada"],"w":"Осадки «падают»: pada deszcz."},{"k":"gap","s":"Jest ___ zimno.","h":"мне","a":["mi"],"w":"Jest mi zimno — мне холодно."},{"k":"gap","s":"Jest dwadzieścia ___ (stopień).","a":["stopni"],"w":"20 → stopni (5+)."},{"k":"build","pl":"Weź ciepłą kurtkę i parasol.","ru":"Возьми тёплую куртку и зонт."},{"k":"tr","ru":"Какая сегодня погода?","a":["Jaka jest dziś pogoda?","Jaka jest dzisiaj pogoda?","Jaka dziś pogoda?"]},{"k":"mc","q":"«Wygodne buty» — это…","o":["удобная обувь","выгодная обувь","модная обувь"],"a":0,"w":"wygodny = удобный. «Выгодный» — korzystny, opłacalny."}],"snd":{"t":"Повтор: ś, ć и ł в словах погоды","how":["**ś, ć, ź — мягкие:** кончик языка за нижними зубами, губы в улыбке. В погоде их много: śnieg, świeci, ciepło, pięć stopni.","**ł** — губы как для «у», и сразу разомкни их: słońce, ciepło. Русское «л» здесь даёт акцент.","**Интервальное повторение работает и для звуков.** Эти пары ты слышала в дни 9 и 10. Сегодня проверим, стало ли легче их различать."],"pairs":[["wieś","wiesz","деревня","знаешь"],["Kasia","kasza","Кася","каша"],["łata","lata","заплата","лета"]],"say":["Pada śnieg.","Świeci słońce.","Dziś jest ciepło.","Jest mi zimno."]},"wr":{"t":"ś или si, ć или ci; запятая перед więc и bo","rule":["**ś или si? ć или ci?** Мягкий звук перед согласной и в конце слова пишем со знаком: **śnieg, pięć, źle, dzień**. Перед гласной — через i: **siostra, ciepło, zima, dziecko**. Звук тот же, меняется только запись.","**Запятая перед więc и bo** (повтор) — как в русском перед «поэтому» и «потому что»: Pada deszcz, więc biorę parasol. Biorę kurtkę, bo jest zimno."],"x":[{"k":"spell","s":"_nieg","o":["ś","si"],"a":"ś","w":"Перед согласной → ś."},{"k":"spell","s":"_epło","o":["ci","ć"],"a":"ci","w":"Перед гласной → ci."},{"k":"spell","s":"pię_","o":["ć","ci"],"a":"ć","w":"В конце слова → ć."},{"k":"spell","s":"_ma","o":["zi","ź"],"a":"zi","w":"Перед гласной → zi: zima."},{"k":"comma","s":"Pada deszcz więc biorę parasol.","a":"Pada deszcz, więc biorę parasol."},{"k":"comma","s":"Biorę kurtkę bo jest zimno.","a":"Biorę kurtkę, bo jest zimno."}],"dict":["Pada śnieg, więc jest zimno.","Weź parasol, bo pada deszcz."]},"rd":{"pl":"Kraków w deszczu. Nadia i mama wysiadają z pociągu w Krakowie. Pada deszcz i wieje zimny wiatr. Jest tylko pięć stopni. Mama ma ciepłą kurtkę i wygodne buty, a Nadia parasol. Najpierw idą na Rynek Główny. Potem piją gorącą czekoladę w małej kawiarni. Po południu przestaje padać i świeci słońce. „Widzisz, mamo? W Polsce pogoda zmienia się szybko!” — śmieje się Nadia.","ru":"Краков под дождём. Надя и мама выходят из поезда в Кракове. Идёт дождь и дует холодный ветер. Всего пять градусов. У мамы тёплая куртка и удобная обувь, а у Нади зонт. Сначала они идут на Главную рыночную площадь. Потом пьют горячий шоколад в маленьком кафе. После обеда дождь прекращается и светит солнце. «Видишь, мама? В Польше погода меняется быстро!» — смеётся Надя.","q":[{"q":"Ile jest stopni w Krakowie?","o":["pięć","piętnaście","minus pięć"],"a":0},{"q":"Co piją w kawiarni?","o":["gorącą czekoladę","herbatę z cytryną","kawę z mlekiem"],"a":0},{"q":"Jaka jest pogoda po południu?","o":["świeci słońce","pada śnieg","pada deszcz"],"a":0}]},"trap":["wygodny","«выгодный»","«удобный»: wygodne buty — удобная обувь. «Выгодный» по-польски — korzystny, opłacalny"],"life":"Погода в Польше быстро меняется, особенно весной и осенью. О ней говорят постоянно, и это безопасная тема для разговора с соседями и коллегами. Прогноз (prognoza pogody) удобно смотреть в приложении или на сайте IMGW — это государственная метеослужба.","role":{"ru":"Ола звонит тебе. Расскажи, какая у тебя погода.","who":"koleżanka Ola przez telefon","open":"Cześć! Jaka jest u ciebie pogoda?","goal":["Опиши погоду","Назови температуру","Скажи, что ты взяла с собой"],"steps":[["Cześć! Jaka jest u ciebie pogoda?","Скажи, что идёт дождь и холодно","Pada deszcz i jest zimno."],["Ile jest stopni?","Скажи: пять градусов","Pięć stopni."],["Brr! Masz parasol?","Скажи: да, и тёплую куртку тоже","Tak, mam parasol i ciepłą kurtkę."],["A u nas świeci słońce!","Скажи: тебе везёт!","Masz szczęście!"]]},"boss":[{"k":"mc","q":"Идёт дождь —","o":["Pada deszcz.","Idzie deszcz.","Jest deszcz."],"a":0,"w":"Осадки «падают»."},{"k":"mc","q":"Мне холодно —","o":["Jest mi zimno.","Mam zimno.","Ja jestem zimno."],"a":0,"w":"mi = мне."},{"k":"mc","q":"cztery ___","o":["stopnie","stopni","stopień"],"a":0,"w":"2–4 → stopnie."},{"k":"mc","q":"«wygodny» —","o":["удобный","выгодный","весёлый"],"a":0,"w":"Ловушка дня!"},{"k":"spell","s":"_wieci słońce","o":["ś","si"],"a":"ś","w":"Перед согласной → ś."},{"k":"comma","s":"Jest zimno więc biorę kurtkę.","a":"Jest zimno, więc biorę kurtkę."},{"k":"gap","s":"Dziś ___ śnieg.","h":"идёт","a":["pada"],"w":"pada śnieg."},{"k":"tr","ru":"Возьми зонт.","a":["Weź parasol.","Weź parasolkę."]},{"k":"listen","pl":"Jutro będzie ciepło, dwadzieścia stopni.","o":["завтра тепло, +20","завтра холодно, +2","сегодня тепло, +12"],"a":0},{"k":"listen","pl":"Pada śnieg i wieje wiatr.","o":["идёт снег и дует ветер","идёт дождь и светит солнце","снега нет, ветер слабый"],"a":0}]},{"d":20,"t":"Почта и посылки: вид глагола","tp":"Na poczcie","lvl":"A1","city":"Wrocław","goal":"Отправить посылку и письмо, забрать посылку из почтомата и понять пары глаголов wysyłać / wysłać.","story":{"t":"Сцена 12. Посылка в Гданьск","ru":"У подруги Нади в Гданьске скоро день рождения. Надя идёт на почту отправить ей подарок.","l":[["Pani w okienku","Dzień dobry! Słucham?","Добрый день! Слушаю?"],["Nadia","Dzień dobry. Chcę nadać paczkę do Gdańska.","Добрый день. Я хочу отправить посылку в Гданьск."],["Pani w okienku","Proszę położyć paczkę na wadze. Dwa kilogramy.","Положите посылку на весы. Два килограмма."],["Nadia","Kiedy paczka dojdzie?","Когда посылка дойдёт?"],["Pani w okienku","Jutro albo pojutrze. Proszę wypełnić ten formularz.","Завтра или послезавтра. Заполните этот бланк."],["Nadia","Dobrze. I jeszcze list. Poproszę znaczek.","Хорошо. И ещё письмо. Марку, пожалуйста."],["Pani w okienku","Razem dwadzieścia trzy złote. Kartą?","Итого двадцать три злотых. Картой?"],["Nadia","Tak. A jutro odbiorę paczkę z paczkomatu.","Да. А завтра я заберу посылку из почтомата."]],"q":[{"q":"Dokąd Nadia wysyła paczkę?","o":["do Gdańska","do Krakowa","do Warszawy"],"a":0},{"q":"Kiedy paczka dojdzie?","o":["jutro albo pojutrze","za tydzień","dziś"],"a":0}]},"why":{"t":"wysyłam или wyślę? Вид глагола — как в русском","q":"По-русски: «отправляю» (процесс) и «отправлю» (результат). Польский делает точно так же! Это одна из самых больших удач для русскоязычных.","p":["**Несовершенный вид — процесс, привычка:** wysyłać (отправлять), odbierać (забирать), kupować (покупать). Codziennie wysyłam maile — каждый день отправляю письма.","**Совершенный вид — результат, один раз:** wysłać (отправить), odebrać (забрать), kupić (купить). Jutro wyślę list — завтра отправлю письмо.","**Почему «wyślę» — это будущее?** Как в русском: совершенный вид в форме настоящего времени означает будущее. Отправлю = wyślę, заберу = odbiorę, куплю = kupię. Никакого «będę» не нужно.","**Пары образуются как в русском:** приставкой (robić → zrobić, как «делать → сделать») или суффиксом (wysyłać → wysłać, kupować → kupić). На почте говорят ещё nadawać / nadać — отдавать посылку на отправку."],"tb":{"h":["Несов. (процесс)","Сов. (результат)","Русский"],"r":[["wysyłać","wysłać","отправлять / отправить"],["nadawać","nadać","сдавать / сдать на почту"],["odbierać","odebrać","забирать / забрать"],["kupować","kupić","покупать / купить"],["robić","zrobić","делать / сделать"]]},"tb2":{"h":["Сейчас (несов.)","Будущее (сов.)"],"r":[["wysyłam — отправляю","wyślę — отправлю"],["odbieram — забираю","odbiorę — заберу"],["kupuję — покупаю","kupię — куплю"],["robię — делаю","zrobię — сделаю"]]},"pr":[{"q":"Jutro ___ list (отправлю).","o":["wyślę","wysyłam"],"a":0,"w":"Результат в будущем → совершенный вид: wyślę."},{"q":"Codziennie ___ maile (отправляю).","o":["wysyłam","wyślę"],"a":0,"w":"Привычка → несовершенный вид: wysyłam."},{"q":"Пара к «odbierać»:","o":["odebrać","odbierać się","odbierzeć"],"a":0,"w":"odbierać / odebrać — забирать / забрать."},{"q":"zrobię = ?","o":["сделаю","делаю","сделал"],"a":0,"w":"Совершенный вид в форме настоящего = будущее."}]},"w":[["poczta","почта","Idę na pocztę.","Я иду на почту."],["paczka","посылка","Paczka jest ciężka.","Посылка тяжёлая."],["list","письмо","Piszę list do babci.","Я пишу письмо бабушке."],["znaczek","марка","Poproszę znaczek na list.","Марку на письмо, пожалуйста."],["koperta","конверт","Gdzie są koperty?","Где конверты?"],["adres","адрес","Proszę napisać adres.","Напишите адрес."],["kod pocztowy","почтовый индекс","Jaki jest kod pocztowy?","Какой почтовый индекс?"],["paczkomat","почтомат (автомат для посылок)","Odbieram paczkę z paczkomatu.","Я забираю посылку из почтомата."],["nadać","отправить (сдать на почте)","Chcę nadać paczkę.","Я хочу отправить посылку."],["odebrać","забрать, получить","Jutro odbiorę paczkę.","Завтра я заберу посылку."],["wysłać","отправить, выслать","Wyślę ci SMS.","Я отправлю тебе СМС."],["formularz","бланк, анкета","Proszę wypełnić formularz.","Заполните бланк."]],"dr":[{"k":"gap","s":"Jutro ___ paczkę.","h":"заберу","a":["odbiorę"],"w":"Совершенный вид → будущее: odbiorę."},{"k":"gap","s":"Codziennie ___ listy.","h":"пишу","a":["piszę"],"w":"Привычка → несовершенный вид: piszę."},{"k":"mc","q":"«Я отправлю письмо завтра» —","o":["Wyślę list jutro.","Wysyłam list jutro.","Wysłać list jutro."],"a":0,"w":"Результат в будущем → wyślę."},{"k":"build","pl":"Chcę nadać paczkę do Gdańska.","ru":"Я хочу отправить посылку в Гданьск."},{"k":"tr","ru":"Марку, пожалуйста.","a":["Poproszę znaczek.","Znaczek, proszę.","Proszę znaczek."]},{"k":"mc","q":"«List» по-польски — это…","o":["письмо","лист бумаги","лист дерева"],"a":0,"w":"Ловушка! Лист бумаги — kartka, лист дерева — liść."}],"snd":{"t":"n и ń: dzwon — dzwoń","how":["**ń** — мягкое «нь», как в русском слове «конь»: koń, dzień, słońce. Перед гласной пишется **ni**: nie, nic, niebo — звук тот же.","**n** — твёрдое, как в русском «нос»: nos, ton, dzwon.","Разница меняет смысл: **dzwon** — колокол, **dzwoń!** — звони! **len** — лён, **leń** — лентяй."],"pairs":[["dzwon","dzwoń","колокол","звони!"],["ton","toń","тон","водная глубь"],["len","leń","лён","лентяй"]],"say":["Zadzwonię jutro.","Dzień dobry, chcę nadać paczkę.","Nie mam znaczka.","Paczka jest w paczkomacie."]},"wr":{"t":"Адрес по-польски; большая буква","rule":["**Адрес пишут так:** имя и фамилия → улица, дом/квартира → индекс и город. Например: Nadia Iwanowa, ul. Długa 5/12, 50-001 Wrocław. **ul.** = ulica, **5/12** = дом 5, квартира 12. Индекс: две цифры, дефис, три цифры.","**Большая буква:** города, улицы, страны — с большой (Wrocław, Długa, Polska), а слово ulica и сокращение ul. — с маленькой, как в русском «ул. Садовая»."],"x":[{"k":"choice","s":"___ Długa 5","o":["ul.","Ul."],"a":"ul.","w":"Сокращение ul. — с маленькой буквы."},{"k":"choice","s":"50-001 ___","o":["Wrocław","wrocław"],"a":"Wrocław","w":"Город — с большой буквы."},{"k":"choice","s":"Jutro ___ paczkę.","o":["odbiorę","odbieram"],"a":"odbiorę","w":"Завтра + результат → совершенный вид."},{"k":"comma","s":"Wyślę list kiedy kupię znaczek.","a":"Wyślę list, kiedy kupię znaczek."},{"k":"comma","s":"Idę na pocztę bo muszę nadać paczkę.","a":"Idę na pocztę, bo muszę nadać paczkę."},{"k":"spell","s":"p_esyłka","o":["rz","sz"],"a":"rz","w":"После p → rz: przesyłka (отправление)."}],"dict":["Chcę nadać paczkę do Gdańska.","Jutro odbiorę paczkę z paczkomatu."]},"rd":{"pl":"Paczkomat. W Polsce paczki często przychodzą do paczkomatu. To duża szafa z małymi skrytkami. Nadia dostaje SMS z kodem i idzie do paczkomatu obok sklepu. Wpisuje kod albo skanuje go telefonem. Skrytka się otwiera i paczka jest w środku. Nadia nie musi czekać na kuriera ani stać w kolejce na poczcie. Paczkomat działa całą dobę, także w niedzielę.","ru":"Почтомат. В Польше посылки часто приходят в почтомат. Это большой шкаф с маленькими ячейками. Надя получает СМС с кодом и идёт к почтомату рядом с магазином. Она вводит код или сканирует его телефоном. Ячейка открывается, и посылка внутри. Наде не нужно ждать курьера или стоять в очереди на почте. Почтомат работает круглосуточно, даже в воскресенье.","q":[{"q":"Co Nadia dostaje w SMS-ie?","o":["kod","adres","zdjęcie"],"a":0},{"q":"Gdzie jest paczkomat?","o":["obok sklepu","na poczcie","na dworcu"],"a":0},{"q":"Kiedy działa paczkomat?","o":["całą dobę","od ósmej do szesnastej","tylko w tygodniu"],"a":0}]},"trap":["list","«лист»","«письмо»: piszę list — пишу письмо. Лист бумаги — kartka, лист дерева — liść"],"life":"Почтомат (paczkomat) — самый популярный способ получать посылки в Польше: код приходит в SMS или в приложение, забрать можно в любое время. На почте (Poczta Polska) часто берут номерок в очереди в автомате у входа. По номеру отправления можно следить за доставкой на сайте перевозчика.","role":{"ru":"Ты на почте. Ола — сотрудница в окошке.","who":"pracownica poczty w okienku","open":"Dzień dobry! Słucham?","goal":["Отправь посылку","Узнай, когда она дойдёт","Купи марку и заплати"],"steps":[["Dzień dobry! Słucham?","Скажи, что хочешь отправить посылку в Гданьск","Chcę nadać paczkę do Gdańska."],["Dobrze. Proszę wypełnić formularz.","Спроси, когда посылка дойдёт","Kiedy paczka dojdzie?"],["Jutro albo pojutrze. Coś jeszcze?","Попроси марку на письмо","Poproszę znaczek na list."],["Razem dwadzieścia trzy złote.","Скажи, что платишь картой","Płacę kartą."]]},"boss":[{"k":"mc","q":"Jutro ___ list.","o":["wyślę","wysyłam","wysłać"],"a":0,"w":"Будущее + результат → wyślę."},{"k":"mc","q":"Codziennie ___ paczki.","o":["odbieram","odbiorę","odebrać" której jest pociąg mamy?","o":["o dziesiątej piętnaście","o dziesiątej","o piętnastej"],"a":0},{"q":"Kiedy mama ma przyjechać znowu?","o":["w maju","w niedzielę","zimą"],"a":0}]},"why":{"t":"Все правила недели на одной странице","q":"Перед экзаменом — быстрый повтор шести правил недели 3.","p":["**Дорога:** куда? w lewo / w prawo / prosto · где? po lewej / po prawej stronie · obok, koło, naprzeciwko + родительный (obok apteki).","**Транспорт:** iść (пешком) / jechać (на чём-то) · чем? творительный: tramwajem, taksówką · jadę, jedziesz… jadą.","**Время:** która godzina? — druga, trzecia… · o której? — o drugiej · wpół do trzeciej = 2:30 · kwadrans po drugiej = 2:15.","**Дни:** w poniedziałek, we wtorek, w środę, w sobotę, w niedzielę — как «в среду, во вторник».","**Погода:** pada deszcz / śnieg · jest zimno · jest mi zimno · 2–4 stopnie, 5+ stopni.","**Вид глагола:** wysyłam (отправляю) / wyślę (отправлю) · odbieram / odbiorę."],"tb":{"h":["Тема","Пример"],"r":[["Дорога","Proszę iść prosto, potem w lewo."],["Транспорт","Jadę tramwajem na dworzec."],["Время","Spotkajmy się o wpół do piątej."],["Дни","We wtorek pracuję, a w środę mam wolne."],["Погода","Pada deszcz i jest mi zimno."],["Вид","Jutro wyślę list."]]},"pr":[{"q":"Apteka jest ___ banku.","o":["obok","w prawo"],"a":0,"w":"obok + родительный."},{"q":"___ wtorek","o":["we","w"],"a":0,"w":"we wtorek."},{"q":"Jutro ___ paczkę.","o":["odbiorę","odbieram"],"a":0,"w":"Будущее + результат → совершенный вид."}]},"w":[["pożegnać się","попрощаться","Muszę się pożegnać.","Мне нужно попрощаться."],["przyjechać","приехать","Przyjedź w maju!","Приезжай в мае!"],["wrócić","вернуться","Wrócę wieczorem.","Я вернусь вечером."],["obiecywać / obiecać","обещать / пообещать","Obiecuję, że zadzwonię.","Обещаю, что позвоню."],["tęsknić","скучать","Będę tęsknić.","Я буду скучать."],["podróż","поездка, путешествие","Szczęśliwej podróży!","Счастливого пути!"],["córeczka","доченька","Pa, córeczko!","Пока, доченька!"],["wtedy","тогда","W var SOUNDS=[{"id":"akcent","t":"Ударение и чёткие гласные (нет «аканья»)","how":["**Ударение почти всегда на предпоследнем слоге:** dzię-KU-ję, prze-PRA-szam, Wro-CŁA-wiu. Если слово удлиняется, ударение переезжает: PO-lska → w POL-sce, u-NI-wer-sy-tet → u-ni-wer-SY-te-cie.","**Главный русский акцент — «аканье».** В польском безударные o и e звучат так же чётко, как ударные: mleko, woda, dobrze. Никакого «малако» и «вада».","Польское **e** открытое, как в русском «это», и не смягчает согласную перед собой: ten, dzień dobry, mleko."],"pairs":[["woda","wody","вода","воды"],["Polska","w Polsce","Польша","в Польше"],["mleko","mleka","молоко","молока"]],"say":["Dziękuję bardzo.","Przepraszam.","Mleko i woda.","Dobrze, dobrze."]},{"id":"szcz","t":"Твёрдые sz, cz, rz/ż, dż","how":["Кончик языка поднят к нёбу за верхними зубами, губы чуть вытянуты вперёд. Звук «толстый», низкий: szkoła, czas, żona, rzeka, dżem.","**rz = ż** по звучанию. После p, t, k, ch rz звучит глухо, как sz: przepraszam, trzy, krzesło.","Польское cz твёрже русского «ч»: не смягчай его."],"pairs":[["czas","ciasto","время","тесто"],["szal","żal","шаль","жаль"],["szyć","żyć","шить","жить"]],"say":["Szkoła jest blisko.","Czy masz czas?","Rzeka i morze.","Przepraszam, trzy kawy."]},{"id":"sc","t":"Мягкие ś, ć, ź, dź (si, ci, zi, dzi)","how":["Кончик языка за нижними зубами, спинка выгнута к нёбу, губы в улыбке. Звук тонкий и высокий: ś — śnieg, ć — pięć, ź — źle, dź — dzień.","Перед гласной пишут через i: si, ci, zi, dzi (siostra, ciepło, zima, dziecko).","Типичная ошибка русских: путать ś и sz. Слушай высоту: ś звучит «звонко-тонко», sz — «глухо-толсто»."],"pairs":[["wiesz","wieś","знаешь","деревня"],["kasza","Kasia","каша","Кася"],["czy","ci","ли","тебе"],["proszę","prosię","прошу","поросёнок"]],"say":["Dzień dobry!","Sześć złotych.","Ciepło dzisiaj.","Moja siostra mieszka we Wrocławiu."]},{"id":"nos","t":"Носовые ą и ę","how":["**ę в конце слова** почти как e с лёгким носовым оттенком: proszę, kawę, dziękuję. Не говори «эн» на конце.","**ą в конце слова** — o с носовым призвуком, губы к концу округляются: idą, dużą, są.","Внутри слова перед p, b → om/em (ząb, kępa); перед t, d → on/en (kąt, będę); перед k, g → «задний» n (ręka, mąka); перед l, ł носовость пропадает (wziął, zaczęli)."],"pairs":[["duża","dużą","большая","большую"],["woda","wodę","вода","воду"],["sama","samą","сама","саму"]],"say":["Proszę bardzo.","Mąż i żona.","Pięć złotych.","Dziękuję, idę do domu."]},{"id":"l","t":"ł и l","how":["**ł** — губы как для «у» и сразу разомкнуть, как английское w в слове water. Язык не касается зубов: łyżka, mały, był.","**l** мягче русского «л», почти как «ль» в слове «лес»: las, lato, Polska."],"pairs":[["lata","łata","лета","заплата"],["laska","łaska","трость","милость"],["bal","bał","бал","боялся"]],"say":["Mała łyżka.","Był w Polsce.","Lato i las.","Pół kilo jabłek."]},{"id":"y","t":"y и i","how":["**y** ниже и расслабленнее русского «ы», ближе к середине между «ы» и «э»: być, my, syn.","**i** — обычное «и», согласная перед ним всегда мягкая: mi, pić, bić."],"pairs":[["być","bić","быть","бить"],["my","mi","мы","мне"],["pył","pił","пыль","пил"]],"say":["My jesteśmy tutaj.","Syn pije mleko.","Być albo nie być.","Ryba i ser."]},{"id":"dz","t":"dz, dź, dż — один звук, а не два","how":["Это слитные звуки, как русское «ц», только звонкие. **dz** — звонкое «ц», один толчок: dzwon, bardzo (bar-dzo).","**dź / dzi** — мягкое, слитное: dzień, dziecko. **dż** — твёрдое: dżem, dżungla.","Не разделяй на «д + з»: dzień звучит одним толчком."],"pairs":[["dzwon","dzień","колокол","день"],["dżem","dzień","джем","день"]],"say":["Dzień dobry!","Bardzo dziękuję.","Dzieci jedzą dżem.","Dzwonię jutro."]},{"id":"uo","t":"ó = u, h = ch: пишется по-разному, звучит одинаково","how":["**ó и u** звучат одинаково, как «у»: mój, bułka. Разница только на письме (проверка через o: mój — moja).","**h и ch** тоже звучат одинаково, как мягкое «х»: herbata, chleb.","Пары ниже звучат **одинаково** — это нормально. Отличить их можно только по смыслу и на письме."],"pairs":[["Bóg","buk","Бог","бук (дерево)"],["morze","może","море","может"],["hart","chart","закалка","борзая"]],"say":["Mój brat jest w domu.","Chleb i herbata.","Bułka z masłem.","Król i królowa."]},{"id":"nos2","t":"Носовые ę и ą внутри слова","how":["**Перед t, d, c, ć, cz** ę и ą звучат как en и on: pięć, będę, kąt, skręcić. **Перед k и g** — с задним n, как в английском «long»: ręka, mąka.","**Перед p и b** — как em и om: ząb, gęba. **Перед s, sz, z, ż, w, f, ch** — чистый носовой гласный, без n: wąs, gęś, mięso.","**Перед l и ł** носового звука нет совсем: wziął, zaczęła. В парах ниже слушай: в первой разница только в гласной (o или e), во второй и третьей — есть ли носовой призвук вообще."],"pairs":[["mąka","męka","мука (для теста)","мучение"],["pięć","piec","пять","печь"],["wąs","was","ус","вас"]],"say":["Proszę skręcić w lewo.","Pięć minut pieszo.","Idę prosto, potem w prawo.","Mąka jest w sklepie obok."]},{"id":"ssz","t":"s, c — свист; sz, cz — шипение","how":["**s и c** — свистящие, как русские «с» и «ц»: кончик языка у зубов. Слова: sok, kasa, cena.","**sz и cz** — шипящие и твёрдые: кончик языка поднят за верхние зубы к нёбу, губы чуть вперёд. Слова: szok, kasza, czas. Польское **cz всегда твёрдое** — не мягкое русское «ч».","Зачем это нужно: **kasa** — касса, а **kasza** — каша. На вокзале ты идёшь в kasa biletowa, а не за кашей!"],"pairs":[["sok","szok","сок","шок"],["kasa","kasza","касса","каша"],["lecę","leczę","лечу (лететь)","лечу (лечить)"]],"say":["Gdzie jest kasa biletowa?","Czekam na przystanku.","Jadę tramwajem.","Czy ten autobus jedzie na dworzec?"]},{"id":"voice","t":"Звонкие и глухие пары","how":["**Звонкие b, d, g, z, ż, dź** — голосовые связки дрожат: положи ладонь на горло и почувствуешь. **Глухие p, t, k, s, sz, ć** — связки молчат.","Как в русском, в конце слова звонкие оглушаются: chleb звучит с p на конце, wóz — с s. Но в начале и в середине слова разница меняет смысл: **koza** — коза, **kosa** — коса.","**dź и ć** — мягкая пара: dzień — день, cień — тень. В названиях часов dź много: dziewiąta, dziesiąta, dwudziesta. Это один звук, не «д» плюс «зь»."],"pairs":[["koza","kosa","коза","коса"],["dzień","cień","день","тень"],["bić","pić","бить","пить"]],"say":["Jest dziewiąta.","O dziesiątej rano.","Spotkajmy się o wpół do piątej.","Za kwadrans dwudziesta."]},{"id":"ea","t":"Окончания -ę и -ą: idę — idą","how":["**В глаголах окончание показывает, кто действует:** idę (я иду) и idą (они идут), robię (я делаю) и robią (они делают). Проглотишь окончание — и непонятно: я или они?","**-ę в конце** звучит почти как чистое e, носовой оттенок едва слышен. **-ą в конце** — o с ясным носовым призвуком: губы округляются, воздух идёт и через нос.","**w перед глухой согласной звучит как f:** wtorek, w piątek, w sklepie. В русском так же: «вторник» начинается со звука ф. Пишем всё равно w."],"pairs":[["idę","idą","иду","идут"],["robię","robią","делаю","делают"],["piszę","piszą","пишу","пишут"]],"say":["We wtorek idę do pracy.","W sobotę jadą do Krakowa.","W środę mam wolne.","Co robisz w piątek?"]},{"id":"nn","t":"n и ń: dzwon — dzwoń","how":["**ń** — мягкое «нь», как в русском слове «конь»: koń, dzień, słońce. Перед гласной пишется **ni**: nie, nic, niebo — звук тот же.","**n** — твёрдое, как в русском «нос»: nos, ton, dzwon.","Разница меняет смысл: **dzwon** — колокол, **dzwoń!** — звони! **len** — лён, **leń** — лентяй."],"pairs":[["dzwon","dzwoń","колокол","звони!"],["ton","toń","тон","водная глубь"],["len","leń","лён","лентяй"]],"say":["Zadzwonię jutro.","Dzień dobry, chcę nadać paczkę.","Nie mam znaczka.","Paczka jest w paczkomacie."]}];
var PROG={"intro":"Программа «Польски Мост» — от нуля до экзамена B1. Как в школе: каждый день читаем, пишем, учим грамматику, слова, слушаем и говорим. Сроки честные: по оценкам Cambridge, A1 — около 90–100 часов, A2 — 180–200, B1 — 350–400 часов учёбы с преподавателем. Русский язык и жизнь в Польше ускоряют путь, но магии нет.","tracks":[{"name":"Стандарт · 30 мин в день","res":"≈ 15 ч в месяц · через год уверенный A2, B1 — примерно через 15–18 месяцев"},{"name":"Интенсив · 60 мин в день","res":"урок + 30 мин польского вокруг тебя (радио, сериалы, разговоры) · через год — экзамен B1"}],"stages":[{"m":"Месяц 1 · дни 1–30","lvl":"A1","name":"Приезд","can":"Справляюсь в магазине, кафе и аптеке, знаю цифры, рассказываю о себе.","gram":"Алфавит и звуки · być, mieć · числа до 100 · множественное число · винительный падеж · глаголы -m/-sz и -ę/-esz","write":"ó/u · rz/ż · ch/h · nie с глаголами · большая буква · запятые перед a, ale, bo, więc, że, czy","exam":"Мини-экзамены каждую неделю"},{"m":"Месяц 2 · дни 31–60","lvl":"A1","name":"Город и дом","can":"Езжу на транспорте, понимаю время и даты, решаю вопросы с квартирой, PESEL и банком.","gram":"Родительный (nie ma, do, od, z, bez) · местный (w, na, o) · iść/jechać · прошедшее время","write":"SMS, объявление, анкета · запятая перед który, gdy, żeby · -ii/-ji","exam":"Тест A1 (часть 1)"},{"m":"Месяц 3 · дни 61–90","lvl":"A1 → A2","name":"Работа и врач","can":"Записываюсь к врачу, говорю о работе, звоню по телефону.","gram":"Будущее время · вид глагола (введение) · повелительное наклонение · дательный местоимений","write":"Короткое письмо и email 50–80 слов","exam":"Экзамен A1 (день 89–90)"},{"m":"Месяцы 4–6 · дни 91–180","lvl":"A2","name":"Жизнь","can":"Поддерживаю бытовые разговоры, рассказываю о прошлом и планах, пишу письма.","gram":"Все падежи в единственном числе · творительный · вид глагола уверенно · сравнение · условное наклонение (введение)","write":"Письмо или email 80–100 слов · сложные предложения с запятыми ·
